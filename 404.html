<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>페이지를 찾지 못했어요 · 차게임의 게임공장</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 차게임의 게임공장 공용 스타일: 색 토큰(라이트/다크), 글꼴, 버튼, 머리띠(.bar). index·lesson·about·404가 함께 씁니다.
   색: 남색(브랜드) + 써냥이 눈 색 호박빛(강조) · 사회 = 청록, 과학 = 파랑. 글꼴: Black Han Sans(로고·큰 제목) + IBM Plex Sans KR(본문). */
:root{
  --bg:#FFFFFF; --soft:#F4F5FA; --surface:#FFFFFF; --ink:#181B32; --muted:#62677F; --line:#E2E4EE;
  --brand:#3A3DBE; --brand-ink:#FFFFFF; --brand-soft:#ECEDFC; --brand-deep:#262887;
  --amber:#F4B331; --amber-ink:#3A2500; --amber-soft:#FFF1CF;
  --soc:#0C8469; --soc-soft:#DCF3EB; --sci:#2D63D8; --sci-soft:#E1EAFD;
  --accent:var(--brand); --accent-ink:var(--brand-ink); --sea:var(--brand-soft);
  --banana:var(--amber); --banana-soft:var(--amber-soft); --fish:var(--brand); --fish-soft:var(--brand-soft);
  --good:#177A50; --good-soft:#DCF2E6; --bad-soft:#FCE5E1; --veil:rgba(14,16,38,.64);
  --shadow:0 1px 2px rgba(24,27,50,.05),0 8px 24px rgba(24,27,50,.07);
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --game:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1120; --soft:#161A2E; --surface:#1A1E35; --ink:#ECEEF8; --muted:#A3A8C3; --line:#2B3050;
  --brand:#9A9DFF; --brand-ink:#14153A; --brand-soft:#262A5C; --brand-deep:#C9CAFF;
  --amber:#F7C35A; --amber-ink:#2A1B00; --amber-soft:#3A2F14;
  --soc:#4FD1AE; --soc-soft:#123A30; --sci:#86ABFF; --sci-soft:#1B2D55;
  --good:#5CCB8C; --good-soft:#163828; --bad-soft:#3A2119; --veil:rgba(0,0,0,.74);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1120; --soft:#161A2E; --surface:#1A1E35; --ink:#ECEEF8; --muted:#A3A8C3; --line:#2B3050;
  --brand:#9A9DFF; --brand-ink:#14153A; --brand-soft:#262A5C; --brand-deep:#C9CAFF;
  --amber:#F7C35A; --amber-ink:#2A1B00; --amber-soft:#3A2F14;
  --soc:#4FD1AE; --soc-soft:#123A30; --sci:#86ABFF; --sci-soft:#1B2D55;
  --good:#5CCB8C; --good-soft:#163828; --bad-soft:#3A2119; --veil:rgba(0,0,0,.74);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:920px;margin:0 auto;padding-block:12px 80px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--game);font-weight:700;margin:0;line-height:1.25;text-wrap:balance;word-break:keep-all;letter-spacing:-.01em}
a{color:var(--brand)}
button,.btn{font-family:var(--game)}
button{cursor:pointer;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.i{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em}

/* 차시·소개 페이지 머리 그림띠 */
.mast{display:grid;gap:8px;padding:24px 26px 22px;border-radius:24px;color:#FFFFFF;
  background:radial-gradient(circle at 92% 120%,rgba(255,255,255,.18) 0 90px,transparent 91px),radial-gradient(circle at 78% -30%,rgba(255,255,255,.12) 0 70px,transparent 71px),linear-gradient(120deg,#2F33B0,#6A55E8);position:relative;overflow:hidden}
.eyebrow{font-weight:600;font-size:.95rem;opacity:.85;letter-spacing:.02em}
.mast h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7vw,3rem);letter-spacing:0}
.mast p{margin:0;max-width:34em;text-wrap:pretty;opacity:.95}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:6px 18px;border-radius:12px;border:none;background:var(--brand);color:var(--brand-ink);text-decoration:none;font-size:1.05rem;font-weight:700;line-height:1.2}
.btn:hover{filter:brightness(1.06)}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.btn.alt:hover{border-color:var(--brand);filter:none}
.btn.sm{min-height:44px;font-size:1rem;padding:4px 14px}
.chipbtn{min-height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:6px 16px;font-size:1rem;font-weight:600;font-family:var(--game);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.chipbtn:hover{border-color:var(--brand);color:var(--brand)}

.foot{color:var(--muted);font-size:.9rem;display:flex;gap:6px 16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--muted)}

/* 머리띠: 왼쪽 써냥이 + 글자 로고, 오른쪽 도구 버튼. 모든 페이지 공통 */
.bar{display:flex;align-items:center;gap:10px 14px;min-height:72px;padding:8px 0;min-width:0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);min-width:0;flex:1 1 auto}
.brand .logo{width:48px;height:48px;flex:none;border-radius:14px;background:var(--amber-soft);object-fit:contain;padding:2px}
.bt{display:flex;flex-direction:column;min-width:0;line-height:1}
.bt small{font-family:var(--game);font-weight:700;font-size:.8rem;color:var(--brand);letter-spacing:.08em;white-space:nowrap}
.bt b{font-family:var(--display);font-weight:400;font-size:1.9rem;letter-spacing:-.01em;white-space:nowrap;color:var(--ink)}
.bt b em{font-style:normal;color:var(--brand)}
.btools{display:flex;gap:8px;align-items:center;flex:none}
.chipbtn.ghost{background:transparent}
.chipbtn[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:560px){.bt b{font-size:1.5rem}.brand .logo{width:42px;height:42px}.chipbtn .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.btools{gap:6px}.btools .chipbtn{padding:6px 12px;min-width:44px;justify-content:center}}

/* Layout: one centered card with a big home button. */
.wrap{min-height:100vh;min-height:100dvh;justify-content:center}
.box{background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:24px;padding:28px 22px;display:grid;gap:12px;justify-items:center;text-align:center}
.box .big{width:120px;height:120px;border-radius:50%;background:var(--amber-soft);padding:6px}
.box h1{font-size:clamp(1.7rem,6vw,2.4rem)}
.box p{margin:0;color:var(--muted);max-width:28em}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar"><a class="brand" href="https://wlfmghzm-dotcom.github.io/sahoe-game/" aria-label="차게임의 게임공장 첫 화면"><img class="logo" src="https://wlfmghzm-dotcom.github.io/sahoe-game/assets/sseonyang.png" width="48" height="48" alt=""><span class="bt"><small>차게임의</small><b>게임<em>공장</em></b></span></a><nav class="btools" aria-label="사이트 메뉴"></nav></header>
  <div class="box">
    <img class="big" src="https://wlfmghzm-dotcom.github.io/sahoe-game/assets/sseonyang.png" width="120" height="120" alt="">
    <h1>이 주소에는 게임이 없어요</h1>
    <p>주소가 바뀌었거나 잘못 적혔을 수 있어요. 게임공장 첫 화면에서 차시를 다시 찾아 주세요.</p>
    <a class="btn" id="home" href="https://wlfmghzm-dotcom.github.io/sahoe-game/">게임공장 첫 화면으로</a>
  </div>
</div>
<script>
/* GitHub Pages shows this page for any wrong address, at any depth. With no fixed address in site.json,
   guess the site folder: https://<id>.github.io/<저장소>/ */
(function(){
  var a=document.getElementById('home'); if(/^https?:/.test(a.getAttribute('href'))) return;
  try{
    var seg=location.pathname.split('/').filter(Boolean)[0];
    var user=/\.github\.io$/i.test(location.hostname) && seg && location.hostname.split('.')[0].toLowerCase()!==seg.toLowerCase();
    a.href = location.origin + '/' + (user && !/\.html?$/i.test(seg) ? seg + '/' : '');
    var b=document.querySelector('.brand'); if(b) b.href=a.href;
  }catch(e){}
})();
</script>
</body>
</html>
