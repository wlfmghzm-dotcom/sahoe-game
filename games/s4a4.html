<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>20년 뒤 일터 – 6-2 과학 주제 4 수업용 게임</title>
<meta name="description" content="6-2 과학 주제 4 「나의 진로는 과학과 어떤 관련이 있을까?」 수업용 게임. 미래 기술을 일터에 놓아 일하는 방식을 바꾸고 새 직업 자리를 만든 뒤, 친구 꿈에 이어지는 기술을 찾아 줘요.">
<meta name="eng-pair" content="s4b4.html">
<link rel="canonical" href="https://wlfmghzm-dotcom.github.io/sahoe-game/games/s4a4.html">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>20년 뒤 일터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 수업용 개념 체험 게임 엔진 (무역항 v3-2d-k에서 떼어 냄). 태블릿 가로 기준: HUD 한 줄 → [장면 63% | 패널 37%], 한 화면, 세로 스크롤 없음.
   그림은 전부 ASSETS(id → SVG 문자열/이미지 URI)에서 온다. 장면 = SCENE.renderScene(G) 한 곳, 패널·HUD = 장면과 독립된 HTML.
   게임마다 바꾸는 곳은 아래 스크립트 안의 표시된 구역 셋뿐이다: ① GAME  ② LOGIC  ③ SCENE + ASSETS. build.js가 채운다. */
:root{
  --bg:#EDF2EF; --surface:#FBF8F1; --ink:#1E2B3A; --muted:#55657A; --line:#DCD4C2;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#FBF8F1; --good:#4CAF7A; --bad:#D9534F; --veil:rgba(20,30,42,.62);
  --a-sea:#2E6F8E; --a-sea-d:#245A74; --a-shal:#4FA3B8; --a-shal-d:#3F8798; --a-sand:#EBD9B4; --a-sand-d:#D6C196;
  --a-land:#8DB48E; --a-land-d:#779D78; --a-wood:#A8754F; --a-wood-d:#8C603F; --a-navy:#1E2B3A; --a-navy-l:#33475C;
  --a-org:#E8743B; --a-org-d:#C95F2C; --a-grn:#4CAF7A; --a-grn-d:#3C9064; --a-red:#D9534F; --a-red-d:#B94340;
  --a-paper:#FBF8F1; --a-paper-d:#E6E0D2;
  --game:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A23; --surface:#1C2835; --ink:#F1ECE0; --muted:#A9B4C1; --line:#2F3E50;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#1E2B3A; --good:#4CAF7A; --bad:#D9534F; --veil:rgba(0,0,0,.7);
  --a-sea:#245A74; --a-sea-d:#1D4B61; --a-shal:#3F8798; --a-shal-d:#357484; --a-land:#779D78; --a-land-d:#668A67;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A23; --surface:#1C2835; --ink:#F1ECE0; --muted:#A9B4C1; --line:#2F3E50;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#1E2B3A; --good:#4CAF7A; --bad:#D9534F; --veil:rgba(0,0,0,.7);
  --a-sea:#245A74; --a-sea-d:#1D4B61; --a-shal:#3F8798; --a-shal-d:#357484; --a-land:#779D78; --a-land-d:#668A67;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.4;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:var(--game);color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--a-shal);outline-offset:2px}
.ico{width:26px;height:26px;display:block}

/* 아트 색 클래스 (ASSETS 안 SVG가 씀) */
.f-sea{fill:var(--a-sea)}.f-sead{fill:var(--a-sea-d)}.f-shal{fill:var(--a-shal)}.f-shald{fill:var(--a-shal-d)}
.f-sand{fill:var(--a-sand)}.f-sandd{fill:var(--a-sand-d)}.f-land{fill:var(--a-land)}.f-landd{fill:var(--a-land-d)}
.f-wood{fill:var(--a-wood)}.f-woodd{fill:var(--a-wood-d)}.f-navy{fill:var(--a-navy)}.f-navyl{fill:var(--a-navy-l)}
.f-org{fill:var(--a-org)}.f-orgd{fill:var(--a-org-d)}.f-grn{fill:var(--a-grn)}.f-grnd{fill:var(--a-grn-d)}
.f-red{fill:var(--a-red)}.f-paper{fill:var(--a-paper)}.f-paperd{fill:var(--a-paper-d)}
.s-line{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding-bottom:10px}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;padding-top:6px;min-height:58px}
.ib{width:50px;height:50px;border-radius:14px;background:var(--surface);display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.94)}
/* §13: 규칙·배지 버튼은 아이콘 아래 이름(블라인드 시험: 아이콘만으로는 몰랐음) */
.ib.lb{width:58px;grid-template-rows:auto auto;gap:0;align-content:center;font-family:var(--game);font-size:18px;line-height:1;color:var(--ink,currentColor)}
.ib.lb svg{width:24px;height:24px}
.ib.lb span{display:block;margin-top:1px}
.stg{display:flex;align-items:center;gap:10px;font-family:var(--game);font-size:22px;white-space:nowrap;min-width:0}
.pips{display:flex;gap:5px}
.pips i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.pips i.on{background:var(--accent)}.pips i.done{background:var(--good)}
.sp{flex:1}
.combo{font-family:var(--game);font-size:22px;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:4px 14px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.combo.on{opacity:1;transform:scale(1)}
.score{display:flex;align-items:baseline;gap:8px;background:var(--surface);border-radius:14px;padding:2px 16px;min-height:50px}
.score small{font-family:var(--game);font-size:18px;color:var(--muted)}
.score b{font-family:var(--game);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right;display:inline-block}
.score b.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25)}}

/* 본문 2단 */
.main{position:relative;display:grid;grid-template-columns:minmax(0,63fr) minmax(300px,37fr);gap:10px;min-height:0}
.scene{position:relative;min-height:0;border-radius:18px;overflow:hidden;background:var(--a-sea);touch-action:none;user-select:none;-webkit-user-select:none}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* 패널 */
.panel{min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.cap{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:18px;padding:12px}
.cap svg{width:64px;height:64px;flex:none}
.say{font-size:19px;line-height:1.42;word-break:keep-all;min-height:2.84em}
.say b{font-family:var(--game);font-weight:400;display:block;font-size:18px;color:var(--muted);margin-bottom:2px}
.big{font-family:var(--game);font-size:26px;min-height:60px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-shadow:inset 0 -5px 0 var(--accent-d)}
.big:active{transform:translateY(2px)}
.big .ico{width:24px;height:24px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.rc{background:var(--surface);border-radius:14px;padding:6px 6px 4px;text-align:center;position:relative}
.rc svg{width:100%;height:58px;display:block}
.rc span{font-family:var(--game);font-size:18px;display:block;line-height:1.15;word-break:keep-all}
.rc.new{box-shadow:inset 0 0 0 3px var(--accent)}
.rc.new::after{content:"새 규칙";position:absolute;top:-12px;right:4px;font-family:var(--game);font-size:18px;line-height:1.2;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 6px}
.prog{display:flex;flex-wrap:wrap;gap:5px;background:var(--surface);border-radius:14px;padding:8px 10px;align-items:center}
.prog svg{width:28px;height:18px}
.prog .wt{opacity:.4}.prog .ms{opacity:.55;filter:grayscale(1)}
/* §13 진행 표시 = '이번 단계 남은 일': 끝낸 칸에 초록 체크, 방금 끝낸 칸은 반짝. 처음 보일 때 한 번 '남은 일' 이름표 */
.prog{position:relative}
.prog .pc{position:relative;display:inline-flex}
.prog .pc .ck{position:absolute;right:-5px;bottom:-5px;width:15px;height:15px}
.prog .pc.just{animation:pcPop .5s ease-out 2}
/* r5: '남은 일' 줄은 늘 한 줄(B형 4단계 12칸이 1000×480에서 두 줄로 넘쳤다). 칸이 많으면 그림이 줄어든다(최대 28px) */
.prog{flex-wrap:nowrap}
.prog .pc{flex:0 1 28px;min-width:8px}
.prog .pc>svg:not(.ck){width:100%;height:auto;max-height:18px}
.prog.many{gap:3px;padding-left:8px;padding-right:8px}
@keyframes pcPop{40%{transform:scale(1.45);filter:drop-shadow(0 0 5px var(--good))}}
.prog-tag{position:absolute;left:10px;top:calc(100% + 9px);background:var(--ink);color:var(--surface);font-family:var(--game);font-size:18px;line-height:1;border-radius:10px;padding:5px 10px;pointer-events:none;white-space:nowrap;box-shadow:0 3px 0 rgba(30,43,58,.2)}
.prog-tag::after{content:'';position:absolute;left:18px;top:-7px;border:7px solid transparent;border-top:0;border-bottom-color:var(--ink)}   /* r3: 진행 줄 아래(위에 두면 규칙 칸 글을 가렸다) */

.hint{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:16px;background:var(--surface);font-size:24px;box-shadow:inset 0 -4px 0 var(--line);margin-top:auto}
.hint .ico{width:30px;height:30px;color:var(--accent)}
.hint .pips i{width:13px;height:13px}
.hint:active{transform:translateY(2px)}
.hide{display:none!important}
/* '왜?' 버튼 줄(GAME.explain이 있을 때만 생김): [힌트 | 왜?]. 버튼 자리는 늘 같고, 설명이 없으면 보이지 않기만 한다(힌트가 움직이지 않게) */
.xp-row{display:flex;gap:8px;margin-top:auto;position:relative}
.xp-row .hint{flex:1;margin-top:0;min-width:0}
.xp-btn{flex:none;min-width:100px;min-height:58px;border-radius:16px;background:var(--surface);font-size:24px;color:var(--accent-d);box-shadow:inset 0 -4px 0 var(--line)}
.xp-btn:active{transform:translateY(2px)}
.xp-btn.off{opacity:.5}   /* r4: 설명이 아직 없으면 흐리게(사라지지 않음). 누르면 이 단계의 일반 '왜?' */
.xp-btn.new{animation:xpPop .5s 2}
@keyframes xpPop{50%{box-shadow:inset 0 0 0 4px var(--accent)}}
.xp-btn[aria-expanded="true"]{background:var(--a-navy);color:var(--a-paper);box-shadow:none}
.xp-card{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:3;background:var(--a-navy);color:var(--a-paper);border-radius:16px;padding:10px 14px;font-size:19px;line-height:1.4;word-break:keep-all;box-shadow:0 4px 0 rgba(30,43,58,.18)}
.xp-card em{font-style:normal;color:var(--a-org)}
.xp-card .d{display:block;margin-top:4px;opacity:.92}
.xp-card small{display:block;font-size:18px;opacity:.8;margin-top:2px}
.ib.got{animation:bump .4s 2}

/* 장면 위 오버레이 (HTML, 렌더러와 독립) */
.ghost{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;will-change:transform}
.ghost svg{width:100%;height:100%}
.ghost.sel{animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{transform:var(--t) scale(1.15)}}
.ring{position:absolute;border-radius:18px;box-shadow:0 0 0 4px var(--accent);animation:blink .7s ease-in-out infinite alternate}
.ring.dst{box-shadow:0 0 0 4px var(--a-paper),0 0 0 8px var(--accent)}
.ring.bad{box-shadow:0 0 0 4px var(--bad);animation:shake .3s}
.ring.hover{box-shadow:0 0 0 3px var(--a-paper);animation:none;opacity:.8}
@keyframes blink{from{opacity:.35}to{opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.callout{position:absolute;left:0;top:0;max-width:92%;background:var(--a-paper);color:var(--a-navy);font-family:var(--game);font-size:20px;line-height:1.25;border-radius:14px;padding:7px 14px;white-space:normal;word-break:keep-all;box-shadow:0 4px 0 rgba(30,43,58,.18);transform-origin:50% 100%}
.callout em{font-style:normal;color:var(--a-org-d)}
.toast{position:absolute;left:0;top:0;display:flex;gap:8px;align-items:center;background:var(--a-navy);color:var(--a-paper);font-family:var(--game);font-size:19px;border-radius:14px;padding:6px 14px 6px 8px;max-width:80%}
.toast svg{width:36px;height:36px;flex:none}
.fx{position:absolute;left:0;top:0;font-family:var(--game);font-size:28px;color:var(--a-paper);text-shadow:0 2px 0 var(--a-navy)}
.fx.fast{font-size:34px;color:var(--a-org)}
.dot{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%}
.ribbon{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--a-paper);color:var(--a-navy);font-family:var(--game);font-size:34px;border-radius:18px;padding:10px 26px;white-space:nowrap;box-shadow:0 6px 0 var(--a-org)}
.ribbon{white-space:normal;word-break:keep-all;width:max-content;max-width:calc(100% - 20px)}   /* 장면보다 길면 장면 안에서 줄을 바꾼다. 한 줄에 들어가면 전과 같다 */
.ribbon small{display:block;font-size:20px;color:var(--a-navy-l);text-align:center}
.ribbon.sm{font-size:26px;padding:6px 18px}.ribbon.sm small{font-size:18px}   /* r5: 가릴 수밖에 없을 때 작게 */
.finger{position:absolute;left:0;top:0;width:54px;height:66px;margin:-4px 0 0 -22px}
.finger svg{width:100%;height:100%}
.finger{transform-origin:22px 4px}   /* r4: 손끝 기준(뒤집기 rotate 180deg가 손끝 자리를 지킨다) */
/* 힌트(§11): 1단계부터 집을 것(hs)·놓을 곳(hd)이 함께 빛나고 화살표(.harrow)가 잇는다. 2단계는 더 굵고 빠르게(strong) */
.ring.hs{box-shadow:0 0 0 4px var(--accent),0 0 16px 6px rgba(232,116,59,.6);animation:hGlow .6s ease-in-out infinite alternate}
.ring.hd{box-shadow:0 0 0 4px var(--a-paper),0 0 0 8px var(--accent),0 0 20px 10px rgba(232,116,59,.5);animation:hGlow .6s ease-in-out infinite alternate}
.ring.hs.strong{box-shadow:0 0 0 6px var(--accent),0 0 24px 10px rgba(232,116,59,.75);animation-duration:.35s}
.ring.hd.strong{box-shadow:0 0 0 5px var(--a-paper),0 0 0 11px var(--accent),0 0 28px 14px rgba(232,116,59,.65);animation-duration:.35s}
@keyframes hGlow{from{opacity:.6}to{opacity:1}}
.harrow{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.harrow .ho{fill:none;stroke:var(--a-paper);stroke-width:13;stroke-linecap:round;opacity:.92}
.harrow .hl{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-dasharray:16 10;animation:hFlow .55s linear infinite}
.harrow .hh{fill:var(--accent);stroke:var(--a-paper);stroke-width:3.5;stroke-linejoin:round}
.harrow.strong .ho{stroke-width:16}.harrow.strong .hl{stroke-width:10;animation-duration:.35s}
@keyframes hFlow{to{stroke-dashoffset:-26}}
/* '해 보기'(§12): 새 동작을 단계 시작에 한 번 직접. 시간이 멈추고 집을 것·놓을 곳만 밝다(.tdim 구멍), 나머지·패널은 흐리게. 해 보면 이름표(.trylab) */
.tdim{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.tdim .tv{fill:rgba(14,22,34,.6)}
.trylab{position:absolute;pointer-events:none;left:0;top:0;background:var(--accent);color:#FBF8F1;font-family:var(--game);font-size:20px;line-height:1.15;border-radius:13px;padding:4px 12px;white-space:nowrap;box-shadow:0 0 0 2px var(--a-paper),0 3px 0 rgba(30,43,58,.25)}
/* r3: 해 본 동작과 같은 규칙 칸이 잠깐 빛남(이름표와 같은 때) / 새 규칙 '보이는 상태' 가리키기는 손가락 대신 빛 테두리 / 틀린 놓기 기본 '다시!' */
.rc.hit{box-shadow:inset 0 0 0 4px var(--accent),inset 0 0 18px rgba(232,116,59,.45);animation:rcHit .45s ease-out 2}   /* 안쪽 빛만(패널 밖으로 넘치지 않게) */
@keyframes rcHit{40%{box-shadow:inset 0 0 0 7px var(--accent),inset 0 0 26px rgba(232,116,59,.6)}}
.ring.look{box-shadow:0 0 0 4px var(--a-paper),0 0 0 7px var(--a-navy),0 0 18px 8px rgba(251,248,241,.55);animation:lookP .6s ease-in-out infinite alternate}
@keyframes lookP{from{opacity:.45}to{opacity:1}}
/* r5: 알림이 장면에 빈자리가 없으면 작게(.sm), 그래도 없으면 패널의 힌트 줄 위(.eng-dock)에 뜬다(장면의 집을 것·놓을 곳·keepClear를 가리지 않게) */
.callout.sm{font-size:18px;padding:4px 10px;line-height:1.2}
.trylab.sm{font-size:18px;padding:3px 9px}
.panel{position:relative}
.eng-dock{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6}
.eng-dock>.callout,.eng-dock>.trylab{position:relative;left:auto;top:auto;max-width:96%}
.nope{position:absolute;left:0;top:0;pointer-events:none;background:var(--bad);color:#fff;font-family:var(--game);font-size:20px;line-height:1.1;border-radius:12px;padding:4px 12px;white-space:nowrap;box-shadow:0 0 0 2px var(--a-paper)}
.app.trying .panel{opacity:.32;transition:opacity .2s}
.app.trying .panel *{pointer-events:none}

/* 모달 */
.veil{position:fixed;inset:0;background:var(--veil);display:grid;place-items:center;z-index:20;padding:12px}
.modal{background:var(--surface);border-radius:20px;padding:16px 18px;width:min(640px,100%);max-height:calc(100dvh - 24px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal h2{font-family:var(--game);font-weight:400;font-size:26px;margin:0}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mrow .rc svg{height:70px}
.btns{display:flex;gap:10px}
.btn2{flex:1;min-height:54px;border-radius:14px;font-size:22px;background:var(--bg)}
.btn2.pri{background:var(--accent);color:var(--accent-ink)}
.shelf{display:flex;flex-wrap:wrap;gap:8px}
.bd{width:58px;height:58px;border-radius:14px;background:var(--bg);display:grid;place-items:center}
.bd svg{width:46px;height:46px}
.bd.off svg{opacity:.25;filter:grayscale(1)}
.bd.cur{box-shadow:inset 0 0 0 3px var(--accent)}
.def{font-size:19px;word-break:keep-all;min-height:2.8em}
.credit{font-size:12px;color:var(--ink);text-align:right;margin-top:-6px;opacity:.85}
.def b{font-family:var(--game);font-weight:400;display:block}

/* 결과 */
.res{position:absolute;inset:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:minmax(0,40fr) minmax(0,60fr);gap:10px}
.rcard{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:0}
.rcard.l{align-items:center;justify-content:center;text-align:center}
.rcard .lab{font-family:var(--game);font-size:20px;color:var(--muted)}
.rcard .num{font-family:var(--game);font-size:min(96px,15vh);line-height:1;font-variant-numeric:tabular-nums}
.rcard .ttl{font-family:var(--game);font-size:30px;background:var(--a-navy);color:var(--a-paper);border-radius:14px;padding:4px 18px}
.rcard .rec{font-size:18px;color:var(--muted);min-height:1.4em}
.rcard .btns{width:100%;margin-top:4px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) 2.4em;gap:4px 10px;align-items:center;font-size:18px}
.bars .bar{height:16px;border-radius:8px;background:var(--bg);overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .9s}
.bars b{font-family:var(--game);font-weight:400;text-align:right}
.formula{font-family:var(--game);font-size:22px;background:var(--bg);border-radius:12px;padding:6px 12px;text-align:center}
.nextq{font-size:18px;color:var(--muted);word-break:keep-all}
.rh{font-family:var(--game);font-size:20px;display:flex;justify-content:space-between;gap:8px}
.rh small{font-family:var(--body);font-size:18px;color:var(--muted)}
/* 결과 그림 칸(GAME.result.art가 있을 때만): 오른쪽 카드에서 남는 높이를 쓴다 */
.rart{flex:1 1 0;min-height:56px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rart svg{width:100%;height:100%;max-height:220px;display:block}

/* 세로·휴대폰: 1단으로 쌓기 */
@media (max-width:760px),(orientation:portrait){
  body{overflow:auto}
  .app{height:auto;min-height:100dvh;grid-template-rows:auto auto;align-content:start}
  .main{grid-template-columns:1fr}
  .scene{aspect-ratio:var(--scene-ar,600/440);height:auto}
  .panel{overflow:visible}
  .hint{margin-top:0}
  .stg .nm,.stg .pips,.score small{display:none}
  .hud{gap:6px}
  .stg{font-size:19px;white-space:normal;line-height:1.1;word-break:keep-all;flex:1}
  .sp{display:none}
  .score{padding:2px 10px}
  .score b{font-size:28px;min-width:1.6em}
  .combo{font-size:18px;padding:4px 8px}
  .sp{min-width:0}
  .res{position:static;grid-template-columns:1fr}
  .main.showres>.scene,.main.showres>.panel{display:none}
  .callout{font-size:18px;padding:5px 10px}.toast{font-size:18px;padding:4px 10px 4px 6px}.toast svg{width:28px;height:28px}
  .ribbon{font-size:28px;padding:8px 18px;text-align:center}.ribbon small{font-size:19px}
  .rart{flex:none;min-height:0}.rart svg{height:auto;max-height:150px}
  .xp-row{margin-top:0}
}
@media (max-height:540px) and (orientation:landscape){
  .hud{min-height:52px;padding-top:4px}
  .ib{width:48px;height:48px}
  .cap{padding:8px 10px}.cap svg{width:52px;height:52px}
  .rc svg{height:62px}
  .panel{gap:8px}
  .prog{padding:6px 10px}
  .rcard{padding:10px 14px;gap:6px}
  .rcard .ttl{font-size:26px}
}

function makeQueue(G,kinds,n){
  var q=[], i, j, ks=kinds.slice();
  for(i=ks.length-1;i>0;i--){ j=Math.floor(rnd(G)*(i+1)); var z=ks[i]; ks[i]=ks[j]; ks[j]=z; }
  for(i=0;i<n;i++) q.push(ks[i%ks.length]);
  for(i=q.length-1;i>0;i--){ j=Math.floor(rnd(G)*(i+1)); var x=q[i]; q[i]=q[j]; q[j]=x; }
  for(i=2;i<q.length;i++) if(q[i]===q[i-1]&&q[i]===q[i-2]){ for(j=0;j<q.length;j++) if(q[j]!==q[i]){ var y=q[i]; q[i]=q[j]; q[j]=y; break; } }

/* ENG-CHRULE-START */
var CHC = GAME.challenge && typeof GAME.challenge==='object' && Array.isArray(GAME.challenge.stages) && GAME.challenge.stages.length ? GAME.challenge : null;

    return sc<g ? 0 : sc>=g*1.3 ? 3 : sc>=g*1.15 ? 2 : 1; },
  seed: function(n){ return ((GAME.seed||1)+7919*(n+1))>>>0; },
  max: function(){ var m=Math.floor(+CHC.maxLevel||0); return m>0 ? m : 0; },   /* §19-추론형(2026-11-07): 최고 레벨(0 = 끝없음). 다 깨면 '모든 도전 완주!' */

/* ENG-STORE-START: 엔진이 브라우저 저장을 쓰는 곳은 이 두 함수뿐(check.js가 이 구역 밖의 사용과 try 없는 사용을 막는다). 막혀 있으면 ENG_CHM(메모리)만으로 이 접속 동안 동작 */

function engTitleSync(now){

  if(now-d._t0>600 && d._tk===key) return;
  var W=s.width, H=s.height; if(!(W>0&&H>0)) return;

    var C=[['c',0.38],['c','t'],['c','b'],['l','t'],['r','t'],['l','b'],['r','b'],['c',0.62],['c',0.26]];
    if(fx==='top') C=[['c','t']]; else if(fx==='bottom') C=[['c','b']]; else if(fx==='center') C=[['c',0.38]];
    ENG_KB.t=-1e9; var K=(fx?[]:engKeepBoxes().concat(engTextBoxes()));
    C.forEach(function(c,i){ var x=c[0]==='l'?m:c[0]==='r'?W-w-m:(W-w)/2, y=c[1]==='t'?m:c[1]==='b'?H-h-m:c[1]*H-h/2;
      x=Math.max(4,Math.min(W-w-4,x)); y=Math.max(4,Math.min(H-h-4,y));

/* ---------- 손가락 시범 ---------- */
function stopDemo(){ if(U.demo){ U.demo.forEach(function(e){ e.remove(); }); U.demo=null; } hintFingerStop(); }
function endDemo(mine){ if(mine){ mine.forEach(function(e){ e.remove(); }); U.demo=null; } }   /* 시범이 저절로 끝남: 그 시범만 지운다 */
function demoMove(mv,loops){
  stopDemo(); var a=SCENE.rectOf(G,mv.src), b=SCENE.rectOf(G,mv.dst); if(!a||!b) return;
  var s=sceneEl.getBoundingClientRect(), item=itemOf(G,mv.src);
  var f=document.createElement('div'); f.className='finger'; f.innerHTML=iconSvg('finger','');
  var gh=document.createElement('div'); gh.className='ghost'; gh.innerHTML=itemSvg(item); gh.style.opacity='.85';
  ovl.appendChild(gh); ovl.appendChild(f); var mine=U.demo=[f,gh];
  var x0=a.cx-s.left, y0=a.cy-s.top, x1=b.cx-s.left, y1=b.cy-s.top;
  var kf=function(dx,dy){ return [
    {transform:'translate('+(x0+dx)+'px,'+(y0+dy+30)+'px)',opacity:0,offset:0},
    {transform:'translate('+(x0+dx)+'px,'+(y0+dy)+'px)',opacity:1,offset:.15},
    {transform:'translate('+(x0+dx)+'px,'+(y0+dy)+'px) scale(.92)',opacity:1,offset:.25},
    {transform:'translate('+(x1+dx)+'px,'+(y1+dy)+'px) scale(.92)',opacity:1,offset:.75},
    {transform:'translate('+(x1+dx)+'px,'+(y1+dy)+'px)',opacity:0,offset:1}]; };
  var opt={duration:RM?2600:2000,iterations:loops,easing:'ease-in-out'};
  f.animate(kf(0,6),opt); var an=gh.animate(kf(0,0),opt);
  an.onfinish=function(){ endDemo(U.demo===mine?mine:null); };   /* 지운 시범의 늦은 끝 알림이 새 시범·힌트 손가락을 지우지 않게 */
}
/* 새 규칙이 '보이는 상태'일 때(예: 기다림 막대) 그곳을 가리킨다. r3: 손가락이 아니라 빛 테두리(.ring.look) 두 번(블라인드 2차: 남은 손가락을 '눌러야 하나?'로 읽었고 말풍선 글을 가렸다) */
function demoPoint(id){
  stopDemo(); var d=ring(id,'look'); if(!d) return; var mine=U.demo=[d];
  later(RM?2400:2600,function(){ endDemo(U.demo===mine?mine:null); if(d.parentNode) d.remove(); });

/* 언제 시범을 보일지. 기본: 단계 시작에 hintMove를 한 번(2회 반복), 그 뒤는 10초 동안 아무것도 못 하면 한 번.
   GAME.demo(G)가 이 단계의 시작 시범을 바꿀 수 있다:
     {repeat:true}            멈출 때마다(1.2초) 시범 반복(첫 단계 튜토리얼)
     {point:id, text, at}     손가락이 id를 가리키고 말풍선 text(at 위치). point가 null이면 아직 기다림
     {move:{src,dst}}         시작 시범을 이 수로. move가 null이면 아직 기다림 */
function maybeDemo(now){
  if(ENG_CHON||ENG_PENON) return;   /* §21 판서 중에도 없음. §19 도전: 저절로 뜨는 손가락 시범 없음(답을 보여 주지 않음). 힌트 버튼은 그대로 */
  if(U.mode!=='play'||U.demo||U.drag||U.sel||U.busy||U.hint||tryHold()) return;   /* '해 보기' 중에는 시범 없음(§12) */   /* 힌트가 켜져 있으면 시범 없음(힌트가 보여 주는 수와 다른 곳을 가리키지 않게) */
  if(now-U.okAt<2000) return;   /* 바르게 놓은 직후 2초는 시범 없음(맞혔는데 틀린 줄 알게 됨, §11) */
  if(now-U.downAt<2500) return;   /* r4: 장면을 누른 직후 2.5초도 시범 없음(3차 블라인드: 버튼을 누르자 손가락이 '저절로' 나옴) */
  var done=!!U.demoDone[G.si], p=(GAME.demo&&GAME.demo(G))||{};
  if(('point' in p) && !done){ if(p.point && now>U.demoAt){ U.demoDone[G.si]=1; demoPoint(p.point); if(p.text) callout(p.text,p.at||null); } return; }
  var mv=hintMove(G);
  if(!mv) return;
  /* r3: '해 보기'가 켜진 엔진(GAME.tryIt!==false)에서는 손가락 = '지금 이것을 하세요'(해 보기·힌트)만. 단계 시작 손가락 시범(기본·move·repeat)은 없다.
     예외: 해 보기에서 keepDemo:true를 준 단계의 게임 시범. 10초 동안 아무것도 못 하면 한 번 보여 주는 시범은 그대로 */
  var noF=GAME.tryIt!==false && !U.keepDemo[G.si];
  if(p.repeat && !noF){ if(now-U.lastAct>1200 && now>U.demoAt) demoMove(mv,2); return; }
  if(!done && now>U.demoAt && noF){ U.demoDone[G.si]=1; return; }
  if(!done && now>U.demoAt){
    if(!('move' in p) && U.okN>0){ U.demoDone[G.si]=1; return; }   /* 기본 시작 시범: 이미 스스로 한 수를 맞혔으면 건너뜀 */
    if('move' in p){ if(!p.move) return; mv=p.move; }
    U.demoDone[G.si]=1; demoMove(mv,2); return;
  }
  if(now-U.lastAct>10000){ U.lastAct=now; demoMove(mv,1); }
}

/* ---------- 이벤트 처리 ----------
   엔진이 직접 받는 이벤트: name(k, at) → 한 줄 말풍선, badge(k) → 배지 토스트, stageEnd → 단계 끝.
   나머지는 GAME.onEvent(e, FX)로 넘긴다. FX는 화면 효과 몇 가지뿐이다(점수는 FX.score 하나로만 보인다). */
var FX = {
  score:function(at,pts,fast,combo){ if(U.trPts!=null){ pts=U.trPts; if(!pts) return; }
    /* r5: +점수·HUD 튐·콤보는 행동 0.6초 뒤(그 사이 또 행동하면 그만큼 더 뒤). 자리는 지금 잡아 둔다(대상이 그새 떠나도 그 자리에) */

      engScoreSeen(); var got=engScoreTake(pts); if(!(got>0)) return;   /* 블라인드(11-07): +n은 점수가 실제로 오른 만큼만. 오르지 않았으면 +n·점수 튐·콤보 모두 없음 */
      if(!(U.badAt>t0)) fxText(at,'+'+got,fast,r0);   /* 블라인드(11-07): 맞힌 수의 +n이 그 뒤 틀린 수 직후에 떠 '틀려도 점수'로 읽힘 → 그 사이 틀린 놓기가 있었으면 +n 글은 띄우지 않는다(점수 칸만 튐) */ bumpScore(); if(combo>=2){ var c=$('#combo'); c.textContent='콤보 '+combo; c.classList.add('on'); U.comboT=performance.now(); } };
    go(); },
  burst:function(at,n){ burst(at,n); },
  progress:function(){ progPanel(); },

  callout:function(html,at){ callout(html,at); },
  explain:function(x){ xpSet(x); }   /* GAME.explain이 있을 때: 지금 '왜?'로 열 설명. 글 | {why, def, page} | null(지움) */
};

/* ---------- '왜?' 버튼 (GAME.explain이 있을 때만. 인지부하: 부가 설명은 학생이 골라서 연다) ----------
   보여 줄 설명 = 게임이 넘긴 것(이벤트 {t:'explain'} / FX.explain / 틀린 놓기의 reasons[why]) → 없으면 GAME.explain.of(G).
   넘긴 설명은 다음 놓기·단계 바뀜에서 사라진다. 카드는 장면을 누르거나 힌트를 누르면 접힌다. 게임은 멈추지 않는다 */
function xpHtml(x){
  if(!x) return ''; if(typeof x==='string') return x;
  return (x.why?'<span>'+x.why+'</span>':'')+(x.def?'<span class="d">'+x.def+'</span>':'')+(x.page?'<small>'+x.page+'</small>':'');
}
function xpSet(x){ if(!XPC) return; U.xpCur=(x==null||x==='')?null:x; xpSync(); }
function xpSync(){
  if(!XPC) return; if(U.mode==='play' && engHeld()) return;   /* r5: '왜?' 반짝임도 행동 0.6초 뒤 */
  var h = U.mode==='play' ? xpHtml(U.xpCur) : '';
  if(!h && U.mode==='play' && XPC.of) h = xpHtml(XPC.of(G));
  if(h===U.xpKey) return; U.xpKey=h; xpClose();
  var b=$('#xpBtn'); b.classList.toggle('off',!h);   /* r4: 없으면 흐리게만(사라지지 않음) */
  if(h&&!RM){ b.classList.remove('new'); void b.offsetWidth; b.classList.add('new'); }
}
function xpClose(){ if(!XPC) return; var c=$('#xpCard'); if(c) c.remove(); $('#xpBtn').setAttribute('aria-expanded','false'); }
function xpToggle(){
  if(!XPC) return; if($('#xpCard')){ xpClose(); return; } if(U.mode!=='play') return;
  var h=U.xpKey||engXpGeneral(); if(!h) return;   /* r4: 넘긴 설명이 없으면 이 단계의 일반 '왜?' */
  var c=document.createElement('div'); c.className='xp-card'; c.id='xpCard'; c.setAttribute('role','note'); c.innerHTML=h; $('#xpRow').appendChild(c);
  $('#xpBtn').setAttribute('aria-expanded','true');
  if(!RM) c.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:180});
}
/* r4: 이 단계의 일반 '왜?' — GAME.explain.general(G)(글 | {why, def, page}) → 없으면 단계 시작 대사 + 이번 규칙 칸 글 */
function engXpGeneral(){
  if(typeof XPC.general==='function'){ var g=XPC.general(G); if(g) return xpHtml(g); }
  var rc=engRC(G.si).map(function(c){ return c[1]; }).filter(Boolean).join(' · ');

    /* 펜: 어두운 테두리 한 번 + 색 한 번(밝은 바다·어두운 판 모두에서 보이게). 펜 압력이 있으면 마디마다 굵기 */
    [0,1].forEach(function(pass){ c.strokeStyle=pass?s.col:'rgba(20,30,42,.55)';
      for(var i=0;i<a.length;i++){ var b=a[Math.max(0,i-1)], w=engPenW(s,(a[i][2]+b[2])/2)+(pass?0:3); c.lineWidth=w; c.beginPath(); c.moveTo(b[0]*W,b[1]*H); c.lineTo(a[i][0]*W+(i?0:0.1),a[i][1]*H); c.stroke(); } }); });
}

/* ---------- 버튼 ---------- */
$('#bReset').innerHTML=iconSvg('icReset'); $('#bRules').innerHTML=iconSvg('icRules')+'<span>규칙</span>'; $('#bBadges').innerHTML=iconSvg('icMedal')+'<span>배지</span>';
$('#bRules').classList.add('lb'); $('#bBadges').classList.add('lb');
$('#bReset').onclick=confirmReset; $('#bRules').onclick=rulesModal; $('#bBadges').onclick=function(){ badgeModal(null); };
$('#bHint').onclick=doHint;
if(XPC) $('#xpBtn').onclick=xpToggle;

/* ---------- 한 개의 rAF 루프: tick → renderScene → 오버레이 맞춤. 화면이 안 보이면 멈춘다 ---------- */
var LAST=performance.now(), RAF=0;
function frame(now){
  var dt=Math.min(0.1,(now-LAST)/1000); LAST=now;
  var frz = U.mode==='play' && tryFrame(now,dt);   /* '해 보기' 동안 게임 시간은 멈춘다 */
  if(U.mode==='play' && !U.paused && !ENG_PENON && !frz){ if(ENG_CHON) engChMark(G); var r=tick(G, ENG_CHON?Math.min(0.1,dt)*ENG_CHSPD:dt); G=r.G; engScoreSeen();   /* §19 도전: 시간 배속(LOGIC에 넘기는 dt만 키움) */
    if(r.ev.length) handle(r.ev); }
  SCENE.renderScene(G); if(U.mode==='title') engTitleSync(now);   /* §21 제목 카드 자리 */
  syncRings(); if(U.mode==='play'){ unblockOverlays(now); hintCheck(now); hintFingerStep(now); hintArrowSync(); }
  if(U.shown!==G.score && !engHeld(now)){ U.shown += Math.ceil((G.score-U.shown)/4); if(U.shown>G.score) U.shown=G.score; $('#score').textContent=U.shown; }
  if(U.comboT && now-U.comboT>GAME.comboWin*1000){ U.comboT=0; $('#combo').classList.remove('on'); }
  maybeDemo(now); progTag(now); engTxtPump(now);
  if(XPC) xpSync();
  if(ENG_PEN && ENG_PEN.dirty) engPenDraw();   /* §21 판서 다시 그리기(획이 바뀌었거나 창 크기가 바뀜) */
  RAF=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',function(){ if(document.hidden){ cancelAnimationFrame(RAF); RAF=0; } else if(!RAF){ LAST=performance.now(); RAF=requestAnimationFrame(frame); } });
window.addEventListener('resize',function(){ if(ENG_PEN) engPenFit(); clearRings('.ring:not(.bad)'); if(U.hint&&U.hintMv) hintShow(U.hintMv,U.hint,false); if(U.tr&&U.tr.phase==='wait') trySpot(U.tr,false); });

engChLoad();
engPenInit();   /* §21: ?teach=1일 때만 펜 버튼·판서 층 */
reset();
RAF=requestAnimationFrame(frame);
</script>
