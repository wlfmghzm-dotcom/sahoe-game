<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>무역 속보 데스크 – 6-2 사회 27차시 수업용 게임</title>
<meta name="description" content="6-2 사회 27차시 「무역이 무엇인지 알아볼까요」 수업용 게임. 쏟아지는 제보 카드를 단서로 읽고 ⭐ 나라 입장에서 수입·수출·무역 아님을 가려요. 벽란도부터 오늘날까지.">
<link rel="canonical" href="https://wlfmghzm-dotcom.github.io/sahoe-game/games/g27.html">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>무역 속보 데스크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 27차시 v3 (시리즈 통일판: 「대한민국 무역항」 v3와 같은 시각 체계, art-direction.md 팔레트).
   Layout (tablet landscape first): HUD row → left 63% news desk (tip feed on top, big monitor) | right 37% control panel (입장 별, three news slots, 단서, 힌트, combo).
   Portrait / phone: everything stacks in one column. 그림은 전부 ASSETS(인라인 SVG 아이콘 + Kenney CC0 스프라이트)에서 온다. */
:root{
  --bg:#EDF2EF; --surface:#FBF8F1; --ink:#1E2B3A; --muted:#55657A; --line:#DCD4C2;
  --sea:#4FA3B8; --sea2:#2E6F8E; --sand:#EBD9B4; --leaf:#4CAF7A; --trunk:#A8754F;
  --banana:#C95F2C; --banana-soft:#F3E7CF; --fish:#2E6F8E; --fish-soft:#DCEAEC;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#FBF8F1; --good:#3C9064; --good-soft:#DCEEE2; --bad:#D9534F; --bad-soft:#F5DEDA;
  --star:#E8743B; --veil:rgba(20,30,42,.62);
  --old-sea:#EBD9B4; --old-land:#D6C196; --paper:#FBF8F1; --desk:#1E2B3A;
  --a-sea:#2E6F8E; --a-sea-d:#245A74; --a-shal:#4FA3B8; --a-shal-d:#3F8798; --a-sand:#EBD9B4; --a-sand-d:#D6C196;
  --a-land:#8DB48E; --a-land-d:#779D78; --a-wood:#A8754F; --a-wood-d:#8C603F; --a-navy:#1E2B3A; --a-navy-l:#33475C;
  --a-org:#E8743B; --a-org-d:#C95F2C; --a-grn:#4CAF7A; --a-grn-d:#3C9064; --a-red:#D9534F; --a-red-d:#B94340;
  --a-paper:#FBF8F1; --a-paper-d:#E6E0D2;
  --game:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A23; --surface:#1C2835; --ink:#F1ECE0; --muted:#A9B4C1; --line:#2F3E50;
  --sea:#3F8798; --sea2:#245A74; --sand:#5A4F3C; --leaf:#4CAF7A; --trunk:#A8754F;
  --banana:#E8743B; --banana-soft:#2C2A24; --fish:#4FA3B8; --fish-soft:#1D3340;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#1E2B3A; --good:#4CAF7A; --good-soft:#1B3328; --bad:#D9534F; --bad-soft:#3A2322;
  --star:#E8743B; --veil:rgba(0,0,0,.7);
  --old-sea:#3A3326; --old-land:#5A4C35; --paper:#18232F; --desk:#0D141C;
  --a-sea:#245A74; --a-sea-d:#1D4B61; --a-shal:#3F8798; --a-shal-d:#357484; --a-land:#779D78; --a-land-d:#668A67;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A23; --surface:#1C2835; --ink:#F1ECE0; --muted:#A9B4C1; --line:#2F3E50;
  --sea:#3F8798; --sea2:#245A74; --sand:#5A4F3C; --leaf:#4CAF7A; --trunk:#A8754F;
  --banana:#E8743B; --banana-soft:#2C2A24; --fish:#4FA3B8; --fish-soft:#1D3340;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#1E2B3A; --good:#4CAF7A; --good-soft:#1B3328; --bad:#D9534F; --bad-soft:#3A2322;
  --star:#E8743B; --veil:rgba(0,0,0,.7);
  --old-sea:#3A3326; --old-land:#5A4C35; --paper:#18232F; --desk:#0D141C;
  --a-sea:#245A74; --a-sea-d:#1D4B61; --a-shal:#3F8798; --a-shal-d:#357484; --a-land:#779D78; --a-land-d:#668A67;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.4;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button{font-family:var(--game);cursor:pointer;color:var(--ink);font-size:20px;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--a-shal);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
b{font-weight:400;color:var(--accent-d);font-family:var(--game)}

/* 아트 색 클래스 (ASSETS 안 SVG가 씀) + 아이콘 */
.f-sea{fill:var(--a-sea)}.f-sead{fill:var(--a-sea-d)}.f-shal{fill:var(--a-shal)}.f-shald{fill:var(--a-shal-d)}
.f-sand{fill:var(--a-sand)}.f-sandd{fill:var(--a-sand-d)}.f-land{fill:var(--a-land)}.f-landd{fill:var(--a-land-d)}
.f-wood{fill:var(--a-wood)}.f-woodd{fill:var(--a-wood-d)}.f-navy{fill:var(--a-navy)}.f-navyl{fill:var(--a-navy-l)}
.f-org{fill:var(--a-org)}.f-orgd{fill:var(--a-org-d)}.f-grn{fill:var(--a-grn)}.f-grnd{fill:var(--a-grn-d)}
.f-red{fill:var(--a-red)}.f-paper{fill:var(--a-paper)}.f-paperd{fill:var(--a-paper-d)}
.s-line{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.s-fill{fill:currentColor;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ico{width:26px;height:26px;display:inline-block;vertical-align:-5px;flex:none;overflow:visible}
.ico.st{color:var(--star)} .ico.ht{color:var(--bad)} .ico.ht0{color:var(--muted)} .ico.fl{color:var(--accent)}
.ico.imp{color:var(--fish)} .ico.exp{color:var(--accent-d)} .ico.home{color:var(--good)}
.em{width:1.35em;height:1.35em;display:inline-block;vertical-align:-.32em;margin:0 1px;overflow:visible}
.em.ico{width:1.05em;height:1.05em;vertical-align:-.15em}
.spr{display:block;overflow:visible}
.spr.em{display:inline-block}

.app{display:grid;grid-template-rows:58px minmax(0,1fr);grid-template-columns:63fr 37fr;gap:8px 10px;height:100vh;height:100dvh;padding-block:6px 10px;max-width:1400px;margin:0 auto}

/* HUD */
.hud{grid-column:1/-1;display:flex;align-items:center;gap:8px;min-width:0}
.ib{width:50px;height:50px;border-radius:14px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink);position:relative}
.ib:active{transform:scale(.94)}
.ib .cnt{position:absolute;right:-4px;top:-4px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:18px;line-height:24px;padding:0 5px;font-family:var(--game)}
.day{display:flex;align-items:center;gap:10px;font-family:var(--game);font-size:22px;white-space:nowrap;min-width:0;flex:0 1 auto;overflow:hidden}
.day .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.day .ico{color:var(--good)}
.pips{display:flex;gap:5px;flex:none}
.pips i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.pips i.on{background:var(--accent)}.pips i.done{background:var(--a-grn)}
.stats{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none;flex-wrap:nowrap}
.chip{display:flex;align-items:center;gap:5px;background:var(--surface);border-radius:14px;padding:0 10px;min-height:50px;font-family:var(--game);font-size:22px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip .ico{width:24px;height:24px}
.chip.time.low{background:var(--accent);color:var(--accent-ink)}
.chip.time.low .ico{color:var(--accent-ink)}
.chip.goal.met{background:var(--good-soft);color:var(--good)}
.chip.goal .ico{color:var(--accent)}
.chip.goal.met .ico{color:var(--good)}
.chip.combo{transition:transform .2s;color:var(--muted)}
.chip.combo.hot{background:var(--accent);color:var(--accent-ink);transform:scale(1.08)}
.chip.combo.hot .ico{color:var(--accent-ink)}
@media (max-width:760px){.chip.combo.hot{transform:none}}
.chip.score{gap:8px;padding:2px 14px;align-items:baseline}
.chip.score small{font-size:18px;color:var(--muted)}
.chip.score b{color:var(--ink);font-size:32px;min-width:2.6em;text-align:right;display:inline-block;line-height:1.3}
.hearts{gap:2px;padding:0 8px}
.hearts .ico{width:26px;height:26px}
.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.2)}}

/* Scene: feed + monitor */
.scene{position:relative;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.scene.flash .monitor{animation:edge .6s}
@keyframes edge{30%{box-shadow:0 0 0 6px var(--accent)}}
.feed{height:112px;flex:none;display:flex;gap:8px;background:var(--desk);border-radius:18px;padding:8px;align-items:stretch;overflow:hidden}
.scene.resmode .feed{height:60px}
.scene.resmode .feed .empty .spr{width:40px;height:40px}
.feed .empty{color:#DCE3EA;align-self:center;margin:auto;font-size:20px;font-family:var(--game);display:flex;align-items:center;gap:10px}
.feed .empty .spr{width:48px;height:48px}
.tip{flex:1 1 0;max-width:calc(25% - 6px);min-width:0;border-radius:14px;background:var(--a-paper);color:var(--a-navy);display:flex;flex-direction:column;justify-content:space-between;padding:4px 8px 7px;text-align:left;animation:slidein .45s cubic-bezier(.2,.8,.3,1);box-shadow:inset 0 -4px 0 var(--a-paper-d)}
.tip.sel{box-shadow:inset 0 0 0 4px var(--accent)}
.tip .t1{display:flex;justify-content:space-between;align-items:center;line-height:1;min-height:44px}
.tip .t1 .its{display:flex;gap:2px}
.tip .t1 .spr{width:44px;height:44px}
.tip .t1 small{display:flex;align-items:center;gap:1px;font-size:18px;color:var(--a-org-d)}
.tip .t1 small .ico{width:18px;height:18px;vertical-align:0}
.tip .t1 small .ico.bolt{color:var(--a-org-d)}
.tip .t2{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--game);display:flex;align-items:center;gap:4px}
.tip .t2 .ico{width:20px;height:20px;color:var(--a-org)}
.bar{display:block;height:10px;border-radius:5px;background:var(--a-paper-d);overflow:hidden}
.bar i{display:block;height:100%;background:var(--a-grn);border-radius:5px}
.bar i.mid{background:var(--a-org)} .bar i.low{background:var(--a-red)}
.tip.paused .bar i{background:var(--a-shal)}
@keyframes slidein{from{transform:translateX(120%);opacity:0}}

.monitor{position:relative;flex:1;min-height:0;background:var(--surface);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.stage{position:relative;flex:1 1 auto;min-height:0;background:var(--a-shal)}
.monitor.old .stage{background:var(--a-sand)}
.wv{position:absolute;width:34px;height:9px;opacity:.7;pointer-events:none}
.monitor.old .stage .wv{display:none}
.stage .gr{position:absolute;left:0;right:0;bottom:0;height:26%;background:var(--a-shal-d);opacity:.45;pointer-events:none}
.monitor.old .stage .gr{background:var(--a-sand-d);opacity:1}
.band{position:absolute;top:50%;transform:translateY(-50%);width:34%;min-height:84px;border-radius:16px;background:var(--a-paper);color:var(--a-navy);display:flex;align-items:center;gap:6px;padding:6px 8px;text-align:left;font-family:var(--game);font-size:22px;line-height:1.2;box-shadow:inset 0 -5px 0 var(--a-paper-d)}
.band .bs{width:60px;height:48px;flex:none}
.band .bt{display:flex;flex-direction:column;align-items:flex-start;min-width:0;word-break:keep-all}
.band.l{left:3%} .band.r{right:3%}
.band.star{box-shadow:inset 0 -5px 0 var(--a-paper-d),0 0 0 4px var(--a-org)}
.band .who{font-size:18px;color:#55657A;display:flex;align-items:center;gap:3px}
.band.star .who{color:var(--a-org-d)}
.band .who .ico{width:20px;height:20px;color:var(--a-org)}
.band.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 -5px 0 var(--a-paper-d),0 0 0 10px var(--a-org)}}
.btag{position:absolute;left:50%;top:0;transform:translate(-50%,-62%);z-index:3;background:var(--a-navy);color:var(--a-paper);border-radius:12px;padding:2px 10px;white-space:nowrap;font-size:20px;animation:pop .3s;display:flex;align-items:center;gap:4px}
.btag .ico{width:22px;height:22px}
.btag.imp .ico{color:var(--a-shal)} .btag.exp .ico{color:var(--a-org)}
.item{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;cursor:grab}
.item .its{display:flex;gap:4px;align-items:center}
.item .pl{width:clamp(70px,8.4vw,92px);height:clamp(70px,8.4vw,92px);border-radius:50%;background:var(--a-paper);display:grid;place-items:center;box-shadow:inset 0 -5px 0 var(--a-paper-d)}
.item .pl .spr{width:78%;height:78%}
.item .inm{font-family:var(--game);font-size:18px;background:var(--a-navy);color:var(--a-paper);border-radius:10px;padding:0 8px;line-height:1.35;white-space:nowrap}
.item .pt{display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .2s,transform .2s}
.fly{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;z-index:4;pointer-events:none;transition:left .6s cubic-bezier(.45,0,.4,1),top .6s cubic-bezier(.45,0,.4,1)}
.fly .spr{width:100%;height:100%}
.fly.coin{width:42px;height:42px}
.arrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stamp{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%) rotate(-6deg);border:4px solid var(--a-grn-d);color:var(--a-grn-d);border-radius:12px;padding:2px 12px;font-size:26px;font-family:var(--game);background:var(--a-paper);animation:pop .3s;z-index:5;display:flex;align-items:center;gap:6px;white-space:nowrap}
.stamp .ico{width:28px;height:28px}
.stamp.no{border-color:var(--a-red);color:var(--a-red-d)}
.verdict{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:24px;font-family:var(--game);padding:2px 14px;border-radius:12px;background:var(--a-paper);z-index:5;animation:pop .3s;white-space:nowrap;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 rgba(30,43,58,.18)}
.verdict .ico{width:26px;height:26px}
.verdict.ok{color:var(--a-grn-d)} .verdict.no{color:var(--a-red-d)}
.verdict .ico.fl{color:var(--a-org)}
.clues{flex:none;padding:6px 16px 8px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.clue{font-size:22px;line-height:1.38;word-break:keep-all}
.clue.more{border:2px dashed var(--muted);border-radius:12px;padding:2px 10px}
.hintbox{flex:none;margin:0 12px 10px;background:var(--banana-soft);border-radius:12px;padding:6px 12px;font-size:20px;line-height:1.35;word-break:keep-all}
.hintbox:empty{display:none}
.hintbox .hn{display:inline-flex;align-items:center;gap:2px;font-family:var(--game);color:var(--accent-d)}
.hintbox .hn .ico{width:22px;height:22px;color:var(--accent)}
.mon-label{position:absolute;left:10px;top:8px;font-size:18px;font-family:var(--game);z-index:2;background:var(--a-navy);color:var(--a-paper);border-radius:10px;padding:1px 10px;display:flex;align-items:center;gap:4px}
.mon-label .ico{width:20px;height:20px}
.mon-label .ico.st{color:var(--a-org)}
.mon-label.scoop{background:var(--a-org);color:var(--a-navy)}
.mon-label.scoop .ico.st{color:var(--a-navy)}
.idle{margin:auto;text-align:center;font-size:24px;color:var(--muted);padding:20px;font-family:var(--game);display:flex;flex-direction:column;align-items:center;gap:6px}
.idle .spr{width:72px;height:72px}
.idle.rib{color:var(--a-navy);background:var(--a-paper);border-radius:18px;padding:12px 28px;font-size:32px;box-shadow:0 6px 0 var(--a-org)}
.idle.rib .ico{width:32px;height:32px;color:var(--a-org)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{translate:-10px 0}40%,80%{translate:10px 0}}

.bubble{position:absolute;left:50%;top:126px;transform:translateX(-50%);max-width:92%;background:var(--a-paper);color:var(--a-navy);border-radius:14px;padding:7px 16px;font-size:21px;font-family:var(--game);line-height:1.3;z-index:8;box-shadow:0 4px 0 rgba(30,43,58,.18);animation:drop .3s;pointer-events:none;text-align:center;word-break:keep-all}
.bubble b{color:var(--a-org-d)}
.bubble .cp{width:30px;height:30px;vertical-align:-8px;margin-right:4px}
.bubble .ico{width:24px;height:24px}
.bubble.news{background:var(--a-navy);color:var(--a-paper)}
.bubble.news .ico{color:var(--a-org)}
.bubble.no{background:#F5DEDA;color:var(--a-navy)}
@keyframes drop{from{transform:translate(-50%,-14px);opacity:0}}
.toast{position:absolute;left:10px;bottom:10px;max-width:min(560px,92%);background:var(--a-navy);color:var(--a-paper);border-radius:14px;padding:8px 14px 8px 8px;display:flex;gap:10px;align-items:center;z-index:9;box-shadow:0 6px 0 var(--a-org);animation:toast .4s;pointer-events:none}
.toast .ti{width:48px;height:48px;flex:none}
.toast .ti svg{width:100%;height:100%}
.toast .tn{font-size:22px;font-family:var(--game);display:flex;align-items:center;gap:4px}
.toast .tn .ico{width:22px;height:22px;color:var(--a-org)}
.bubble .why{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:72px;min-height:48px;margin-left:8px;padding:0 12px;border-radius:14px;background:var(--a-navy);color:var(--a-paper);font-size:20px;font-family:var(--game);vertical-align:middle;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.bubble .why .ico{width:22px;height:22px;color:var(--a-org)}
.tipx{font-size:20px;line-height:1.4;margin:6px 0 0;padding:4px 10px;background:var(--banana-soft);border-radius:12px;word-break:keep-all}
.tipx .ico{width:22px;height:22px}
.talk .tipb{margin-top:6px;width:auto;display:inline-flex}
.shelf .bd{width:100%;min-height:52px;background:transparent;color:inherit;font:inherit;font-size:20px;border-radius:12px;padding:2px 6px}
.shelf .bd.cur{box-shadow:inset 0 0 0 3px var(--a-org)}
.card .def{min-height:2.7em;text-align:center}
.bonus[hidden],.facts[hidden]{display:none}
.card .shelf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card .shelf .bd{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;font-size:18px;text-align:center;padding:4px 2px}
.paperb{width:100%;min-height:52px;border-radius:12px;padding:4px 10px;background:var(--a-paper);color:var(--a-navy);box-shadow:inset 0 -4px 0 var(--a-paper-d);display:flex;align-items:center;justify-content:center;gap:14px;font-size:20px;font-family:var(--game);flex-wrap:wrap}
.paperb span{display:inline-flex;align-items:center;gap:4px}
.paperb .ico{width:24px;height:24px}
.card .paper{text-align:left}

/* Modal */

.card{background:var(--surface);border-radius:20px;padding:16px 18px;max-width:640px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;text-align:center;animation:pop .3s}

.paper{border-radius:12px;padding:6px 10px;background:var(--a-paper);color:var(--a-navy);box-shadow:inset 0 -4px 0 var(--a-paper-d)}
.paper h3{margin:0 0 4px;font-weight:400;font-size:22px;text-align:center;border-bottom:2px solid var(--a-navy);font-family:var(--game);display:flex;align-items:center;justify-content:center;gap:6px}

/* 낮은 화면 맞춤(fitMon): 장면을 한 줄 띠로 줄이고, 단서·힌트 글자를 조금 줄인다 */

/* ---------- 그림: ASSETS → 숨은 스프라이트(<symbol id="a-키">), 아이콘·스프라이트 도우미 ---------- */
(function buildSprite(){
  let h='<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>';
  Object.keys(ASSETS).forEach(k=>{ const a=ASSETS[k], vb=a.vb.join(' ');
    h+='<symbol id="a-'+k+'" viewBox="'+vb+'" overflow="visible">'+(a.src ? '<image href="'+a.src+'" x="'+a.vb[0]+'" y="'+a.vb[1]+'" width="'+a.vb[2]+'" height="'+a.vb[3]+'" preserveAspectRatio="xMidYMid meet"/>' : a.svg)+'</symbol>'; });
  document.body.insertAdjacentHTML('afterbegin', h+'</defs></svg>');
})();
const IC=(k,cls)=>`<svg class="ico ${cls||''}" viewBox="0 0 24 24" aria-hidden="true"><use href="#a-${k}"/></svg>`;
/* 심볼 viewBox가 (0,0)에서 시작하지 않으면 <use>에 x·y·w·h를 줘야 제자리에 그려진다(무역항 useArt와 같음) */
const SP=(k,cls)=>{ const a=ASSETS[k].vb; return `<svg class="spr ${cls||''}" viewBox="${a.join(' ')}" aria-hidden="true"><use href="#a-${k}" x="${a[0]}" y="${a[1]}" width="${a[2]}" height="${a[3]}"/></svg>`; };

/* '마지막 단계 다시'(교사 요청 2026-11-04, 엔진 README §10과 같은 방식): 3단계가 시작될 때 G를 통째로 복사해 두었다가
   (점수·배지·기록·시도 횟수 그대로) 결과 화면에서 3단계만 다시 한다. reset()(⟲·다시 하기)이 복사본을 지운다 */
let lastSnap=null; const LAST=STAGE_ORDER[STAGE_ORDER.length-1];
function deepCopy(v){
  if(v===null||typeof v!=='object') return v;
  if(Array.isArray(v)) return v.map(deepCopy);
  if(v instanceof Map){ const m=new Map(); v.forEach((x,k)=>m.set(k,deepCopy(x))); return m; }
  if(v instanceof Set){ const t=new Set(); v.forEach(x=>t.add(deepCopy(x))); return t; }
  const o={}; for(const k in v) if(Object.prototype.hasOwnProperty.call(v,k)) o[k]=deepCopy(v[k]); return o;
}
function replayLast(){
  if(!lastSnap) return; const snap=lastSnap, best=G.best;
  document.querySelector('.modal')?.remove(); modalOpen=false; clearTimeout(bubbleT); toastQ.length=0; animUntil=0;
  G=deepCopy(snap.G); G.best=Math.max(best, G.best);   // '이번 최고'는 이 화면에서 끝낸 판 중 최고 그대로
  return runStage(LAST, snap.opts);                    // 3단계를 처음처럼(안내 → 플레이 → 단계 끝 → 신문)
}

/* ---------- small helpers ---------- */
function fxAt(el, text, n){
  const r=el.getBoundingClientRect();
  for(let i=0;i<(n||1);i++){ const s=document.createElement('span'); s.className='fx'; s.innerHTML=text;
    s.style.left=Math.min(innerWidth-50,Math.max(50,r.left+r.width/2+(n>1?(Math.random()*60-30):0)))+'px'; s.style.top=(r.top+r.height/3)+'px'; s.style.animationDelay=(i*70)+'ms';
    document.body.appendChild(s); setTimeout(()=>s.remove(),1200+i*70); }
}
let bubbleT=null;
function bubble(html, cls, ms){
  scene.querySelector('.bubble')?.remove(); clearTimeout(bubbleT);
  const b=document.createElement('div'); b.className='bubble '+(cls||''); b.innerHTML=html; scene.appendChild(b);
  bubbleT=setTimeout(()=>b.remove(), ms||2500);
}

const toastQ=[]; let toasting=false;

function nextToast(){
  const id=toastQ.shift(); if(!id){ toasting=false; return; } toasting=true;
  const [ic,nm]=BADGES[id]; const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<span class="ti">${BD(ic)}</span><div class="tn">${IC('icMedal')} ${nm}</div>`;

}

/* 대사는 단계 시작에 1문장. 덧붙일 설명·전략은 tips[i]에 두고 '팁' 버튼을 눌렀을 때만 보인다 */
function narrate(lines, tips){
  return new Promise(res=>{
    let i=0; const show=()=>{
      const tp=tips&&tips[i];
      panel.innerHTML=`<div class="talk"><div class="face" aria-hidden="true">${CAP()}</div><div class="txt"><div class="name">써냥이</div><p class="line">${lines[i]}</p>${tp?`<button class="btn alt sm tipb" data-act="tip">${IC('icBulb')} 팁</button>`:''}</div></div>
        ${lines.length>1?`<div class="dots">${lines.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`:''}
        <button class="btn" id="nx">${i<lines.length-1?'다음':'시작!'} ${IC('icNext')}</button>`;
      const b=$('nx'); b.focus({preventScroll:true}); b.onclick=()=>{ i++; if(i<lines.length) show(); else res(); };
      const tb=panel.querySelector('.tipb'); if(tb) tb.onclick=()=>{ tb.outerHTML=`<p class="tipx">${tp}</p>`; };
    }; show();
  });
}

function drawHud(){
  const inStage = st && (mode==='play'||mode==='talk'||mode==='stageEnd');
  const lbl = inStage ? (st.coop?IC('icPair'):'')+'<span class="nm">'+STAGES[st.key].label+'</span>' : '<span class="nm">'+(mode==='result' ? '오늘의 신문' : '무역 속보 데스크')+'</span>';
  const si = inStage ? STAGE_ORDER.indexOf(st.key) : -1;
  const pips = si>=0 ? `<span class="pips">${STAGE_ORDER.map((_,i)=>`<i class="${i<si?'done':i===si?'on':''}"></i>`).join('')}</span>` : '';
  let h=`<button class="ib" data-act="home" aria-label="처음으로">${IC('icReset')}</button><span class="day">${lbl}${pips}</span>`;
  if(inStage){
    const prac=STAGES[st.key].practice, left=Math.max(0,Math.ceil((st.dur-st.t)/1000));
    const tg=prac?null:targets(st.key), next=tg?tg.find(x=>x>st.score):null;
    h+=`<div class="stats">
      <span class="chip time ${!prac&&left<=15?'low':''}" id="hT">${IC('icClock')}<span id="hTv">${prac?'연습':Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}</span></span>
      ${prac?'':`<span class="chip hearts" id="hH" aria-label="하트 ${st.hearts}">${IC('icHeart','ht').repeat(Math.max(0,st.hearts))}${IC('icHeart0','ht0').repeat(Math.max(0,3-st.hearts))}</span>`}
      <span class="chip combo ${comboMult(st.combo)>1?'hot':''}" id="hC">${IC('icFlame','fl')}x${comboMult(st.combo)}</span>
      ${prac?'':`<span class="chip goal ${next?'':'met'}" id="hG">${IC('icTarget')}${fmt(next||tg[2])}</span>`}
      <span class="chip score"><small>점수</small><b id="hS">${fmt(st.score)}</b></span></div>`;
  } else h+='<span class="stats"></span>';
  h+=`<button class="ib" data-act="rules" aria-label="규칙 보기">${IC('icRules')}</button><button class="ib" data-act="shelf" aria-label="배지 보기">${IC('icMedal')}<span class="cnt">${G.badges.length}</span></button>`;
  hud.innerHTML=h;
}
function hudTick(){
  const t=$('hT'); if(!t||!st) return; if(STAGES[st.key].practice) return;
  const left=Math.max(0,Math.ceil((st.dur-st.t)/1000)); const s=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  const v=$('hTv'); if(v.textContent!==s){ v.textContent=s; t.classList.toggle('low',left<=15); }
}

/* ---------- feed (tip cards) ---------- */
function drawFeed(){
  if(!st){ feed.innerHTML=''; return; }
  const k='#'+st.cards.map(c=>c.uid+':'+(c.uid===st.sel)).join(',');   // '#': 카드 0장일 때도 feedKey='' 초기화와 구별
  if(k===feedKey) return updBars(); feedKey=k;
  feed.innerHTML = st.cards.length ? st.cards.map(c=>{const card=CARD[c.id];
    const ems=SP(ITEM(card.e));
    return `<button class="tip ${c.uid===st.sel?'sel':''}" data-act="pick" data-u="${c.uid}" aria-label="제보 ${card.star} 입장">
      <span class="t1"><span class="its">${ems}</span><small>${c.scoop?IC('icBolt','bolt'):''}${IC('icStar','st').repeat(c.stars)}</small></span><span class="t2">${IC('icStar','st')} ${card.star}</span>
      <span class="bar"><i data-u="${c.uid}"></i></span></button>`;}).join('') : `<span class="empty">${SP('radio')}제보 대기 중</span>`;
  updBars();
}
function updBars(){
  for(const c of st.cards){ const i=feed.querySelector(`i[data-u="${c.uid}"]`); if(!i) continue;
    const f=c.dl>=1e12?1:Math.max(0,c.left/c.dl); i.style.width=(f*100)+'%'; i.className=f<.25?'low':f<.5?'mid':'';
    i.closest('.tip').classList.toggle('paused',c.paused); }
}

/* ---------- monitor ---------- */
const WAVES=[[8,14],[44,8],[86,16],[22,70],[70,74],[52,40]].map(p=>`<svg class="wv" style="left:${p[0]}%;top:${p[1]}%" viewBox="-16 -4 32 8" aria-hidden="true"><use href="#a-wave" x="-16" y="-4" width="32" height="8"/></svg>`).join('');
/* 1000×480처럼 낮은 화면: 단서 3줄 + 힌트 3줄이 다 들어가도록 장면을 줄인다(글자·그림 크기만 바뀜, 내용은 그대로) */
function fitMon(){
  mon.classList.remove('tight','tighter'); if(!$('stg')) return;
  const over=()=>mon.scrollHeight>mon.clientHeight+1 || $('stg').getBoundingClientRect().height<($('stg').dataset.min|0);
  $('stg').dataset.min=128; if(!over()) return;
  mon.classList.add('tight'); $('stg').dataset.min=0; if(!over()) return;
  mon.classList.add('tighter');
}
addEventListener('resize',()=>{ if(mode==='play'&&performance.now()>=animUntil){ monKey=''; drawMonitor(true); } });
function monState(){ const c=cardOf(st); return c ? [c.uid,c.shown,visOf(c),c.hint,c.starLeft].join('|') : 'none'; }
function bandsOf(c){
  const card=CARD[c.id], other=otherOf(c.id);
  const L = c.starLeft ? card.star : other, R = c.starLeft ? other : card.star;
  return {L,R};
}
function bandHTML(name, side, isStar, glow){
  return `<div class="band ${side} ${isStar?'star':''} ${glow?'glow':''}" data-side="${side}">${SP(PLACE(name),'bs')}<span class="bt"><span class="who">${isStar?IC('icStar','st')+' 입장':'상대'}</span>${NAME(name)}</span></div>`;
}
function drawMonitor(force){
  if(!st || mode!=='play') return;
  const k=monState(); if(!force && (k===monKey || performance.now()<animUntil)) return; monKey=k;
  const c=cardOf(st); const old = st.key==='s1' || st.key==='p';
  mon.className='monitor'+(old?' old':'');
  if(!c){ mon.innerHTML=`<div class="idle">${SP('radio')}다음 제보를 기다려요…</div>`; drawPanel(); return; }
  const card=CARD[c.id], p=partsOf(card)[0], ans=ansOf(card.star,p), {L,R}=bandsOf(c);
  const hs=hints(st,c.uid), h=c.hint;
  const sameName = ans==='home';
  // hint 2: direction arrow only (no names)
  let arrow='';
  if(h>=2){
    const fromLeft = sameName ? c.starLeft : (p.from===L && !(L===R)) ;
    const x1=fromLeft?24:76, x2=fromLeft?76:24;
    arrow=`<svg class="arrow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--a-navy)"/></marker></defs>
      <path d="M${x1} 82 Q50 98 ${x2} 82" stroke="var(--a-navy)" stroke-width="2.6" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)" vector-effect="non-scaling-stroke"/></svg>`;
  }
  mon.innerHTML=`
    <span class="mon-label ${c.scoop?'scoop':''}">${c.scoop?IC('icBolt')+'특종! 점수 ×2':IC('icNews')+'제보'} ${IC('icStar','st').repeat(c.stars)}</span>
    <div class="stage" id="stg"><span class="gr"></span>${WAVES}
      ${bandHTML(L,'l',L===card.star&&c.starLeft,h>=1&&c.starLeft)}
      ${bandHTML(R,'r',!c.starLeft,h>=1&&!c.starLeft)}
      <div class="item" id="item"><span class="its"><span class="pt" data-k="${ITEM(p.e)}"><span class="pl">${SP(ITEM(p.e))}</span><span class="inm">${p.n}</span></span></span></div>
      ${arrow}
    </div>
    <div class="clues">${card.c.slice(0,visOf(c)).map((t,i)=>`<div class="clue ${c.lens&&i===c.shown-1?'more':''}">${em(t)}</div>`).join('')}</div>
    <div class="hintbox">${h>0?`<span class="hn">${IC('icBulb')}${h}</span> ${h===3?'<b>'+em(hs[2])+'</b>':em(hs[h-1])}`:''}${c.free&&h===1?' <span class="lab">(무료)</span>':''}</div>`;
  // hint 2 for home cards: say both places
  fitMon();
  bindDrag();
  drawPanel();
}
// drag the item onto a slot (optional; taps work too)
function bindDrag(){
  const it=$('item'); if(!it) return;
  it.onpointerdown=e=>{
    if(mode!=='play'||performance.now()<animUntil) return;
    const ghost=document.createElement('div'); ghost.className='fly'; ghost.style.position='fixed'; const cur=it.querySelector('.pt'); ghost.innerHTML=cur?SP(cur.dataset.k):'';
    ghost.style.transition='none'; ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; document.body.appendChild(ghost);
    it.setPointerCapture(e.pointerId);
    const mv=ev=>{ ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px'; };
    const up=ev=>{ it.removeEventListener('pointermove',mv); it.removeEventListener('pointerup',up); it.removeEventListener('pointercancel',up); ghost.remove();
      const el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-act="slot"]'); if(el) choose(el.dataset.c,false); };
    it.addEventListener('pointermove',mv); it.addEventListener('pointerup',up); it.addEventListener('pointercancel',up);
  };
}

/* ---------- panel ---------- */
function drawPanel(){
  if(mode!=='play') return;
  const c=cardOf(st), card=c?CARD[c.id]:null, dis=!c||performance.now()<animUntil?'disabled':'';
  const freeMore = c && visOf(c)<c.shown;
  const canLens = c && (freeMore || (!c.lens && !c.scoop && c.shown<card.c.length));
  const n=st.combo, m=comboMult(n), nextAt = n<3?3:n<6?6:n<10?10:null, from = n<3?0:n<6?3:n<10?6:10;
  const seg=nextAt?Array.from({length:nextAt-from},(_,i)=>`<i class="${i<n-from?'on':''}"></i>`).join(''):'<i class="on"></i>';
  panel.innerHTML=`
    <div class="starbadge">${c?`${STAR} ${NAME(card.star)}<small>입장</small>`:`${STAR} 입장<small>제보를 골라요</small>`}</div>
    ${['imp','exp','home'].map(k=>`<button class="slot s-${k}" data-act="slot" data-c="${k}" ${dis}>${SLOTIC(k)} ${SLOT[k][1]}</button>`).join('')}
    <div class="row"><button class="btn alt sm" data-act="lens" ${canLens&&!dis?'':'disabled'}>${IC('icLens')} 단서 +1${freeMore||!c?'':' (½점)'}</button>
      <button class="btn alt sm" data-act="hint" ${c&&c.hint<3&&!dis?'':'disabled'}>${IC('icBulb')} 힌트 ${c?Math.min(3,c.hint+1):1}/3</button></div>
    ${c&&c.hint>=3?`<button class="btn" data-act="auto" ${dis}>힌트대로 하기 ${IC('icCheck')}</button>`:''}
    <div class="gauge">${IC('icFlame','fl')} <span class="g">${seg}</span><span>${nextAt?`다음 x${comboMult(nextAt)}`:'최고 x3'}</span></div>
    ${st.help?`<div class="lab">${IC('icBulb','fl')} 도움: 마감 1.5배</div>`:''}`;
}

/* ---------- main loop ---------- */
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(250, now-last); last=now;
  if(mode!=='play' || modalOpen || document.hidden) return;
  const prevH=st.hearts, prevCombo=st.combo;
  st=tick(st,dt);
  for(const ev of st.ev){
    if(ev.type==='miss'){ feedKey=''; bubble(`${IC('icTimer')} 놓쳤어요! ${CARD[ev.id].star} 입장: ${SLOTIC(ev.ans)} ${SLOT[ev.ans][1].replace(' 뉴스','')}`,'no',1800); }
    if(ev.type==='help') bubble(IC('icBulb','fl')+' 도움 켜짐! 마감 1.5배','',2600);
  }
  if(st.hearts!==prevH || st.combo!==prevCombo) drawHud();
  hudTick(); drawFeed(); drawMonitor(false);
  if(st.ended) endStage();
}
document.addEventListener('visibilitychange',()=>{ last=performance.now(); });

/* ---------- answering ---------- */
async function choose(choice, auto){
  if(mode!=='play' || performance.now()<animUntil) return;
  const c=cardOf(st); if(!c) return;
  const before=st, o=answer(st,c.uid,choice,auto); const res=o.res; if(!res) return;
  st=o.st; animUntil=performance.now()+(RM?250:950);
  panel.querySelectorAll('button').forEach(b=>b.disabled=true);
  const stg=$('stg'), item=$('item');
  const {L,R}=bandsOf(c);
  const sideOf=name=> name===L && name===R ? (c.starLeft?'l':'r') : name===L ? 'l' : 'r';
  const bandEl=s=>stg.querySelector(`.band.${s}`);
  // movement: seller → buyer (shown only after judging)
  let fromS, toS;
  if(res.ans==='home'){ fromS=c.starLeft?'l':'r'; toS=fromS==='l'?'r':'l'; }
  else { fromS=sideOf(res.from); toS=sideOf(res.to); }
  const pos={ l:[21,50], r:[79,50] };
  const flyer=(art,cls,a,b)=>{ const f=document.createElement('div'); f.className='fly '+(cls||''); f.innerHTML=SP(art); f.style.left=a[0]+'%'; f.style.top=a[1]+'%'; stg.appendChild(f);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ f.style.left=b[0]+'%'; f.style.top=b[1]+'%'; })); setTimeout(()=>f.remove(),RM?300:1100); };
  item.querySelector('.pt')?.style.setProperty('opacity','0');
  flyer(ITEM(res.e),'',[50,50],pos[toS]); if(res.ans!=='home' || true) flyer('coin','coin',pos[toS],pos[fromS]);
  const tag=(s,cls,who,k,txt)=>{ const t=document.createElement('span'); t.className='btag '+cls; t.innerHTML=`${GOODS(who)}: ${IC(k)} ${txt}`; bandEl(s).appendChild(t); };
  if(res.ok){
    if(res.ans==='home'){ const s=document.createElement('div'); s.className='stamp'; s.innerHTML=IC('icHome')+' 한 나라 안'; stg.appendChild(s); }
    else { tag(fromS,'exp',res.from,'icExp','수출'); tag(toS,'imp',res.to,'icImp','수입'); }
    if(res.done){
      const v=document.createElement('div'); v.className='verdict ok'; v.innerHTML= res.pts ? `+${fmt(res.pts)}${res.mult>1?`&nbsp; ${IC('icFlame','fl')}x${res.mult}`:''}` : IC('icCheck')+' 정답'; stg.appendChild(v);
      const sc=$('hS'); if(sc){ fxAt(sc, res.pts?`+${fmt(res.pts)}`:IC('icCheck')); }
      if(comboMult(st.combo)>comboMult(before.combo)){ scene.classList.remove('flash'); void scene.offsetWidth; scene.classList.add('flash'); bubble(`${IC('icFlame','fl')} 콤보 x${comboMult(st.combo)}!`,'',1400); }
      const tip=feed.querySelector(`[data-u="${c.uid}"]`); if(tip) fxAt(tip,SP('news'));
    }
  } else {
    stg.closest('.monitor').classList.add('shake'); setTimeout(()=>mon.classList.remove('shake'),460);
    const v=document.createElement('div'); v.className='verdict no'; v.innerHTML=`${IC('icCross')} 정답은 ${SLOTIC(res.ans)} ${SLOT[res.ans][1]}`; stg.appendChild(v);
    if(res.ans!=='home'){ tag(fromS,'exp',res.from,'icExp','수출'); tag(toS,'imp',res.to,'icImp','수입'); }
    else { const s=document.createElement('div'); s.className='stamp no'; s.innerHTML=IC('icHome')+' 한 나라 안'; stg.appendChild(s); }
  }
  drawHud(); feedKey='';
  // one-line naming (non-blocking): the first line wins; headlines after
  const ln=res.ok?res.lines[0]:null;
  if(ln) bubble(CAP('cp')+LINES[ln], '', 2600);
  if(!res.ok && res.why) whyBubble('why_'+res.why);
  res.badges.forEach(toast);
  if(res.head!=null){ setTimeout(()=>bubble(`${IC('icNews')} 「${HEADLINES[res.head].t}」`,'news',2600), ln?2700:900); }
  G.badges=st.badges; G.said=st.said; G.heads=st.heads;
  await wait(RM?250:1000);
  animUntil=0; if(mode!=='play') return;
  monKey=''; feedKey=''; drawFeed(); drawMonitor(true);
  if(st.ended) endStage();
}

};
const INTRO_TIP={
  s1:['마지막 3장은 '+STAR+' 입장이 <b>상인의 나라</b>로 바뀌어!'],
  s2:['한 나라 안에서 사고판 일도 섞여 있어. '+STAR+' 입장도 가끔 바뀌어.'],

async function start(){
  mode='talk'; drawHud();
  await narrate(['<b>제보 카드</b>를 읽고 뉴스 칸에 꽂아 줘!'],['카드에는 답이 안 적혀 있어. '+STAR+' 나라 입장에서 생각해!']);
  await modal(rulesHTML(),'알겠어요');
  runStage('p');
}
async function runStage(key, opts){
  opts=opts||{}; scene.classList.remove('resmode'); scene.querySelector('.bubble')?.remove(); VIS={}; const seed=(Date.now()%100000)+key.length;
  if(key===LAST) lastSnap={ G:deepCopy(G), opts:{...opts} };   // 마지막 단계 시작 순간
  G.attempts[key]=(G.attempts[key]||0)+1;
  st=newStage(key, seed, {badges:G.badges, said:G.said, heads:G.heads, coop:!!opts.coop});
  mode='talk'; feedKey=''; monKey=''; drawHud(); feed.innerHTML=''; mon.className='monitor'+(key==='s1'||key==='p'?' old':'');
  mon.innerHTML=`<div class="idle rib">${key==='p'?IC('icFlask')+' 연습 3장 · 시간 제한 없음':STAGES[key].label}</div>`;
  if(key!=='p' && G.attempts[key]===1) await narrate(INTRO[key], INTRO_TIP[key]);
  if(key==='p') bubble(IC('icFlask')+' 천천히 해도 돼','',2000);
  mode='play'; last=performance.now(); st=tick(st,0); drawHud(); drawFeed(); drawMonitor(true);
}
async function endStage(){
  if(mode!=='play') return; mode='stageEnd';
  await wait(RM?100:700);
  if(mode!=='stageEnd' || !st) return;   // 처음으로 를 누른 경우
  const key=st.key, cfg=STAGES[key];
  G.badges=st.badges; G.said=st.said; G.heads=st.heads;
  if(cfg.practice){
    mode='talk'; mon.className='monitor old'; mon.innerHTML=`<div class="idle rib">${IC('icCheck')} 연습 끝</div>`; scene.querySelector('.bubble')?.remove();
    await narrate(['이제 틀리면 '+IC('icHeart','ht')+'가 줄어!']); return runStage('s1');
  }
  const total=stageScore(st), failed=st.reason==='fail', stars=st.coop?Math.min(1,stageStars(key,total,failed)):stageStars(key,total,failed);
  const prev=G.rec[key];
  const rec={score:total, stars, failed, coop:st.coop, attempts:G.attempts[key], stats:st.stats, maxCombo:st.maxCombo};
  if(!prev || total>prev.score) G.rec[key]=rec; else { prev.attempts=G.attempts[key]; prev.coop=prev.coop||st.coop; }
  const b=st.bonus;
  mon.className='monitor'; mon.innerHTML=`<div class="res"><div class="final"><span class="pts">${fmt(total)}</span><span class="grd ic">${SP('news')}${failed?IC('icCross','x'):''}</span></div>
    ${failed?`<div class="say">${IC('icHeart','ht')} <b>신문 발행 실패!</b></div>`:st.reason==='time'?`<div class="say">${IC('icClock')} 마감 시간 끝!</div>`:''}
    <div class="facts"><span>${IC('icCheck','ok')} ${st.stats.correct}장</span><span>${IC('icCross','no')} ${st.stats.wrong}장</span><span>${IC('icTimer')} ${st.stats.missed}장</span><span>${IC('icFlame','fl')} 최고 ${st.maxCombo}연속</span></div></div>`;
  feed.innerHTML=''; drawHud();
  const ok=canAdvance(G.rec[key]);
  const nxt={s1:'s2',s2:'s3',s3:null}[key];
  panel.innerHTML=`<div class="stars" aria-label="별 ${stars}개">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}" style="animation-delay:${i*.15}s"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#a-${i<stars?'icStar':'icStar0'}"/></svg></span>`).join('')}</div>
    <button class="btn alt sm" data-act="bonus">${IC('icTarget')} 점수 내역</button>
    <div class="bonus" hidden><span>제보 점수</span><b>${fmt(st.score)}</b><span>남은 ${IC('icHeart','ht')} 보너스</span><b>+${fmt(b.hearts)}</b><span>${IC('icNews')} 무결점 신문</span><b>+${fmt(b.perfect)}</b>
      <span class="tot">합계</span><b class="tot">${fmt(total)}</b><span>${IC('icTarget')} 별 기준</span><b>${targets(key).map(fmt).join(' / ')}</b></div>
    ${failed||stars===0?`<button class="btn" data-act="retry">다시 하기 ${IC('icReset')}</button><button class="btn alt" data-act="coop">${IC('icBulb')} 선장과 함께 하기 (마감 1.5배, 점수 ½)</button>`:''}
    ${ok?(nxt?`<button class="btn ${failed||stars===0?'alt':''}" data-act="next">${STAGES[nxt].label} ${IC('icNext')}</button>`:`<button class="btn ${failed||stars===0?'alt':''}" data-act="final">오늘의 신문 보기 ${IC('icNext')}</button>`):''}
    ${!(failed||stars===0)?`<button class="btn alt" data-act="retry">다시 하기 ${IC('icReset')} (기록 경신)</button>`:''}`;
  const endLine = failed ? '괜찮아! 다시 해 보자.' : stars>=3 ? '특종 기자 탄생!' : stars>=1 ? '좋아, 신문이 나왔어!' : IC('icBulb','fl')+' 힌트를 써도 괜찮아.';
  bubble(CAP('cp')+endLine,'',3200);
}
function finalResult(){
  mode='result'; st=null; drawHud(); scene.querySelector('.bubble')?.remove(); clearTimeout(bubbleT);
  const keys=STAGE_ORDER, total=keys.reduce((a,k)=>a+(G.rec[k]?G.rec[k].score:0),0), g=grade(total);
  G.best=Math.max(G.best,total);
  const recs=keys.map(k=>G.rec[k]||{score:0,stars:0,stats:{correct:0,done:0,tricky:0,trickyOK:0},maxCombo:0});
  const done=recs.reduce((a,r)=>a+r.stats.done,0), cor=recs.reduce((a,r)=>a+r.stats.correct,0);
  const tr=recs.reduce((a,r)=>a+r.stats.tricky,0), trOK=recs.reduce((a,r)=>a+r.stats.trickyOK,0), mc=Math.max(...recs.map(r=>r.maxCombo));
  const max=Math.max(...keys.map(k=>REF[k]*1.1), ...recs.map(r=>r.score));
  feed.innerHTML=`<span class="empty">${SP('news')}신문 발행!</span>`; scene.classList.add('resmode');
  mon.className='monitor'; mon.innerHTML=`<div class="res">
    <div class="final"><span class="pts">${fmt(total)}</span><span class="grd">${g.letter}</span><span class="ttl">${SP(GRADE_ART[g.letter]||'news')}<span>${g.title}</span></span></div>
    ${keys.map((k,i)=>`<div class="rb"><span>${STAGES[k].label.replace(/^\d단계 /,'')}</span><span class="rt"><span class="rf" style="display:block" data-w="${recs[i].score/max*100}"></span></span><span class="v">${fmt(recs[i].score)}</span><span class="sv">${IC('icStar','st').repeat(recs[i].stars)||'—'}</span></div>`).join('')}
    <div class="facts" hidden id="rFacts"><span>${IC('icTarget','fl')} 정확도 ${done?Math.round(cor/done*100):0}%</span><span>${IC('icFlame','fl')} 최고 콤보 ${mc}</span><span>${IC('icTrap','fl')} 함정 카드 ${trOK}/${tr}</span>${G.best>total?`<span>이번 최고 ${fmt(G.best)}</span>`:''}</div>
    ${G.best>total?`<div class="lab">이번 최고 ${fmt(G.best)}점</div>`:''}
    <button class="paperb" data-act="paper">${IC('icNews')} 신문 1면 <span>${IC('icImp','imp')} ${[0,1].filter(h=>G.heads.includes(h)).length}/2</span><span>${IC('icExp','exp')} ${[2,3].filter(h=>G.heads.includes(h)).length}/2</span></button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>mon.querySelectorAll('.rf').forEach(e=>e.style.width=e.dataset.w+'%')));
  if(g.letter==='S'||g.letter==='A'){ fxAt(mon.querySelector('.grd'),IC('icStar','st'),8); }
  /* 배지 선반(무역항 결과 카드와 같은 틀): 배지 5개를 한 줄로, 누르면 아래 칸에 교과서 뜻. 처음에는 '무역' 뜻 */
  panel.innerHTML=`<div class="rcard"><div class="rshelf">${BADGE_LIST.map(id=>`<button class="bdb ${G.badges.includes(id)?'':'off'}" data-bd="${id}" aria-label="${BADGES[id][1]}">${BD(BADGES[id][0])}</button>`).join('')}</div>
    <div class="def" id="bdDef"><span class="lab">배지를 누르면 뜻</span></div></div>
    <div class="formula">사 오면 ${IC('icImp','imp')} <b>수입</b> · 팔면 ${IC('icExp','exp')} <b>수출</b></div>
    <button class="btn alt sm" data-act="q">${IC('icQ')} 생각해 볼 질문</button>
    <div class="row"><button class="btn" data-act="again">다시 하기 ${IC('icReset')}</button><button class="btn alt" data-act="home">처음으로</button></div>
    ${lastSnap?`<button class="btn alt" data-act="replay">마지막 단계 다시 ${IC('icReset')}</button>`:''}`;
}
const paperHTML=()=>`<div class="paper"><h3>${IC('icNews')} 오늘의 신문 1면 (교과서 96쪽)</h3><div class="cols">
      <div><span>${IC('icImp','imp')} 수입 관련 뉴스</span>${[0,1].map(h=>G.heads.includes(h)?`「${HEADLINES[h].t}」`:`<em class="lock">${IC('icLock')} 아직 못 찾음</em>`).join('<br>')}</div>
      <div><span>${IC('icExp','exp')} 수출 관련 뉴스</span>${[2,3].map(h=>G.heads.includes(h)?`「${HEADLINES[h].t}」`:`<em class="lock">${IC('icLock')} 아직 못 찾음</em>`).join('<br>')}</div></div></div>`;
function showDef(id){
  const d=document.querySelector('.modal #bdDef')||$('bdDef'); if(!d) return;
  (d.closest('.modal')||panel).querySelectorAll('[data-bd]').forEach(x=>x.classList.toggle('cur',x.dataset.bd===id));
  d.innerHTML=`<b>${BADGES[id][1]}</b>${G.badges.includes(id)?'':' (아직)'} — ${DEFS[id]}`;
}
async function shelfModal(){
  await modal(`<h2>${IC('icMedal')} 모은 배지 ${G.badges.length}/5</h2><div class="shelf">${BADGE_LIST.map(id=>`<button class="bd ${G.badges.includes(id)?'':'lock'}" data-bd="${id}"><span class="bi">${BD(BADGES[id][0])}</span><span>${BADGES[id][1]}${G.badges.includes(id)?'':' (아직)'}</span></button>`).join('')}</div><div class="def" id="bdDef"><span class="lab">배지를 누르면 뜻</span></div>${CREDIT}`,'닫기 (계속)');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const bd=e.target.closest('[data-bd]'); if(bd){ showDef(bd.dataset.bd); return; }
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act;
  if(a==='home'){ if(mode==='play'||mode==='talk'){ /* go home immediately */ } reset(); return title(); }
  if(a==='rules') return modal(rulesHTML(),'알겠어요 (계속)');
  if(a==='shelf') return shelfModal();
  if(a==='start') return start();
  if(a==='retry') return runStage(G.rec && st ? st.key : 's1');
  if(a==='coop') return runStage(st.key,{coop:true});
  if(a==='next') return runStage({s1:'s2',s2:'s3'}[st.key]);
  if(a==='final') return finalResult();
  if(a==='bonus'){ const x=panel.querySelector('.bonus'); if(x){ x.hidden=false; b.remove(); } return; }
  if(a==='q'){ b.outerHTML=`<div class="q">${IC('icQ')} 나라들은 왜 무역을 할까?</div>`; return; }
  if(a==='paper'){ const f=$('rFacts'); return modal(paperHTML()+(f?`<div class="facts">${f.innerHTML}</div>`:''),'닫기'); }
  if(a==='again'){ const best=G.best; reset(); G.best=best; return runStage('s1'); }
  if(a==='replay') return replayLast();
  if(mode!=='play') return;
  if(a==='pick'){ st=select(st,+b.dataset.u); feedKey=''; drawFeed(); if(performance.now()>=animUntil) drawMonitor(true); }
  else if(a==='slot') choose(b.dataset.c,false);
  else if(a==='lens'){ const c=cardOf(st); if(c && visOf(c)<c.shown) VIS[c.uid]=visOf(c)+1; else { st=useLens(st); const d=cardOf(st); if(d) VIS[d.uid]=d.shown; } drawMonitor(true); }
  else if(a==='hint'){ st=hintUp(st); scene.querySelector('.bubble')?.remove(); drawMonitor(true); }
  else if(a==='auto'){ choose(solve(st),true); }
});
document.addEventListener('keydown',e=>{ if(mode!=='play'||modalOpen) return; const k={'1':'imp','2':'exp','3':'home'}[e.key]; if(k) choose(k,false); });

// read-only peek for automated checkers (does not change the game)
window.tradeDesk={ state:()=>st, mode:()=>mode, rec:()=>G.rec };
reset(); title(); requestAnimationFrame(t=>{ last=t; loop(t); });
})();
</script>
</body>
