<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>바꾸고 넘겨요 – 6-2 사회 46차시 수업용 게임</title>
<meta name="description" content="6-2 사회 46차시 「지속가능한 미래를 위해 우리가 할 수 있는 일을 실천해 볼까요」 수업용 게임. 종이컵·전등 같은 생활 물건을 바꾸고 친구에게 바통을 넘기며 더하기·빼기 실천을 익혀요.">
<meta name="eng-pair" content="u3b8.html">
<link rel="canonical" href="https://wlfmghzm-dotcom.github.io/sahoe-game/games/u3a8.html">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>바꾸고 넘겨요</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 수업용 개념 체험 게임 엔진 (무역항 v3-2d-k에서 떼어 냄). 태블릿 가로 기준: HUD 한 줄 → [장면 63% | 패널 37%], 한 화면, 세로 스크롤 없음.
   그림은 전부 ASSETS(id → SVG 문자열/이미지 URI)에서 온다. 장면 = SCENE.renderScene(G) 한 곳, 패널·HUD = 장면과 독립된 HTML.
   게임마다 바꾸는 곳은 아래 스크립트 안의 표시된 구역 셋뿐이다: ① GAME  ② LOGIC  ③ SCENE + ASSETS. build.js가 채운다. */
:root{
  --bg:#EDF2EF; --surface:#FBF8F1; --ink:#1E2B3A; --muted:#55657A; --line:#DCD4C2;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#FBF8F1; --good:#4CAF7A; --bad:#D9534F; --veil:rgba(20,30,42,.62);
  --a-sea:#2E6F8E; --a-sea-d:#245A74; --a-shal:#4FA3B8; --a-shal-d:#3F8798; --a-sand:#EBD9B4; --a-sand-d:#D6C196;
  --a-land:#8DB48E; --a-land-d:#779D78; --a-wood:#A8754F; --a-wood-d:#8C603F; --a-navy:#1E2B3A; --a-navy-l:#33475C;
  --a-org:#E8743B; --a-org-d:#C95F2C; --a-grn:#4CAF7A; --a-grn-d:#3C9064; --a-red:#D9534F; --a-red-d:#B94340;
  --a-paper:#FBF8F1; --a-paper-d:#E6E0D2;
  --game:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A23; --surface:#1C2835; --ink:#F1ECE0; --muted:#A9B4C1; --line:#2F3E50;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#1E2B3A; --good:#4CAF7A; --bad:#D9534F; --veil:rgba(0,0,0,.7);
  --a-sea:#245A74; --a-sea-d:#1D4B61; --a-shal:#3F8798; --a-shal-d:#357484; --a-land:#779D78; --a-land-d:#668A67;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A23; --surface:#1C2835; --ink:#F1ECE0; --muted:#A9B4C1; --line:#2F3E50;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#1E2B3A; --good:#4CAF7A; --bad:#D9534F; --veil:rgba(0,0,0,.7);
  --a-sea:#245A74; --a-sea-d:#1D4B61; --a-shal:#3F8798; --a-shal-d:#357484; --a-land:#779D78; --a-land-d:#668A67;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.4;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:var(--game);color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--a-shal);outline-offset:2px}
.ico{width:26px;height:26px;display:block}

/* 아트 색 클래스 (ASSETS 안 SVG가 씀) */
.f-sea{fill:var(--a-sea)}.f-sead{fill:var(--a-sea-d)}.f-shal{fill:var(--a-shal)}.f-shald{fill:var(--a-shal-d)}
.f-sand{fill:var(--a-sand)}.f-sandd{fill:var(--a-sand-d)}.f-land{fill:var(--a-land)}.f-landd{fill:var(--a-land-d)}
.f-wood{fill:var(--a-wood)}.f-woodd{fill:var(--a-wood-d)}.f-navy{fill:var(--a-navy)}.f-navyl{fill:var(--a-navy-l)}
.f-org{fill:var(--a-org)}.f-orgd{fill:var(--a-org-d)}.f-grn{fill:var(--a-grn)}.f-grnd{fill:var(--a-grn-d)}
.f-red{fill:var(--a-red)}.f-paper{fill:var(--a-paper)}.f-paperd{fill:var(--a-paper-d)}
.s-line{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding-bottom:10px}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;padding-top:6px;min-height:58px}
.ib{width:50px;height:50px;border-radius:14px;background:var(--surface);display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.94)}
/* §13: 규칙·배지 버튼은 아이콘 아래 이름(블라인드 시험: 아이콘만으로는 몰랐음) */
.ib.lb{width:58px;grid-template-rows:auto auto;gap:0;align-content:center;font-family:var(--game);font-size:18px;line-height:1;color:var(--ink,currentColor)}
.ib.lb svg{width:24px;height:24px}
.ib.lb span{display:block;margin-top:1px}
.stg{display:flex;align-items:center;gap:10px;font-family:var(--game);font-size:22px;white-space:nowrap;min-width:0}
.pips{display:flex;gap:5px}
.pips i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.pips i.on{background:var(--accent)}.pips i.done{background:var(--good)}
.sp{flex:1}
.combo{font-family:var(--game);font-size:22px;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:4px 14px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.combo.on{opacity:1;transform:scale(1)}
.score{display:flex;align-items:baseline;gap:8px;background:var(--surface);border-radius:14px;padding:2px 16px;min-height:50px}
.score small{font-family:var(--game);font-size:18px;color:var(--muted)}
.score b{font-family:var(--game);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right;display:inline-block}
.score b.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25)}}

/* 본문 2단 */
.main{position:relative;display:grid;grid-template-columns:minmax(0,63fr) minmax(300px,37fr);gap:10px;min-height:0}
.scene{position:relative;min-height:0;border-radius:18px;overflow:hidden;background:var(--a-sea);touch-action:none;user-select:none;-webkit-user-select:none}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* 패널 */
.panel{min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.cap{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:18px;padding:12px}
.cap svg{width:64px;height:64px;flex:none}
.say{font-size:19px;line-height:1.42;word-break:keep-all;min-height:2.84em}
.say b{font-family:var(--game);font-weight:400;display:block;font-size:18px;color:var(--muted);margin-bottom:2px}
.big{font-family:var(--game);font-size:26px;min-height:60px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-shadow:inset 0 -5px 0 var(--accent-d)}
.big:active{transform:translateY(2px)}
.big .ico{width:24px;height:24px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.rc{background:var(--surface);border-radius:14px;padding:6px 6px 4px;text-align:center;position:relative}
.rc svg{width:100%;height:58px;display:block}
.rc span{font-family:var(--game);font-size:18px;display:block;line-height:1.15;word-break:keep-all}
.rc.new{box-shadow:inset 0 0 0 3px var(--accent)}
.rc.new::after{content:"새 규칙";position:absolute;top:-12px;right:4px;font-family:var(--game);font-size:18px;line-height:1.2;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 6px}
.prog{display:flex;flex-wrap:wrap;gap:5px;background:var(--surface);border-radius:14px;padding:8px 10px;align-items:center}
.prog svg{width:28px;height:18px}
.prog .wt{opacity:.4}.prog .ms{opacity:.55;filter:grayscale(1)}
/* §13 진행 표시 = '이번 단계 남은 일': 끝낸 칸에 초록 체크, 방금 끝낸 칸은 반짝. 처음 보일 때 한 번 '남은 일' 이름표 */
.prog{position:relative}
.prog .pc{position:relative;display:inline-flex}
.prog .pc .ck{position:absolute;right:-5px;bottom:-5px;width:15px;height:15px}
.prog .pc.just{animation:pcPop .5s ease-out 2}
/* r5: '남은 일' 줄은 늘 한 줄(B형 4단계 12칸이 1000×480에서 두 줄로 넘쳤다). 칸이 많으면 그림이 줄어든다(최대 28px) */
.prog{flex-wrap:nowrap}
.prog .pc{flex:0 1 28px;min-width:8px}
.prog .pc>svg:not(.ck){width:100%;height:auto;max-height:18px}
.prog.many{gap:3px;padding-left:8px;padding-right:8px}
@keyframes pcPop{40%{transform:scale(1.45);filter:drop-shadow(0 0 5px var(--good))}}
.prog-tag{position:absolute;left:10px;top:calc(100% + 9px);background:var(--ink);color:var(--surface);font-family:var(--game);font-size:18px;line-height:1;border-radius:10px;padding:5px 10px;pointer-events:none;white-space:nowrap;box-shadow:0 3px 0 rgba(30,43,58,.2)}
.prog-tag::after{content:'';position:absolute;left:18px;top:-7px;border:7px solid transparent;border-top:0;border-bottom-color:var(--ink)}   /* r3: 진행 줄 아래(위에 두면 규칙 칸 글을 가렸다) */

.hint{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:16px;background:var(--surface);font-size:24px;box-shadow:inset 0 -4px 0 var(--line);margin-top:auto}
.hint .ico{width:30px;height:30px;color:var(--accent)}
.hint .pips i{width:13px;height:13px}
.hint:active{transform:translateY(2px)}
.hide{display:none!important}
/* '왜?' 버튼 줄(GAME.explain이 있을 때만 생김): [힌트 | 왜?]. 버튼 자리는 늘 같고, 설명이 없으면 보이지 않기만 한다(힌트가 움직이지 않게) */
.xp-row{display:flex;gap:8px;margin-top:auto;position:relative}
.xp-row .hint{flex:1;margin-top:0;min-width:0}
.xp-btn{flex:none;min-width:100px;min-height:58px;border-radius:16px;background:var(--surface);font-size:24px;color:var(--accent-d);box-shadow:inset 0 -4px 0 var(--line)}
.xp-btn:active{transform:translateY(2px)}
.xp-btn.off{opacity:.5}   /* r4: 설명이 아직 없으면 흐리게(사라지지 않음). 누르면 이 단계의 일반 '왜?' */
.xp-btn.new{animation:xpPop .5s 2}
@keyframes xpPop{50%{box-shadow:inset 0 0 0 4px var(--accent)}}
.xp-btn[aria-expanded="true"]{background:var(--a-navy);color:var(--a-paper);box-shadow:none}
.xp-card{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:3;background:var(--a-navy);color:var(--a-paper);border-radius:16px;padding:10px 14px;font-size:19px;line-height:1.4;word-break:keep-all;box-shadow:0 4px 0 rgba(30,43,58,.18)}
.xp-card em{font-style:normal;color:var(--a-org)}
.xp-card .d{display:block;margin-top:4px;opacity:.92}
.xp-card small{display:block;font-size:18px;opacity:.8;margin-top:2px}
.ib.got{animation:bump .4s 2}

/* 장면 위 오버레이 (HTML, 렌더러와 독립) */
.ghost{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;will-change:transform}
.ghost svg{width:100%;height:100%}
.ghost.sel{animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{transform:var(--t) scale(1.15)}}
.ring{position:absolute;border-radius:18px;box-shadow:0 0 0 4px var(--accent);animation:blink .7s ease-in-out infinite alternate}
.ring.dst{box-shadow:0 0 0 4px var(--a-paper),0 0 0 8px var(--accent)}
.ring.bad{box-shadow:0 0 0 4px var(--bad);animation:shake .3s}
.ring.hover{box-shadow:0 0 0 3px var(--a-paper);animation:none;opacity:.8}
@keyframes blink{from{opacity:.35}to{opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.callout{position:absolute;left:0;top:0;max-width:92%;background:var(--a-paper);color:var(--a-navy);font-family:var(--game);font-size:20px;line-height:1.25;border-radius:14px;padding:7px 14px;white-space:normal;word-break:keep-all;box-shadow:0 4px 0 rgba(30,43,58,.18);transform-origin:50% 100%}
.callout em{font-style:normal;color:var(--a-org-d)}
.toast{position:absolute;left:0;top:0;display:flex;gap:8px;align-items:center;background:var(--a-navy);color:var(--a-paper);font-family:var(--game);font-size:19px;border-radius:14px;padding:6px 14px 6px 8px;max-width:80%}
.toast svg{width:36px;height:36px;flex:none}
.fx{position:absolute;left:0;top:0;font-family:var(--game);font-size:28px;color:var(--a-paper);text-shadow:0 2px 0 var(--a-navy)}
.fx.fast{font-size:34px;color:var(--a-org)}
.dot{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%}
.ribbon{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--a-paper);color:var(--a-navy);font-family:var(--game);font-size:34px;border-radius:18px;padding:10px 26px;white-space:nowrap;box-shadow:0 6px 0 var(--a-org)}
.ribbon{white-space:normal;word-break:keep-all;width:max-content;max-width:calc(100% - 20px)}   /* 장면보다 길면 장면 안에서 줄을 바꾼다. 한 줄에 들어가면 전과 같다 */
.ribbon small{display:block;font-size:20px;color:var(--a-navy-l);text-align:center}
.ribbon.sm{font-size:26px;padding:6px 18px}.ribbon.sm small{font-size:18px}   /* r5: 가릴 수밖에 없을 때 작게 */
.finger{position:absolute;left:0;top:0;width:54px;height:66px;margin:-4px 0 0 -22px}
.finger svg{width:100%;height:100%}
.finger{transform-origin:22px 4px}   /* r4: 손끝 기준(뒤집기 rotate 180deg가 손끝 자리를 지킨다) */
/* 힌트(§11): 1단계부터 집을 것(hs)·놓을 곳(hd)이 함께 빛나고 화살표(.harrow)가 잇는다. 2단계는 더 굵고 빠르게(strong) */
.ring.hs{box-shadow:0 0 0 4px var(--accent),0 0 16px 6px rgba(232,116,59,.6);animation:hGlow .6s ease-in-out infinite alternate}
.ring.hd{box-shadow:0 0 0 4px var(--a-paper),0 0 0 8px var(--accent),0 0 20px 10px rgba(232,116,59,.5);animation:hGlow .6s ease-in-out infinite alternate}
.ring.hs.strong{box-shadow:0 0 0 6px var(--accent),0 0 24px 10px rgba(232,116,59,.75);animation-duration:.35s}
.ring.hd.strong{box-shadow:0 0 0 5px var(--a-paper),0 0 0 11px var(--accent),0 0 28px 14px rgba(232,116,59,.65);animation-duration:.35s}
@keyframes hGlow{from{opacity:.6}to{opacity:1}}
.harrow{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.harrow .ho{fill:none;stroke:var(--a-paper);stroke-width:13;stroke-linecap:round;opacity:.92}
.harrow .hl{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-dasharray:16 10;animation:hFlow .55s linear infinite}
.harrow .hh{fill:var(--accent);stroke:var(--a-paper);stroke-width:3.5;stroke-linejoin:round}
.harrow.strong .ho{stroke-width:16}.harrow.strong .hl{stroke-width:10;animation-duration:.35s}
@keyframes hFlow{to{stroke-dashoffset:-26}}
/* '해 보기'(§12): 새 동작을 단계 시작에 한 번 직접. 시간이 멈추고 집을 것·놓을 곳만 밝다(.tdim 구멍), 나머지·패널은 흐리게. 해 보면 이름표(.trylab) */
.tdim{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.tdim .tv{fill:rgba(14,22,34,.6)}
.trylab{position:absolute;pointer-events:none;left:0;top:0;background:var(--accent);color:#FBF8F1;font-family:var(--game);font-size:20px;line-height:1.15;border-radius:13px;padding:4px 12px;white-space:nowrap;box-shadow:0 0 0 2px var(--a-paper),0 3px 0 rgba(30,43,58,.25)}
/* r3: 해 본 동작과 같은 규칙 칸이 잠깐 빛남(이름표와 같은 때) / 새 규칙 '보이는 상태' 가리키기는 손가락 대신 빛 테두리 / 틀린 놓기 기본 '다시!' */
.rc.hit{box-shadow:inset 0 0 0 4px var(--accent),inset 0 0 18px rgba(232,116,59,.45);animation:rcHit .45s ease-out 2}   /* 안쪽 빛만(패널 밖으로 넘치지 않게) */
@keyframes rcHit{40%{box-shadow:inset 0 0 0 7px var(--accent),inset 0 0 26px rgba(232,116,59,.6)}}
.ring.look{box-shadow:0 0 0 4px var(--a-paper),0 0 0 7px var(--a-navy),0 0 18px 8px rgba(251,248,241,.55);animation:lookP .6s ease-in-out infinite alternate}
@keyframes lookP{from{opacity:.45}to{opacity:1}}
/* r5: 알림이 장면에 빈자리가 없으면 작게(.sm), 그래도 없으면 패널의 힌트 줄 위(.eng-dock)에 뜬다(장면의 집을 것·놓을 곳·keepClear를 가리지 않게) */
.callout.sm{font-size:18px;padding:4px 10px;line-height:1.2}
.trylab.sm{font-size:18px;padding:3px 9px}
.panel{position:relative}
.eng-dock{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6}
.eng-dock>.callout,.eng-dock>.trylab{position:relative;left:auto;top:auto;max-width:96%}
.nope{position:absolute;left:0;top:0;pointer-events:none;background:var(--bad);color:#fff;font-family:var(--game);font-size:20px;line-height:1.1;border-radius:12px;padding:4px 12px;white-space:nowrap;box-shadow:0 0 0 2px var(--a-paper)}
.app.trying .panel{opacity:.32;transition:opacity .2s}
.app.trying .panel *{pointer-events:none}

/* 모달 */
.veil{position:fixed;inset:0;background:var(--veil);display:grid;place-items:center;z-index:20;padding:12px}
.modal{background:var(--surface);border-radius:20px;padding:16px 18px;width:min(640px,100%);max-height:calc(100dvh - 24px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal h2{font-family:var(--game);font-weight:400;font-size:26px;margin:0}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mrow .rc svg{height:70px}
.btns{display:flex;gap:10px}
.btn2{flex:1;min-height:54px;border-radius:14px;font-size:22px;background:var(--bg)}
.btn2.pri{background:var(--accent);color:var(--accent-ink)}
.shelf{display:flex;flex-wrap:wrap;gap:8px}
.bd{width:58px;height:58px;border-radius:14px;background:var(--bg);display:grid;place-items:center}
.bd svg{width:46px;height:46px}
.bd.off svg{opacity:.25;filter:grayscale(1)}
.bd.cur{box-shadow:inset 0 0 0 3px var(--accent)}
.def{font-size:19px;word-break:keep-all;min-height:2.8em}
.credit{font-size:12px;color:var(--ink);text-align:right;margin-top:-6px;opacity:.85}
.def b{font-family:var(--game);font-weight:400;display:block}

/* 결과 */
.res{position:absolute;inset:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:minmax(0,40fr) minmax(0,60fr);gap:10px}
.rcard{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:0}
.rcard.l{align-items:center;justify-content:center;text-align:center}
.rcard .lab{font-family:var(--game);font-size:20px;color:var(--muted)}
.rcard .num{font-family:var(--game);font-size:min(96px,15vh);line-height:1;font-variant-numeric:tabular-nums}
.rcard .ttl{font-family:var(--game);font-size:30px;background:var(--a-navy);color:var(--a-paper);border-radius:14px;padding:4px 18px}
.rcard .rec{font-size:18px;color:var(--muted);min-height:1.4em}
.rcard .btns{width:100%;margin-top:4px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) 2.4em;gap:4px 10px;align-items:center;font-size:18px}
.bars .bar{height:16px;border-radius:8px;background:var(--bg);overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .9s}
.bars b{font-family:var(--game);font-weight:400;text-align:right}
.formula{font-family:var(--game);font-size:22px;background:var(--bg);border-radius:12px;padding:6px 12px;text-align:center}
.nextq{font-size:18px;color:var(--muted);word-break:keep-all}
.rh{font-family:var(--game);font-size:20px;display:flex;justify-content:space-between;gap:8px}
.rh small{font-family:var(--body);font-size:18px;color:var(--muted)}
/* 결과 그림 칸(GAME.result.art가 있을 때만): 오른쪽 카드에서 남는 높이를 쓴다 */
.rart{flex:1 1 0;min-height:56px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rart svg{width:100%;height:100%;max-height:220px;display:block}

/* 세로·휴대폰: 1단으로 쌓기 */
@media (max-width:760px),(orientation:portrait){
  body{overflow:auto}
  .app{height:auto;min-height:100dvh;grid-template-rows:auto auto;align-content:start}
  .main{grid-template-columns:1fr}
  .scene{aspect-ratio:var(--scene-ar,600/440);height:auto}
  .panel{overflow:visible}
  .hint{margin-top:0}
  .stg .nm,.stg .pips,.score small{display:none}
  .hud{gap:6px}
  .stg{font-size:19px;white-space:normal;line-height:1.1;word-break:keep-all;flex:1}
  .sp{display:none}
  .score{padding:2px 10px}
  .score b{font-size:28px;min-width:1.6em}
  .combo{font-size:18px;padding:4px 8px}
  .sp{min-width:0}
  .res{position:static;grid-template-columns:1fr}
  .main.showres>.scene,.main.showres>.panel{display:none}
  .callout{font-size:18px;padding:5px 10px}.toast{font-size:18px;padding:4px 10px 4px 6px}.toast svg{width:28px;height:28px}
  .ribbon{font-size:28px;padding:8px 18px;text-align:center}.ribbon small{font-size:19px}
  .rart{flex:none;min-height:0}.rart svg{height:auto;max-height:150px}
  .xp-row{margin-top:0}
}
@media (max-height:540px) and (orientation:landscape){
  .hud{min-height:52px;padding-top:4px}
  .ib{width:48px;height:48px}
  .cap{padding:8px 10px}.cap svg{width:52px;height:52px}
  .rc svg{height:62px}
  .panel{gap:8px}
  .prog{padding:6px 10px}
  .rcard{padding:10px 14px;gap:6px}
  .rcard .ttl{font-size:26px}
}
/* §19 도전 모드: HUD 작은 표시, 타이틀·결과의 '도전' 버튼(남색 + 작은 번개 그림), 새 기록 효과 */
.eng-chtag{display:inline-flex;align-items:center;gap:3px;font-family:var(--game);font-size:18px;line-height:1;background:var(--a-navy);color:var(--a-paper);border-radius:999px;padding:4px 10px 4px 6px;flex:none}
.eng-chi{width:20px;height:20px;flex:none;display:block}
#pbtn.eng-p2{display:flex;flex-direction:column;gap:8px}
.big.eng-ch{background:var(--a-navy);color:var(--a-paper);box-shadow:inset 0 -5px 0 rgba(0,0,0,.35)}
.big.eng-ch .eng-chi{width:24px;height:24px;color:var(--a-org)}
.big.eng-ch small{font-size:18px;opacity:.85;margin-left:4px}
.big.eng-sec{min-height:52px;font-size:22px;text-decoration:none}   /* 첫 화면 둘째 버튼(도전·연습에서 도전): 주 버튼 '시작'보다 작게 */
.rcard .btns .btn2{white-space:nowrap}
/* 결과 '도전'은 '다시 하기'와 같은 너비, 남색으로 구분(도전 결과에서는 주황 = 주 버튼) */
.eng-pair{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn2.eng-ch.pri{background:var(--accent);color:var(--accent-ink)}.btn2.eng-ch.pri .eng-chi{color:var(--accent-ink)}
.btn2.eng-ch{flex:1;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--a-navy);color:var(--a-paper)}
.btn2.eng-ch .eng-chi{color:var(--a-org)}
.btn2.eng-ch.new{animation:engChPop .5s ease-out 3}
@keyframes engChPop{45%{transform:scale(1.08);box-shadow:0 0 0 4px var(--accent)}}
.eng-chrec .eng-lad{flex:1;align-content:center}
.eng-lad{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}   /* 도전 결과 오른쪽: 레벨 사다리(깬 레벨 = 채운 칸 + 별 수, 아직 = 점선 빈칸, 이번 = 주황 테두리) */
.eng-lv{width:56px;height:80px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--game);font-size:24px;color:var(--muted)}
.eng-lv.done{border:2px solid transparent;background:var(--bg);color:var(--ink)}.eng-lv .eng-ls{display:flex;gap:0}.eng-lv .eng-star{width:16px;height:16px;animation:none}
.eng-lv.cur{border:2px solid transparent;color:var(--ink);box-shadow:0 0 0 4px var(--accent)}

.eng-chres{gap:6px}
.rcard .ttl.eng-big{font-size:34px;padding:4px 22px}
.eng-stars{display:flex;gap:6px}

.eng-star.on:nth-child(2){animation-delay:.25s}.eng-star.on:nth-child(3){animation-delay:.5s}

.eng-goal{width:100%;display:flex;align-items:center;gap:10px;font-size:18px;color:var(--muted)}
.eng-gbar{flex:1;height:16px;border-radius:8px;background:var(--bg);overflow:hidden}
.eng-gbar i{display:block;height:100%;background:var(--a-navy-l);transform-origin:left}
.eng-chres.pass .eng-gbar i{background:var(--good)}
.rcard .lab .eng-chi{display:inline-block;vertical-align:-3px;color:var(--accent)}
/* §21 도전 결과 그림 고리(GAME.challenge.resultArt): 도전 기록 사다리 아래 */
.eng-chart{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:0;overflow:hidden;font-size:18px}
.eng-chart>svg{max-width:100%;max-height:150px;display:block}
/* §21 해 보기 테두리형(GAME.tryDim:'outline'): 흐린 막 없이 집을 것·놓을 곳 테두리만 굵게 */

.ib.eng-penbtn{position:relative;z-index:33}

.eng-penbar{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:32;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:calc(100% - 16px);background:var(--surface);color:var(--ink);border-radius:16px;padding:6px;box-shadow:0 0 0 2px var(--line),0 6px 16px rgba(0,0,0,.3)}

/* 지금 도구 줄(블라인드 반영 11-04): 방에 있는 물건의 도구만 보인다(녹색 제품 도구는 가게에서만). 4단계는 모두 */
function toolsOf(G){ var S=STAGES[G.si]||STAGES[0]; if(S.world||!G.spots||!G.spots.length) return S.tools; var hide=(G.trans&&G.trans.hide)||[]; return ALL.filter(function(k){ return S.tools.indexOf(k)>=0 && hide.indexOf(k)<0 && G.spots.some(function(s){ return s.k===k; }); }); }
function cl(o){ return JSON.parse(JSON.stringify(o)); }
function rnd(G){ var s=(G.seed+0x6D2B79F5)>>>0; G.seed=s; var t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }
function firstName(G,ev,k,at){ if(!G.first[k]){ G.first[k]=1; ev.push({t:'name', k:k, at:at}); } }
/* 블라인드 4차(공통 원인 3): 놓은 직후 0.3초에는 바뀐 물건 하나만 — 개념 이름 말풍선은 0.5초 뒤(tick이 꺼냄). 단계 끝은 남은 이름을 다 띄운 뒤 */
function nameLater(G,k,at,lag){ if(G.first[k]) return; G.first[k]=1; (G.pend=G.pend||[]).push({k:k, at:at, t:G.t+(lag||T.nameLag)}); }
function pumpNames(G,ev){ if(!G.pend||!G.pend.length) return; G.pend=G.pend.filter(function(p){ if(G.t>=p.t){ ev.push({t:'name', k:p.k, at:p.at}); return false; } return true; }); }
function namesBusy(G){ return !!(G.pend&&G.pend.length); }
function award(G,ev,k){ if(G.badges.indexOf(k)<0){ G.badges.push(k); ev.push({t:'badge', k:k}); } }

function makeRoom(G,room){
  var S=STAGES[G.si];
  G.room=room; G.roomT=0; G.baton=false; G.batonT=0; G.handed=false;
  G.spots=ROOMS[room].map(function(k,i){ var d=/^u:/.test(k)?k.slice(2):null; return {i:i, k:d||k, dec:d, st:d?'dec':(S.plan?'good':'waste'), age:0, cnt:0, need:S.need, pat:0, w:0, back:0, miss:[], okAt:-99, hitAt:-99}; });   /* 3단계: 어제(1단계) 바꾼 그대로 시작 */
}
function startStage(G0,si){
  var G=cl(G0), S=STAGES[si], i;
  G.si=si; G.phase='play'; G.t=0; G.pend=[]; G.combo=0; G.lastAct=-99; G.spots=[]; G.friends=[]; G.room=null; G.baton=false; G.wrong=null; G.holder=-1; G.trans=null;
  if(S.world){
    G.friends=[]; for(i=0;i<S.cards;i++) G.friends.push({i:i, want:null, w:0, pat:0, lit:0, rid:0, done:null, doneAt:-99, who:0});
    G.queue=[]; for(i=0;i<S.n;i++) G.queue.push(ALL[Math.floor(rnd(G)*ALL.length)]);
    /* 미끼는 넷째 친구 뒤(두 방이 함께 열릴 때)에 섞는다: 5·8·11번째 자리, 종류는 시드로 */
    var DK=['lamp','cup','trash']; for(i=0;i<(S.dec||0);i++) G.queue.splice(3+i*3,0,'u:'+DK[(i+Math.floor(rnd(G)*3))%3]);
    G.spawned=0; G.cool=T.worldAt; G.holder=-1; G.ring=[];
    G.res={total:S.n, served:0, missed:0}; G.keep=0;
  } else {
    G.rooms=S.rooms.slice(1);
    makeRoom(G,S.rooms[0]);
    if(S.plan){ G.day=0; G.dq=S.plan[0].slice(); G.dT=0; G.nextAt=S.gapA; G.relAt=-99; G.night=0; G.days=[]; G.dayMiss=0;
      G.res={total:S.plan.reduce(function(a,d){ return a+d.filter(function(x){ return typeof x==='number'; }).length; },0), served:0, missed:0}; }
    else G.res={total:S.rooms.reduce(function(a,r){ return a+ROOMS[r].filter(function(k){ return !/^u:/.test(k); }).length*S.need; },0)+(S.baton?S.rooms.length:0), served:0, missed:0};
    G.doneRooms=[];
  }
  return G;
}
function newGame(seed){
  var G={seed:(seed||SEED)>>>0, si:0, phase:'title', t:0, score:0, combo:0, lastAct:-99, first:{}, badges:[], relay:0,
    stats:{swap:0, relay:0, again:0, miss:0, minus:0, plus:0, decoy:0, keep:0}, spots:[], friends:[], rooms:[], room:null, baton:false, res:{total:0, served:0, missed:0}};
  makeRoom(G,'home'); return G;
}
function start(G){ var g=cl(G); g.score=0; g.relay=0; g.stats={swap:0, relay:0, again:0, miss:0, minus:0, plus:0, decoy:0, keep:0}; g.badges=[]; g.first={}; return startStage(g,0); }

function comboUp(G){ G.combo=(G.t-G.lastAct<=T.comboWin)?G.combo+1:1; G.lastAct=G.t; return T.noBonus ? 0 : Math.min(G.combo-1,T.comboCap)*T.comboStep; }   /* 3차: 콤보 덤 없음(점수는 판단으로만) */
function roomClean(G){ return G.spots.length && G.spots.every(function(s){ return s.dec || (s.cnt>=s.need && s.st==='good'); }); }
/* 방을 다 바꿨을 때: 미끼를 건드리지 않았으면 그 미끼 자리에 +10(그대로 둔 것도 실천) */
function roomKeep(G,ev){ G.spots.forEach(function(s){ if(s.dec && s.hitAt<=-99 && !s.kept){ s.kept=1; G.stats.keep++; G.score+=T.keepPts; ev.push({t:'keepPts', at:'waste:'+s.i, pts:T.keepPts}); } }); }
function roomTrans(G,ev){ roomKeep(G,ev); G.doneRooms=(G.doneRooms||[]).concat([{room:G.room, n:G.spots.filter(function(s){ return !s.dec && !s.miss[s.miss.length-1]; }).length, bad:G.spots.filter(function(s){ return s.dec && s.hitAt>-99; }).length}]);
  G.trans={t:0, next:G.rooms.shift(), made:0, hide:[]}; ev.push({t:'roomOut'}); }
function endStage(G,ev){ G.phase='stageEnd'; ev.push({t:'stageEnd', si:G.si}); }

function tick(G0,dt){
  var G=cl(G0), ev=[], S=STAGES[G.si]; if(G.phase!=='play') return {G:G, ev:ev};
  G.t+=dt; pumpNames(G,ev);
  if(S.world){
    G.friends.forEach(function(f){
      if(!f.want) return; f.w+=dt;
      if(f.w>=f.pat){
        if(f.dec){ ev.push({t:'keep', at:'friend:'+f.i}); f.done=f.dec; f.doneAt=G.t; f.keep=1; f.want=null; f.dec=null; f.w=0; if(!f.hit){ G.stats.keep++; G.keep++; G.score+=T.keepPts; ev.push({t:'keepPts', at:'friend:'+f.i, pts:T.keepPts}); } f.hit=0; G.cool=Math.max(G.cool,T.gap); return; }   /* 미끼를 그대로 두면 초록(잘 둠) */
        ev.push({t:'miss', at:'friend:'+f.i, kind:f.want}); f.want=null; f.w=0; G.res.missed++; G.stats.miss++; G.combo=0; G.cool=Math.max(G.cool,T.gap); }
    });
    var late=G.spawned>=S.split, maxAt=S.maxAt[late?1:0], busy=G.friends.filter(function(f){ return f.want; }).length;
    G.cool-=dt;
    if(G.queue.length && busy<maxAt && G.cool<=0){
      var free=G.friends.filter(function(f){ return !f.want && f.i!==G.lastFriend; });
      if(!free.length) free=G.friends.filter(function(f){ return !f.want; });
      if(free.length){ var f=free[Math.floor(rnd(G)*free.length)], q=G.queue.shift(), qd=/^u:/.test(q)?q.slice(2):null; f.want=qd||q; f.dec=qd; f.hit=0; f.keep=0; f.tries=0; f.w=0; f.pat=qd?S.decPat:S.pat[late?1:0]; f.rid++; f.who=G.spawned; f.done=null; G.spawned++; G.lastFriend=f.i; G.cool=T.gap; ev.push({t:'ask', at:'friend:'+f.i}); }
    }
    if(!G.queue.length && !G.friends.some(function(f){ return f.want; }) && !namesBusy(G)){
      firstName(G,ev,'world','globe'); award(G,ev,'citizen'); endStage(G,ev);
    }
    return {G:G, ev:ev};
  }
  if(S.plan) return tickDays(G,ev,dt,S);
  /* 블라인드 3차: 바통을 넘긴 뒤 ① 친구가 바통을 든 채(0~tr1) ② 친구네 방으로 바뀜(tr1) ③ 새 도구가 이름표와 함께 나옴(tr2). 그동안은 놓을 수 없다 */
  if(G.trans){ var TR=G.trans; TR.t+=dt;
    if(!TR.made && TR.t>=T.tr1){ var before=toolsOf(G); makeRoom(G,TR.next); TR.made=1; TR.hide=[]; G.trans=TR;
      TR.hide=toolsOf(G).filter(function(k){ return before.indexOf(k)<0; }); ev.push({t:'room'}); }
    if(TR.t>=T.tr2){ G.trans=null; if(S.baton) G.nameDue=1.2; ev.push({t:'newTool'}); if(G.spots.some(function(x){ return x.dec; })){ var di=G.spots.filter(function(x){ return x.dec; })[0]; firstName(G,ev,'use'+di.dec,'waste:'+di.i); } }
    return {G:G, ev:ev}; }
  if(G.nameDue>0){ G.nameDue-=dt; if(G.nameDue<=0){ G.nameDue=0; firstName(G,ev,'baton','friend:door'); } }
  G.roomT+=dt;
  G.spots.forEach(function(s){
    if(s.dec) return;   /* 3차: 미끼는 다시 나오지 않는다 */
    if(s.st==='waste'){
      s.age+=dt;
      if(s.pat>0){ s.w+=dt; if(s.w>=s.pat){ /* 기다림 막대가 다 줄면: 이번 실천은 놓침(회색), 다음 날 다시 나온다 */
        s.st='good'; s.miss.push(1); s.cnt++; G.res.missed++; G.stats.miss++; G.combo=0; ev.push({t:'miss', at:'waste:'+s.i});
        if(s.cnt<s.need) s.back=S.back[Math.min(s.cnt-1,S.back.length-1)]+s.i*S.stag; } }
    } else if(s.cnt<s.need){
      s.back-=dt;
      if(s.back<=0){ s.st='waste'; s.age=0; s.w=0; s.pat=S.pat; ev.push({t:'back', at:'waste:'+s.i}); firstName(G,ev,'again','waste:'+s.i); }
    }
  });
  if(roomClean(G)){
    if(!S.baton){ if(G.rooms.length){ if(!namesBusy(G)) roomTrans(G,ev); } else if(!namesBusy(G)){ roomKeep(G,ev); endStage(G,ev); } }   /* 3차: 1단계 둘째 방(미끼가 있는 내 방) */
    else if(!G.baton){ G.baton=true; G.batonT=0; ev.push({t:'batonUp'}); }
    else G.batonT+=dt;
  }
  return {G:G, ev:ev};
}

/* 3단계 '매일매일': 하루 = plan[day]의 물건 두 개가 하나씩 다시 나옴 → 둘 다 끝나면 밤(night초) → 다음 날. 사흘째가 끝나면 단계 끝 */
function tickDays(G,ev,dt,S){
  if(G.night>0){ G.night-=dt; if(G.night<=0){ G.night=0; G.day++; G.dq=S.plan[G.day].slice(); G.dT=0; G.nextAt=S.gapA; G.relAt=-99; ev.push({t:'day', day:G.day}); } return {G:G, ev:ev}; }
  G.dT+=dt;
  G.spots.forEach(function(s){ if(s.st!=='waste') return; s.age+=dt; s.w+=dt;
    if(s.w>=s.pat){ s.st='good'; s.miss.push(1); s.cnt++; s.pat=0; G.res.missed++; G.stats.miss++; G.dayMiss++; G.combo=0; ev.push({t:'miss', at:'waste:'+s.i}); restAfter(G,S); } });
  G.spots.forEach(function(s){ if(s.st==='dec' && s.pat>0) s.w=Math.min(s.pat*0.98, s.w+dt); });
  var act=G.spots.filter(function(s){ return s.st==='waste'; }).length, rel=false;
  /* 3차: 'uN' = 그날 N번 자리 전등 옆에 가족이 앉아 책을 읽음(쓰는 중 = 미끼). 미끼는 다음 물건과 함께 나오고, 그날 바꿀 것이 끝나면 가족이 일어나 사라짐 */
  while(G.dq.length && typeof G.dq[0]==='string' && G.dq[0][0]==='u'){ var ds=G.spots[+G.dq.shift().slice(1)]; ds.st='dec'; ds.dec=ds.k; ds.age=0; ds.w=0; ds.pat=S.pat; ds.hitAt=-99; ev.push({t:'back', at:'waste:'+ds.i}); }
  if(G.dq.length && ((act===0 && G.dT>=G.nextAt) || (act===1 && G.dT-G.relAt>=S.second))){
    var s=G.spots[G.dq.shift()]; s.st='waste'; s.age=0; s.w=0; s.pat=S.pat; G.relAt=G.dT; rel=true;
    ev.push({t:'back', at:'waste:'+s.i}); }
  if(!rel && !act && !G.dq.length) G.spots.forEach(function(s){ if(s.st==='dec'){ if(s.hitAt<=-99){ G.stats.keep++; G.score+=T.keepPts; ev.push({t:'keepPts', at:'waste:'+s.i, pts:T.keepPts}); } s.st='good'; s.dec=null; s.pat=0; ev.push({t:'keep', at:'waste:'+s.i}); } });   /* 이름 '한 번으로 끝내지 않아요'는 다시 바꾼 뒤(drop) — 해 보기 때 글이 둘 겹치지 않게 */
  if(!rel && !act && !G.dq.length && !(G.day>=S.plan.length-1 && namesBusy(G))){
    G.days.push(G.dayMiss?0:1); G.dayMiss=0;
    if(G.day>=S.plan.length-1) endStage(G,ev); else { G.night=S.night+S.dusk; ev.push({t:'night'}); } }   /* dusk: 마지막 바꾼 결과(± 표시)를 먼저 보이고 어두워짐 */
  return {G:G, ev:ev};
}
function restAfter(G,S){ if(!G.spots.some(function(s){ return s.st==='waste'; })) G.nextAt=G.dT+S.gapA; }

/* src: 'tool:종류' | 'baton'   dst: 'waste:번호' | 'friend:door' | 'friend:0~3' */
function drop(G0,src,dst,via){
  /* 틀린 놓기(블라인드 반영 11-04): 점수 그대로, 콤보만 끊고, 놓은 자리를 기억한다(G.wrong → 장면이 그 자리에 0.3초 안에 '다시!'를 그림, hintMove가 그 자리를 먼저 가리켜 힌트·'왜?'가 같은 물건을 말함) */
  var fail=function(why){ var g=G0; if(G0 && /^w/.test(why)){ g=cl(G0); g.combo=0; g.wrong={at:dst, t:g.t, n:(G0.wrong?G0.wrong.n:0)+1, src:src};
      /* 3차(빠르기 덤을 빼며): 틀린 도구를 한 번 놓은 물건은 바꿔도 반만(처음에 맞게 = 10, 틀린 뒤 = 5) — 대가는 생각에서 */
      var dq=String(dst).split(':'); if(dq[0]==='waste' && g.spots && g.spots[+dq[1]]) g.spots[+dq[1]].tries=(g.spots[+dq[1]].tries||0)+1;
      if(dq[0]==='friend' && dq[1]!=='door' && g.friends && g.friends[+dq[1]]) g.friends[+dq[1]].tries=(g.friends[+dq[1]].tries||0)+1; }
    return {G:g, ok:false, why:why, ev:[{t:'bounce', why:why, src:src, dst:dst}]}; };
  if(!G0 || G0.phase!=='play') return fail('phase');
  if(G0.trans) return fail('trans');
  var S=STAGES[G0.si], sp=String(src).split(':'), dp=String(dst).split(':'), G, ev=[], pts, bonus;
  if(src==='baton'){
    if(!G0.baton) return fail('src');
    if(dst!=='friend:door') return fail('w_baton');
    G=cl(G0);
    pts = via ? T.hintPts : T.batonBase+(T.noBonus?0:Math.round(T.batonFast*Math.max(0,1-G.batonT/T.batonWin)))+comboUp(G);

/* 언제 시범을 보일지. 기본: 단계 시작에 hintMove를 한 번(2회 반복), 그 뒤는 10초 동안 아무것도 못 하면 한 번.

     {repeat:true}            멈출 때마다(1.2초) 시범 반복(첫 단계 튜토리얼)
     {point:id, text, at}     손가락이 id를 가리키고 말풍선 text(at 위치). point가 null이면 아직 기다림
     {move:{src,dst}}         시작 시범을 이 수로. move가 null이면 아직 기다림 */
function maybeDemo(now){
  if(ENG_CHON||ENG_PENON) return;   /* §21 판서 중에도 없음. §19 도전: 저절로 뜨는 손가락 시범 없음(답을 보여 주지 않음). 힌트 버튼은 그대로 */
  if(U.mode!=='play'||U.demo||U.drag||U.sel||U.busy||U.hint||tryHold()) return;   /* '해 보기' 중에는 시범 없음(§12) */   /* 힌트가 켜져 있으면 시범 없음(힌트가 보여 주는 수와 다른 곳을 가리키지 않게) */
  if(now-U.okAt<2000) return;   /* 바르게 놓은 직후 2초는 시범 없음(맞혔는데 틀린 줄 알게 됨, §11) */
  if(now-U.downAt<2500) return;   /* r4: 장면을 누른 직후 2.5초도 시범 없음(3차 블라인드: 버튼을 누르자 손가락이 '저절로' 나옴) */

  var mv=hintMove(G);

  var noF=GAME.tryIt!==false && !U.keepDemo[G.si];
  if(p.repeat && !noF){ if(now-U.lastAct>1200 && now>U.demoAt) demoMove(mv,2); return; }

    if('move' in p){ if(!p.move) return; mv=p.move; }

    go(); },

};

/* ---------- '왜?' 버튼 (GAME.explain이 있을 때만. 인지부하: 부가 설명은 학생이 골라서 연다) ----------
   보여 줄 설명 = 게임이 넘긴 것(이벤트 {t:'explain'} / FX.explain / 틀린 놓기의 reasons[why]) → 없으면 GAME.explain.of(G).

function xpHtml(x){
  if(!x) return ''; if(typeof x==='string') return x;
  return (x.why?'<span>'+x.why+'</span>':'')+(x.def?'<span class="d">'+x.def+'</span>':'')+(x.page?'<small>'+x.page+'</small>':'');
}
function xpSet(x){ if(!XPC) return; U.xpCur=(x==null||x==='')?null:x; xpSync(); }
function xpSync(){

  var h = U.mode==='play' ? xpHtml(U.xpCur) : '';
  if(!h && U.mode==='play' && XPC.of) h = xpHtml(XPC.of(G));

sceneEl.addEventListener('pointerdown',function(e){

  if(U.mode==='play'){ U.downAt=U.lastAct=performance.now(); }   /* r4: 누른 직후에는 손가락이 저절로 나오지 않는다(maybeDemo) */
  if(U.mode!=='play'||U.paused||U.busy) return;
  if(U.tr){ if(tryDown(e)) return; }   /* §12 '해 보기': 기다리는 동안만 받는다 */
  stopDemo();
  var src=pick(sources(G),e.clientX,e.clientY,10);
  if(U.sel){ /* 탭→탭: 두 번째 탭이 놓을 곳이면 놓는다 */
    var tg=pick(targets(G),e.clientX,e.clientY,14), s=U.sel; U.sel=null;
    if(tg && !(src===s.id)){ U.dropPt={x:e.clientX, y:e.clientY}; commit(s.id,tg,false,s.gh); e.preventDefault(); return; }
    var back=SCENE.rectOf(G,s.id); if(back) flyGhost(s.gh,back,200); else s.gh.remove();
    if(src===s.id) return;
    if(!src && !U.tr) engNope({x:e.clientX, y:e.clientY}, 'none', s.id);   /* r3: 탭→탭에서 대상 밖을 누름 → '다시!'(조용히 튕기지 않음) */
  }
  if(!src) return;
  e.preventDefault(); try{ sceneEl.setPointerCapture(e.pointerId); }catch(_){}
  U.drag={id:src, x0:e.clientX, y0:e.clientY, moved:false, gh:ghost(itemOf(G,src),e.clientX,e.clientY), hov:null};
});
sceneEl.addEventListener('pointermove',function(e){
  var d=U.drag; if(!d) return;
  if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)>8) d.moved=true;
  moveGhost(d.gh,e.clientX,e.clientY);
  var tg=d.moved?pick(targets(G),e.clientX,e.clientY,14):null;
  if(tg!==d.hov){ clearRings('.ring.hover'); d.hov=tg; if(tg) ring(tg,'hover'); }
});
function endDrag(e,cancel){
  var d=U.drag; if(!d) return; U.drag=null; clearRings('.ring.hover');
  if(U.paused||U.mode!=='play') cancel=true; /* 끄는 도중 모달이 열렸으면 놓지 않는다 */
  if(cancel){ var b=SCENE.rectOf(G,d.id); if(b) flyGhost(d.gh,b,200); else d.gh.remove(); return; }
  if(!d.moved){ d.gh.classList.add('sel'); U.sel={id:d.id, gh:d.gh}; return; }
  var tg=pick(targets(G),e.clientX,e.clientY,14);
  U.dropPt={x:e.clientX, y:e.clientY}; commit(d.id,tg||'none',false,d.gh);
}
sceneEl.addEventListener('pointerup',function(e){ endDrag(e,false); });
sceneEl.addEventListener('pointercancel',function(e){ endDrag(e,true); });

/* ---------- 결과: 큰 점수, 칭호, 기록 막대('처음엔 모두 0'), 공식 한 줄, 배지 선반, 다음 시간 질문 ---------- */
/* 결과 그림 칸(선택): GAME.result.art(G) → {vb:[x,y,w,h], svg:'SVG 조각'} 또는 '<svg …>' 문자열. 막대와 공식 사이, 남는 높이만큼 */
function resultArt(R){
  if(typeof R.art!=='function') return ''; var a=R.art(G); if(!a) return '';
  if(typeof a==='string') return '<div class="rart" aria-hidden="true">'+a+'</div>';
  return '<div class="rart" aria-hidden="true"><svg viewBox="'+(a.vb||[0,0,400,120]).join(' ')+'" preserveAspectRatio="xMidYMid meet">'+a.svg+'</svg></div>';
}
/* §21 도전 결과 그림 고리(2026-11-08): GAME.challenge.resultArt(G) → HTML/SVG 글(놓친 단서 칩 등) 또는 {vb, svg}. 도전 기록 사다리 아래에 넣는다. 없거나 오류면 칸 없음 */
function engChResultArt(){
  if(!CHC || typeof CHC.resultArt!=='function') return ''; var a=null;
  try{ a=CHC.resultArt(G); }catch(e){ return ''; } if(!a) return '';
  if(typeof a==='string') return '<div class="eng-chart">'+a+'</div>';
  if(a.svg!=null) return '<div class="eng-chart"><svg viewBox="'+(a.vb||[0,0,400,120]).join(' ')+'" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'+a.svg+'</svg></div>';
  return '';
}

    left='<div class="rcard l"><div class="lab">최종 점수</div><div class="num" id="rnum">0</div><div class="ttl">'+GAME.titleOf(sc)+'</div><div class="rec">'+(rec?'신기록! 전 기록 '+prev:(prev>0&&prev!==sc?'이 화면 최고 '+BEST:''))+'</div>'
      +'<div class="btns"><button class="btn2 pri" id="again">다시 하기</button>'+(CHC?'<button class="btn2 eng-ch'+(fresh?' new':'')+'" id="engCh">'+engChIcon()+'도전 '+ENG_CHM.lv+'</button>':engPairBtn())+'</div></div>';   /* 결과 버튼은 [다시 하기 | 도전] 둘만. 처음으로는 HUD ⟲ */

/* ---------- §21 판서(교사용, 2026-11-08) ----------
   주소에 ?teach=1(또는 해시 안 teach)이 있을 때만 HUD에 펜 버튼이 생긴다. 학생 화면(파라미터 없음)은 DOM·동작이 전과 같다.
   켜면 화면 전체를 덮는 투명 판서 층(canvas, devicePixelRatio)이 입력을 받고 게임 시간(tick·해 보기·시범)을 멈춘다(ENG_PENON). 끄면 다시 흐른다.
   도구: 펜 빨강·파랑·노랑, 형광펜(반투명 굵게), 지우개(획 단위), 모두 지움, 닫기. 판서는 단계가 바뀌어도 남고 '모두 지움'으로만 지운다.
   획은 화면 비율 좌표(0~1)로 두고 창 크기가 바뀌면 다시 그린다. 키보드: P 켜기/끄기, Esc 끄기 */
var ENG_TEACH=(function(){ try{ return /[?&]teach=1(&|$)/.test(location.search||'') || /teach/i.test(location.hash||''); }catch(e){ return false; } })();
var ENG_PENON=false, ENG_PEN=null;
var ENG_PCOL={red:'#E5484D', blue:'#2F7BFF', yellow:'#FFC83D'};
function engPenIco(k,col){
  if(k==='pen') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.4-4.6L15.8 5a2.1 2.1 0 0 1 3 0l.2.2a2.1 2.1 0 0 1 0 3L8.6 18.6z" fill="'+col+'" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  if(k==='hl') return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="15" width="18" height="6" rx="2" fill="'+col+'" opacity=".45"/><path d="M8 13l7-9 4 3-7 9H8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  if(k==='er') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20h11M4.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 18H7z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><path d="M8.5 11.5l5 5" stroke="currentColor" stroke-width="1.9"/></svg>';
  if(k==='clr') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  if(k==='x') return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
  return '';
}
function engPenInit(){
  if(!ENG_TEACH) return;
  var bb=$('#bBadges'), b=document.createElement('button'); b.className='ib lb eng-penbtn'; b.id='engPenBtn'; b.setAttribute('aria-label','판서 펜'); b.setAttribute('aria-pressed','false');
  b.innerHTML=engPenIco('pen','var(--accent)')+'<span>펜</span>'; bb.parentNode.insertBefore(b, bb.nextSibling);
  var cv=document.createElement('canvas'); cv.className='eng-ink'; cv.id='engInk'; cv.setAttribute('aria-hidden','true'); document.body.appendChild(cv);
  var bar=document.createElement('div'); bar.className='eng-penbar hide'; bar.id='engPenBar'; bar.setAttribute('role','toolbar'); bar.setAttribute('aria-label','판서 도구');
  var T=[['red','pen','빨강'],['blue','pen','파랑'],['yellow','pen','노랑'],['hl','hl','형광'],['er','er','지우개'],['clr','clr','모두 지움'],['x','x','닫기']];
  bar.innerHTML=T.map(function(t){ return '<button class="eng-pt" data-pt="'+t[0]+'"'+(t[0]==='clr'||t[0]==='x'?'':' aria-pressed="false"')+'>'+engPenIco(t[1], ENG_PCOL[t[0]]||'var(--accent)')+'<span>'+t[2]+'</span></button>'; }).join('');
  document.body.appendChild(bar);
  ENG_PEN={cv:cv, cx:cv.getContext('2d'), bar:bar, btn:b, tool:'red', col:'red', S:[], cur:null, pid:null, dirty:true, W:0, H:0};
  b.onclick=function(){ engPenSet(!ENG_PENON); };
  bar.addEventListener('click',function(e){ var t=e.target.closest('[data-pt]'); if(!t) return; var k=t.dataset.pt;
    if(k==='x'){ engPenSet(false); return; } if(k==='clr'){ ENG_PEN.S=[]; ENG_PEN.cur=null; ENG_PEN.dirty=true; return; } engPenTool(k); });
  cv.addEventListener('pointerdown',engPenDown); cv.addEventListener('pointermove',engPenMove);
  cv.addEventListener('pointerup',engPenUp); cv.addEventListener('pointercancel',engPenUp);
  document.addEventListener('keydown',function(e){ if(e.ctrlKey||e.metaKey||e.altKey) return; var k=e.key;
    if(k==='p'||k==='P'||k==='ㅔ'){ e.preventDefault(); engPenSet(!ENG_PENON); } else if(k==='Escape' && ENG_PENON){ e.preventDefault(); engPenSet(false); } });
  engPenTool('red'); engPenFit();
}
function engPenTool(k){ var P=ENG_PEN; P.tool=k; if(ENG_PCOL[k]) P.col=k;
  P.bar.querySelectorAll('[data-pt]').forEach(function(x){ if(x.hasAttribute('aria-pressed')) x.setAttribute('aria-pressed', String(x.dataset.pt===k)); });
  var h=P.bar.querySelector('[data-pt="hl"] rect'); if(h) h.setAttribute('fill', ENG_PCOL[P.col]); }   /* 형광펜은 마지막으로 고른 펜 색 */
function engPenSet(on){
  var P=ENG_PEN; if(!P) return; on=!!on; if(on===ENG_PENON) return; ENG_PENON=on;
  P.cv.classList.toggle('on',on); P.bar.classList.toggle('hide',!on); P.btn.setAttribute('aria-pressed',String(on));
  if(on){ if(P.tool==='er') engPenTool(P.col); if(U){ if(U.drag) endDrag({clientX:0,clientY:0},true); if(U.sel){ var s=U.sel; U.sel=null; var bk=SCENE.rectOf(G,s.id); if(bk) flyGhost(s.gh,bk,200); else s.gh.remove(); } stopDemo(); } if(XPC) xpClose(); }
  else { P.cur=null; P.pid=null; LAST=performance.now(); if(U){ U.lastAct=U.downAt=performance.now(); } }   /* 끄면 시간이 다시 흐른다(멈춘 동안의 시간은 넘기지 않음), 끄자마자 시범이 뜨지 않게 */
}
function engPenFit(){
  var P=ENG_PEN; if(!P) return; var dpr=window.devicePixelRatio||1, W=P.cv.clientWidth||innerWidth, H=P.cv.clientHeight||innerHeight;
  if(W===P.W && H===P.H && P.dpr===dpr) return; P.W=W; P.H=H; P.dpr=dpr;
  P.cv.width=Math.round(W*dpr); P.cv.height=Math.round(H*dpr); P.dirty=true;
}
function engPenPt(e){ var P=ENG_PEN, r=P.cv.getBoundingClientRect(), pr=(e.pointerType==='pen' && e.pressure>0) ? 0.45+1.1*e.pressure : 1; return [(e.clientX-r.left)/(r.width||1), (e.clientY-r.top)/(r.height||1), pr]; }
function engPenDown(e){
  var P=ENG_PEN; if(!ENG_PENON || P.pid!=null) return; e.preventDefault(); try{ P.cv.setPointerCapture(e.pointerId); }catch(_){}
  P.pid=e.pointerId; var p=engPenPt(e);
  if(P.tool==='er'){ P.cur={er:true}; engPenErase(p); return; }
  P.cur={hl:P.tool==='hl', col:ENG_PCOL[P.col], pts:[p]}; P.S.push(P.cur); P.dirty=true;
}
function engPenMove(e){
  var P=ENG_PEN; if(!P.cur || e.pointerId!==P.pid) return; e.preventDefault();
  var L=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  L.forEach(function(ev){ var p=engPenPt(ev); if(P.cur.er) engPenErase(p); else P.cur.pts.push(p); }); P.dirty=true;
}
function engPenUp(e){ var P=ENG_PEN; if(e.pointerId!==P.pid) return; P.pid=null; P.cur=null; P.dirty=true; }
/* 지우개: 누른 자리에서 18px 안을 지나는 획을 통째로 지운다 */
function engPenErase(p){
  var P=ENG_PEN, W=P.W, H=P.H, x=p[0]*W, y=p[1]*H, R=18, n0=P.S.length;
  P.S=P.S.filter(function(s){ var a=s.pts, wr=engPenW(s,1)/2; for(var i=0;i<a.length;i++){ var b=a[Math.max(0,i-1)], ax=a[i][0]*W, ay=a[i][1]*H, bx=b[0]*W, by=b[1]*H, dx=ax-bx, dy=ay-by, L2=dx*dx+dy*dy, t=L2?Math.max(0,Math.min(1,((x-bx)*dx+(y-by)*dy)/L2)):0;
    if(Math.hypot(bx+t*dx-x, by+t*dy-y)<=R+wr) return false; } return true; });
  if(P.S.length!==n0) P.dirty=true;
}
function engPenW(s,pr){ var P=ENG_PEN, k=Math.max(0.6, Math.min(P.W,P.H)/480); return (s.hl?22:5)*k*(s.hl?1:pr); }   /* 굵기도 화면 크기에 비례(1000×480에서 펜 5px, 형광 22px) */
function engPenDraw(){
  var P=ENG_PEN; engPenFit(); if(!P.dirty) return; P.dirty=false;
  var c=P.cx, W=P.W, H=P.H; c.setTransform(P.dpr,0,0,P.dpr,0,0); c.clearRect(0,0,W,H); c.lineCap='round'; c.lineJoin='round';
  P.S.forEach(function(s){ var a=s.pts; if(!a.length) return;
    if(s.hl){ c.globalAlpha=0.38; c.strokeStyle=s.col; c.lineWidth=engPenW(s,1); c.beginPath(); c.moveTo(a[0][0]*W,a[0][1]*H); for(var i=1;i<a.length;i++) c.lineTo(a[i][0]*W,a[i][1]*H); if(a.length===1) c.lineTo(a[0][0]*W+0.1,a[0][1]*H); c.stroke(); c.globalAlpha=1; return; }
    /* 펜: 어두운 테두리 한 번 + 색 한 번(밝은 바다·어두운 판 모두에서 보이게). 펜 압력이 있으면 마디마다 굵기 */
    [0,1].forEach(function(pass){ c.strokeStyle=pass?s.col:'rgba(20,30,42,.55)';
      for(var i=0;i<a.length;i++){ var b=a[Math.max(0,i-1)], w=engPenW(s,(a[i][2]+b[2])/2)+(pass?0:3); c.lineWidth=w; c.beginPath(); c.moveTo(b[0]*W,b[1]*H); c.lineTo(a[i][0]*W+(i?0:0.1),a[i][1]*H); c.stroke(); } }); });
}

/* ---------- 버튼 ---------- */
$('#bReset').innerHTML=iconSvg('icReset'); $('#bRules').innerHTML=iconSvg('icRules')+'<span>규칙</span>'; $('#bBadges').innerHTML=iconSvg('icMedal')+'<span>배지</span>';
$('#bRules').classList.add('lb'); $('#bBadges').classList.add('lb');
$('#bReset').onclick=confirmReset; $('#bRules').onclick=rulesModal; $('#bBadges').onclick=function(){ badgeModal(null); };
$('#bHint').onclick=doHint;
if(XPC) $('#xpBtn').onclick=xpToggle;

/* ---------- 한 개의 rAF 루프: tick → renderScene → 오버레이 맞춤. 화면이 안 보이면 멈춘다 ---------- */
var LAST=performance.now(), RAF=0;
function frame(now){
  var dt=Math.min(0.1,(now-LAST)/1000); LAST=now;
  var frz = U.mode==='play' && tryFrame(now,dt);   /* '해 보기' 동안 게임 시간은 멈춘다 */
  if(U.mode==='play' && !U.paused && !ENG_PENON && !frz){ if(ENG_CHON) engChMark(G); var r=tick(G, ENG_CHON?Math.min(0.1,dt)*ENG_CHSPD:dt); G=r.G; engScoreSeen();   /* §19 도전: 시간 배속(LOGIC에 넘기는 dt만 키움) */
    if(r.ev.length) handle(r.ev); }
  SCENE.renderScene(G); if(U.mode==='title') engTitleSync(now);   /* §21 제목 카드 자리 */
  syncRings(); if(U.mode==='play'){ unblockOverlays(now); hintCheck(now); hintFingerStep(now); hintArrowSync(); }
  if(U.shown!==G.score && !engHeld(now)){ U.shown += Math.ceil((G.score-U.shown)/4); if(U.shown>G.score) U.shown=G.score; $('#score').textContent=U.shown; }
  if(U.comboT && now-U.comboT>GAME.comboWin*1000){ U.comboT=0; $('#combo').classList.remove('on'); }
  maybeDemo(now); progTag(now); engTxtPump(now);
  if(XPC) xpSync();
  if(ENG_PEN && ENG_PEN.dirty) engPenDraw();   /* §21 판서 다시 그리기(획이 바뀌었거나 창 크기가 바뀜) */
  RAF=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',function(){ if(document.hidden){ cancelAnimationFrame(RAF); RAF=0; } else if(!RAF){ LAST=performance.now(); RAF=requestAnimationFrame(frame); } });
window.addEventListener('resize',function(){ if(ENG_PEN) engPenFit(); clearRings('.ring:not(.bad)'); if(U.hint&&U.hintMv) hintShow(U.hintMv,U.hint,false); if(U.tr&&U.tr.phase==='wait') trySpot(U.tr,false); });

engChLoad();
engPenInit();   /* §21: ?teach=1일 때만 펜 버튼·판서 층 */
reset();
RAF=requestAnimationFrame(frame);
</script>
