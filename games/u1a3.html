<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>강 따라 마을 – 6-2 사회 undefined 수업용 게임</title>
<meta name="description" content="6-2 사회 undefined 「세계의 유명한 하천 지형과 생활 모습을 알아볼까요」 수업용 게임. 비가 실어 온 흙이 평야를 만들어요. 평야·계곡·폭포·넓은 강에 맞는 쓰임을 골라 강 마을을 꾸려요.">
<meta name="eng-pair" content="u1b3.html">
<link rel="canonical" href="https://wlfmghzm-dotcom.github.io/sahoe-game/games/u1a3.html">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>강 따라 마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 수업용 개념 체험 게임 엔진 (무역항 v3-2d-k에서 떼어 냄). 태블릿 가로 기준: HUD 한 줄 → [장면 63% | 패널 37%], 한 화면, 세로 스크롤 없음.
   그림은 전부 ASSETS(id → SVG 문자열/이미지 URI)에서 온다. 장면 = SCENE.renderScene(G) 한 곳, 패널·HUD = 장면과 독립된 HTML.
   게임마다 바꾸는 곳은 아래 스크립트 안의 표시된 구역 셋뿐이다: ① GAME  ② LOGIC  ③ SCENE + ASSETS. build.js가 채운다. */
:root{
  --bg:#EDF2EF; --surface:#FBF8F1; --ink:#1E2B3A; --muted:#55657A; --line:#DCD4C2;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#FBF8F1; --good:#4CAF7A; --bad:#D9534F; --veil:rgba(20,30,42,.62);
  --a-sea:#2E6F8E; --a-sea-d:#245A74; --a-shal:#4FA3B8; --a-shal-d:#3F8798; --a-sand:#EBD9B4; --a-sand-d:#D6C196;
  --a-land:#8DB48E; --a-land-d:#779D78; --a-wood:#A8754F; --a-wood-d:#8C603F; --a-navy:#1E2B3A; --a-navy-l:#33475C;
  --a-org:#E8743B; --a-org-d:#C95F2C; --a-grn:#4CAF7A; --a-grn-d:#3C9064; --a-red:#D9534F; --a-red-d:#B94340;
  --a-paper:#FBF8F1; --a-paper-d:#E6E0D2;
  --game:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A23; --surface:#1C2835; --ink:#F1ECE0; --muted:#A9B4C1; --line:#2F3E50;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#1E2B3A; --good:#4CAF7A; --bad:#D9534F; --veil:rgba(0,0,0,.7);
  --a-sea:#245A74; --a-sea-d:#1D4B61; --a-shal:#3F8798; --a-shal-d:#357484; --a-land:#779D78; --a-land-d:#668A67;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A23; --surface:#1C2835; --ink:#F1ECE0; --muted:#A9B4C1; --line:#2F3E50;
  --accent:#E8743B; --accent-d:#C95F2C; --accent-ink:#1E2B3A; --good:#4CAF7A; --bad:#D9534F; --veil:rgba(0,0,0,.7);
  --a-sea:#245A74; --a-sea-d:#1D4B61; --a-shal:#3F8798; --a-shal-d:#357484; --a-land:#779D78; --a-land-d:#668A67;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.4;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:var(--game);color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--a-shal);outline-offset:2px}
.ico{width:26px;height:26px;display:block}

/* 아트 색 클래스 (ASSETS 안 SVG가 씀) */
.f-sea{fill:var(--a-sea)}.f-sead{fill:var(--a-sea-d)}.f-shal{fill:var(--a-shal)}.f-shald{fill:var(--a-shal-d)}
.f-sand{fill:var(--a-sand)}.f-sandd{fill:var(--a-sand-d)}.f-land{fill:var(--a-land)}.f-landd{fill:var(--a-land-d)}
.f-wood{fill:var(--a-wood)}.f-woodd{fill:var(--a-wood-d)}.f-navy{fill:var(--a-navy)}.f-navyl{fill:var(--a-navy-l)}
.f-org{fill:var(--a-org)}.f-orgd{fill:var(--a-org-d)}.f-grn{fill:var(--a-grn)}.f-grnd{fill:var(--a-grn-d)}
.f-red{fill:var(--a-red)}.f-paper{fill:var(--a-paper)}.f-paperd{fill:var(--a-paper-d)}
.s-line{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding-bottom:10px}

/* HUD */
.hud{display:flex;align-items:center;gap:8px;padding-top:6px;min-height:58px}
.ib{width:50px;height:50px;border-radius:14px;background:var(--surface);display:grid;place-items:center;flex:none}
.ib:active{transform:scale(.94)}
/* §13: 규칙·배지 버튼은 아이콘 아래 이름(블라인드 시험: 아이콘만으로는 몰랐음) */
.ib.lb{width:58px;grid-template-rows:auto auto;gap:0;align-content:center;font-family:var(--game);font-size:18px;line-height:1;color:var(--ink,currentColor)}
.ib.lb svg{width:24px;height:24px}
.ib.lb span{display:block;margin-top:1px}
.stg{display:flex;align-items:center;gap:10px;font-family:var(--game);font-size:22px;white-space:nowrap;min-width:0}
.pips{display:flex;gap:5px}
.pips i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.pips i.on{background:var(--accent)}.pips i.done{background:var(--good)}
.sp{flex:1}
.combo{font-family:var(--game);font-size:22px;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:4px 14px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.combo.on{opacity:1;transform:scale(1)}
.score{display:flex;align-items:baseline;gap:8px;background:var(--surface);border-radius:14px;padding:2px 16px;min-height:50px}
.score small{font-family:var(--game);font-size:18px;color:var(--muted)}
.score b{font-family:var(--game);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right;display:inline-block}
.score b.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.25)}}

/* 본문 2단 */
.main{position:relative;display:grid;grid-template-columns:minmax(0,63fr) minmax(300px,37fr);gap:10px;min-height:0}
.scene{position:relative;min-height:0;border-radius:18px;overflow:hidden;background:var(--a-sea);touch-action:none;user-select:none;-webkit-user-select:none}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* 패널 */
.panel{min-height:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.cap{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:18px;padding:12px}
.cap svg{width:64px;height:64px;flex:none}
.say{font-size:19px;line-height:1.42;word-break:keep-all;min-height:2.84em}
.say b{font-family:var(--game);font-weight:400;display:block;font-size:18px;color:var(--muted);margin-bottom:2px}
.big{font-family:var(--game);font-size:26px;min-height:60px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-shadow:inset 0 -5px 0 var(--accent-d)}
.big:active{transform:translateY(2px)}
.big .ico{width:24px;height:24px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.rc{background:var(--surface);border-radius:14px;padding:6px 6px 4px;text-align:center;position:relative}
.rc svg{width:100%;height:58px;display:block}
.rc span{font-family:var(--game);font-size:18px;display:block;line-height:1.15;word-break:keep-all}
.rc.new{box-shadow:inset 0 0 0 3px var(--accent)}
.rc.new::after{content:"새 규칙";position:absolute;top:-12px;right:4px;font-family:var(--game);font-size:18px;line-height:1.2;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 6px}
.prog{display:flex;flex-wrap:wrap;gap:5px;background:var(--surface);border-radius:14px;padding:8px 10px;align-items:center}
.prog svg{width:28px;height:18px}
.prog .wt{opacity:.4}.prog .ms{opacity:.55;filter:grayscale(1)}
/* §13 진행 표시 = '이번 단계 남은 일': 끝낸 칸에 초록 체크, 방금 끝낸 칸은 반짝. 처음 보일 때 한 번 '남은 일' 이름표 */
.prog{position:relative}
.prog .pc{position:relative;display:inline-flex}
.prog .pc .ck{position:absolute;right:-5px;bottom:-5px;width:15px;height:15px}
.prog .pc.just{animation:pcPop .5s ease-out 2}
/* r5: '남은 일' 줄은 늘 한 줄(B형 4단계 12칸이 1000×480에서 두 줄로 넘쳤다). 칸이 많으면 그림이 줄어든다(최대 28px) */
.prog{flex-wrap:nowrap}
.prog .pc{flex:0 1 28px;min-width:8px}
.prog .pc>svg:not(.ck){width:100%;height:auto;max-height:18px}
.prog.many{gap:3px;padding-left:8px;padding-right:8px}
@keyframes pcPop{40%{transform:scale(1.45);filter:drop-shadow(0 0 5px var(--good))}}
.prog-tag{position:absolute;left:10px;top:calc(100% + 9px);background:var(--ink);color:var(--surface);font-family:var(--game);font-size:18px;line-height:1;border-radius:10px;padding:5px 10px;pointer-events:none;white-space:nowrap;box-shadow:0 3px 0 rgba(30,43,58,.2)}
.prog-tag::after{content:'';position:absolute;left:18px;top:-7px;border:7px solid transparent;border-top:0;border-bottom-color:var(--ink)}   /* r3: 진행 줄 아래(위에 두면 규칙 칸 글을 가렸다) */

.hint{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:16px;background:var(--surface);font-size:24px;box-shadow:inset 0 -4px 0 var(--line);margin-top:auto}
.hint .ico{width:30px;height:30px;color:var(--accent)}
.hint .pips i{width:13px;height:13px}
.hint:active{transform:translateY(2px)}
.hide{display:none!important}
/* '왜?' 버튼 줄(GAME.explain이 있을 때만 생김): [힌트 | 왜?]. 버튼 자리는 늘 같고, 설명이 없으면 보이지 않기만 한다(힌트가 움직이지 않게) */
.xp-row{display:flex;gap:8px;margin-top:auto;position:relative}
.xp-row .hint{flex:1;margin-top:0;min-width:0}
.xp-btn{flex:none;min-width:100px;min-height:58px;border-radius:16px;background:var(--surface);font-size:24px;color:var(--accent-d);box-shadow:inset 0 -4px 0 var(--line)}
.xp-btn:active{transform:translateY(2px)}
.xp-btn.off{opacity:.5}   /* r4: 설명이 아직 없으면 흐리게(사라지지 않음). 누르면 이 단계의 일반 '왜?' */
.xp-btn.new{animation:xpPop .5s 2}
@keyframes xpPop{50%{box-shadow:inset 0 0 0 4px var(--accent)}}
.xp-btn[aria-expanded="true"]{background:var(--a-navy);color:var(--a-paper);box-shadow:none}
.xp-card{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:3;background:var(--a-navy);color:var(--a-paper);border-radius:16px;padding:10px 14px;font-size:19px;line-height:1.4;word-break:keep-all;box-shadow:0 4px 0 rgba(30,43,58,.18)}
.xp-card em{font-style:normal;color:var(--a-org)}
.xp-card .d{display:block;margin-top:4px;opacity:.92}
.xp-card small{display:block;font-size:18px;opacity:.8;margin-top:2px}
.ib.got{animation:bump .4s 2}

/* 장면 위 오버레이 (HTML, 렌더러와 독립) */
.ghost{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;will-change:transform}
.ghost svg{width:100%;height:100%}
.ghost.sel{animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{transform:var(--t) scale(1.15)}}
.ring{position:absolute;border-radius:18px;box-shadow:0 0 0 4px var(--accent);animation:blink .7s ease-in-out infinite alternate}
.ring.dst{box-shadow:0 0 0 4px var(--a-paper),0 0 0 8px var(--accent)}
.ring.bad{box-shadow:0 0 0 4px var(--bad);animation:shake .3s}
.ring.hover{box-shadow:0 0 0 3px var(--a-paper);animation:none;opacity:.8}
@keyframes blink{from{opacity:.35}to{opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.callout{position:absolute;left:0;top:0;max-width:92%;background:var(--a-paper);color:var(--a-navy);font-family:var(--game);font-size:20px;line-height:1.25;border-radius:14px;padding:7px 14px;white-space:normal;word-break:keep-all;box-shadow:0 4px 0 rgba(30,43,58,.18);transform-origin:50% 100%}
.callout em{font-style:normal;color:var(--a-org-d)}
.toast{position:absolute;left:0;top:0;display:flex;gap:8px;align-items:center;background:var(--a-navy);color:var(--a-paper);font-family:var(--game);font-size:19px;border-radius:14px;padding:6px 14px 6px 8px;max-width:80%}
.toast svg{width:36px;height:36px;flex:none}
.fx{position:absolute;left:0;top:0;font-family:var(--game);font-size:28px;color:var(--a-paper);text-shadow:0 2px 0 var(--a-navy)}
.fx.fast{font-size:34px;color:var(--a-org)}
.dot{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%}
.ribbon{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--a-paper);color:var(--a-navy);font-family:var(--game);font-size:34px;border-radius:18px;padding:10px 26px;white-space:nowrap;box-shadow:0 6px 0 var(--a-org)}
.ribbon{white-space:normal;word-break:keep-all;width:max-content;max-width:calc(100% - 20px)}   /* 장면보다 길면 장면 안에서 줄을 바꾼다. 한 줄에 들어가면 전과 같다 */
.ribbon small{display:block;font-size:20px;color:var(--a-navy-l);text-align:center}
.ribbon.sm{font-size:26px;padding:6px 18px}.ribbon.sm small{font-size:18px}   /* r5: 가릴 수밖에 없을 때 작게 */
.finger{position:absolute;left:0;top:0;width:54px;height:66px;margin:-4px 0 0 -22px}
.finger svg{width:100%;height:100%}
.finger{transform-origin:22px 4px}   /* r4: 손끝 기준(뒤집기 rotate 180deg가 손끝 자리를 지킨다) */
/* 힌트(§11): 1단계부터 집을 것(hs)·놓을 곳(hd)이 함께 빛나고 화살표(.harrow)가 잇는다. 2단계는 더 굵고 빠르게(strong) */
.ring.hs{box-shadow:0 0 0 4px var(--accent),0 0 16px 6px rgba(232,116,59,.6);animation:hGlow .6s ease-in-out infinite alternate}
.ring.hd{box-shadow:0 0 0 4px var(--a-paper),0 0 0 8px var(--accent),0 0 20px 10px rgba(232,116,59,.5);animation:hGlow .6s ease-in-out infinite alternate}
.ring.hs.strong{box-shadow:0 0 0 6px var(--accent),0 0 24px 10px rgba(232,116,59,.75);animation-duration:.35s}
.ring.hd.strong{box-shadow:0 0 0 5px var(--a-paper),0 0 0 11px var(--accent),0 0 28px 14px rgba(232,116,59,.65);animation-duration:.35s}
@keyframes hGlow{from{opacity:.6}to{opacity:1}}
.harrow{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.harrow .ho{fill:none;stroke:var(--a-paper);stroke-width:13;stroke-linecap:round;opacity:.92}
.harrow .hl{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-dasharray:16 10;animation:hFlow .55s linear infinite}
.harrow .hh{fill:var(--accent);stroke:var(--a-paper);stroke-width:3.5;stroke-linejoin:round}
.harrow.strong .ho{stroke-width:16}.harrow.strong .hl{stroke-width:10;animation-duration:.35s}
@keyframes hFlow{to{stroke-dashoffset:-26}}
/* '해 보기'(§12): 새 동작을 단계 시작에 한 번 직접. 시간이 멈추고 집을 것·놓을 곳만 밝다(.tdim 구멍), 나머지·패널은 흐리게. 해 보면 이름표(.trylab) */
.tdim{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.tdim .tv{fill:rgba(14,22,34,.6)}
.trylab{position:absolute;pointer-events:none;left:0;top:0;background:var(--accent);color:#FBF8F1;font-family:var(--game);font-size:20px;line-height:1.15;border-radius:13px;padding:4px 12px;white-space:nowrap;box-shadow:0 0 0 2px var(--a-paper),0 3px 0 rgba(30,43,58,.25)}
/* r3: 해 본 동작과 같은 규칙 칸이 잠깐 빛남(이름표와 같은 때) / 새 규칙 '보이는 상태' 가리키기는 손가락 대신 빛 테두리 / 틀린 놓기 기본 '다시!' */
.rc.hit{box-shadow:inset 0 0 0 4px var(--accent),inset 0 0 18px rgba(232,116,59,.45);animation:rcHit .45s ease-out 2}   /* 안쪽 빛만(패널 밖으로 넘치지 않게) */
@keyframes rcHit{40%{box-shadow:inset 0 0 0 7px var(--accent),inset 0 0 26px rgba(232,116,59,.6)}}
.ring.look{box-shadow:0 0 0 4px var(--a-paper),0 0 0 7px var(--a-navy),0 0 18px 8px rgba(251,248,241,.55);animation:lookP .6s ease-in-out infinite alternate}
@keyframes lookP{from{opacity:.45}to{opacity:1}}
/* r5: 알림이 장면에 빈자리가 없으면 작게(.sm), 그래도 없으면 패널의 힌트 줄 위(.eng-dock)에 뜬다(장면의 집을 것·놓을 곳·keepClear를 가리지 않게) */
.callout.sm{font-size:18px;padding:4px 10px;line-height:1.2}
.trylab.sm{font-size:18px;padding:3px 9px}
.panel{position:relative}
.eng-dock{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6}
.eng-dock>.callout,.eng-dock>.trylab{position:relative;left:auto;top:auto;max-width:96%}
.nope{position:absolute;left:0;top:0;pointer-events:none;background:var(--bad);color:#fff;font-family:var(--game);font-size:20px;line-height:1.1;border-radius:12px;padding:4px 12px;white-space:nowrap;box-shadow:0 0 0 2px var(--a-paper)}
.app.trying .panel{opacity:.32;transition:opacity .2s}
.app.trying .panel *{pointer-events:none}

/* 모달 */
.veil{position:fixed;inset:0;background:var(--veil);display:grid;place-items:center;z-index:20;padding:12px}
.modal{background:var(--surface);border-radius:20px;padding:16px 18px;width:min(640px,100%);max-height:calc(100dvh - 24px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal h2{font-family:var(--game);font-weight:400;font-size:26px;margin:0}
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mrow .rc svg{height:70px}
.btns{display:flex;gap:10px}
.btn2{flex:1;min-height:54px;border-radius:14px;font-size:22px;background:var(--bg)}

/* 결과 */
.res{position:absolute;inset:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:minmax(0,40fr) minmax(0,60fr);gap:10px}
.rcard{background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:0}

.rcard .num{font-family:var(--game);font-size:min(96px,15vh);line-height:1;font-variant-numeric:tabular-nums}
.rcard .ttl{font-family:var(--game);font-size:30px;background:var(--a-navy);color:var(--a-paper);border-radius:14px;padding:4px 18px}

.rcard .btns{width:100%;margin-top:4px}

.bars .bar{height:16px;border-radius:8px;background:var(--bg);overflow:hidden}

.formula{font-family:var(--game);font-size:22px;background:var(--bg);border-radius:12px;padding:6px 12px;text-align:center}
.nextq{font-size:18px;color:var(--muted);word-break:keep-all}
.rh{font-family:var(--game);font-size:20px;display:flex;justify-content:space-between;gap:8px}
.rh small{font-family:var(--body);font-size:18px;color:var(--muted)}

.rart{flex:1 1 0;min-height:56px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rart svg{width:100%;height:100%;max-height:220px;display:block}

/* 세로·휴대폰: 1단으로 쌓기 */
@media (max-width:760px),(orientation:portrait){
  body{overflow:auto}
  .app{height:auto;min-height:100dvh;grid-template-rows:auto auto;align-content:start}

  .hint{margin-top:0}
  .stg .nm,.stg .pips,.score small{display:none}

  .sp{display:none}
  .score{padding:2px 10px}
  .score b{font-size:28px;min-width:1.6em}
  .combo{font-size:18px;padding:4px 8px}
  .sp{min-width:0}

  .callout{font-size:18px;padding:5px 10px}.toast{font-size:18px;padding:4px 10px 4px 6px}.toast svg{width:28px;height:28px}

}

function chLv(lv){ lv=Math.max(1,Math.min(CH.maxLv,lv||1)); return {lv:lv, R:CH.rounds[lv], tiles:CH.tiles[lv], kinds:CH.kinds[lv], mix:!!CH.mix[lv]}; }
function chStages(lv){ return [{key:'c', name:'새 강 마을', rule:'shape', P:chLv(lv)}]; }

function chDeck(G,P){
  /* 생활 카드: 농장 = 평야 칸 수, 폭포 전망대 1, (p) 발전소 1, (m) 시장 배 2. 비구름 = 평야 칸 수 */
  var life=[], i, d;
  for(i=0;i<P.tiles;i++) life.push('farm');

  var clouds=P.tiles;
  /* 함정 1: 첫 두 장 = 농장 + 비구름(순서는 시드) */
  var first = rnd(G)<0.5 ? ['farm','cloud'] : ['cloud','farm'];
  life.splice(life.indexOf('farm'),1); clouds--;
  /* 함정 2·3: 셋째 장 = 시장 배(있으면) 또는 폭포 전망대 → 계곡·폭포가 비어 있을 때 나온다 */
  var third = life.indexOf('market')>=0 ? 'market' : 'view'; life.splice(life.indexOf(third),1);
  var rest=life.slice(); for(i=0;i<clouds;i++) rest.push('cloud');
  for(i=rest.length-1;i>0;i--){ var j=Math.floor(rnd(G)*(i+1)), x=rest[i]; rest[i]=rest[j]; rest[j]=x; }

  d=first.concat([third]).concat(rest);
  return d;
}

function chSolvable(deck,tiles){
  var d=deck.slice(), plain=0, used=0, guard=0;
  while(d.length && guard++<99){
    var h=d.slice(0,2), i=-1;
    for(var j=0;j<h.length;j++) if(h[j]!=='cloud' && h[j]!=='farm'){ i=j; break; }
    if(i<0) for(j=0;j<h.length;j++) if(h[j]==='farm' && plain>used){ i=j; used++; break; }
    if(i<0) for(j=0;j<h.length;j++) if(h[j]==='cloud'){ i=j; if(plain<tiles) plain++; break; }
    if(i<0) return false;
    d.splice(i,1);
  }
  return true;
}

}

function cl(o){ return JSON.parse(JSON.stringify(o)); }
function rnd(G){ var s=(G.seed+0x6D2B79F5)>>>0; G.seed=s; var t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }

function setupRound(G){

  G.spots.forEach(function(s){ s.b=null; s.ok=null; s.t0=-9; s.via=0; s.clue=null; });
  G.deck=R.deck.map(function(k){ return {id:G.nid++, k:k}; });

  if(G.ch) G.chR=chRounds(G,stOf(G,si).P);
  var total=0; roundsOf(G).forEach(function(r){ r.deck.forEach(function(k){ if(k!=='cloud') total++; }); });

  var R={lay:0, tiles:2, formed:2, deck:[]}; G.lay=0; G.spots=[{id:'v',type:'valley'},{id:'f',type:'falls'},{id:'p0',type:'plain',formed:true,form:-1},{id:'p1',type:'plain',formed:true,form:-1},{id:'r0',type:'river'},{id:'r1',type:'river'}];
  G.spots.forEach(function(s){ s.b=null; s.ok=null; s.t0=-9; s.via=0; }); G.spots[2].b='farm'; G.spots[2].ok=true; G.spots[1].b='view'; G.spots[1].ok=true; G.spots[4].b='market'; G.spots[4].ok=true;
  G.deck=[]; G.anim=[]; G.miss=[]; G.built=[1,1,1]; G.nLife=6; G.spots[2].bi=0; G.spots[1].bi=1; G.spots[4].bi=2;

function start(G){ var g=cl(G); g.score=0; g.phase='play'; g.first={}; g.badges=[]; g.stats={good:0, bad:0, rain:0, via:0, early:0, byKind:{farm:0, power:0, view:0, market:0}}; setupStage(g,0); return g; }

function spotOf(G,id){ for(var i=0;i<G.spots.length;i++) if(G.spots[i].id===id) return G.spots[i]; return null; }
function hand(G){ return G.deck.slice(0,2); }
function playable(G,c){ if(c.k==='cloud') return true; return G.spots.some(function(s){ return !s.b && (s.type!=='plain' || s.formed); }); }
function forming(G){ return G.spots.some(function(s){ return s.type==='plain' && !s.formed && s.form>=0; }); }
function nextTile(G){ for(var i=0;i<G.spots.length;i++){ var s=G.spots[i]; if(s.type==='plain' && !s.formed && s.form<0) return s; } return null; }

function tick(G0,dt){
  var G=cl(G0), ev=[]; if(G.phase!=='play') return {G:G, ev:ev};
  G.t+=dt;
  G.spots.forEach(function(s){ if(s.type==='plain' && !s.formed && s.form>=0){ s.form-=dt; if(s.form<0){ s.formed=true; s.rain=true; s.form=-1; s.t0=G.t; ev.push({t:'formed', at:'spot:'+s.id}); } } });
  G.anim=G.anim.filter(function(a){ return G.t-a.t0<2.4; });
  if(G.ch && G.failT!=null && G.endT<0 && G.t-G.failT>=T.chFailShow){ G.deck=[]; G.gapT=-1; G.endT=T.chMissHold; G.chOver=1; }
  if(live(G) && G.deck.length && !forming(G) && !hand(G).some(function(c){ return playable(G,c); })){
    /* 막힘(앞에서 잘못 지어 남은 카드를 놓을 자리가 없음): 뒤에 비구름이 있으면 맨 앞 카드를 뒤로, 없으면 그 카드는 못 지은 것으로 */
    var c0=G.deck.shift();
    if(G.deck.some(function(c){ return c.k==='cloud'; })) G.deck.push(c0);
    else { G.res.missed++; G.stats.bad++; G.built.push(0); ev.push({t:'lost', k:c0.k, bad:true}); }
  }
  if(G.gapT>=0){ G.gapT-=dt; if(G.gapT<0){ G.ri++; setupRound(G); ev.push({t:'round', ri:G.ri}); } return {G:G, ev:ev}; }
  if(G.endT<0 && !G.deck.length && !forming(G)){
    if(G.ri<roundsOf(G).length-1){ G.gapT=T.roundGap; return {G:G, ev:ev}; }
    G.endT = (G.ch && G.miss.length) ? T.chMissHold : T.endHold;   /* 도전: 놓친 단서 칩을 볼 시간 */
  }
  if(G.endT>=0){ G.endT-=dt; if(G.endT<0){
    G.phase='stageEnd'; G.stageGood[G.si]=G.res.served; G.stageN[G.si]=G.res.total;
    if(G.si===0) award(G,ev,'plain');
    if(G.si===1){ award(G,ev,'power'); award(G,ev,'tour'); award(G,ev,'market'); }
    ev.push({t:'stageEnd', si:G.si}); } }
  return {G:G, ev:ev};
}

/* src: 'card:<id>'(카드 줄 앞 두 장)   dst: 'mtn:0'|'mtn:1'(비구름) | 'spot:<id>'(생활 카드) */
function drop(G0,src,dst,via){
  var fail=function(why){ return {G:G0, ok:false, why:why, ev:[{t:'bounce', why:why, src:src, dst:dst}]}; };
  if(!live(G0)) return fail('phase');
  var sp=String(src).split(':'), dp=String(dst).split(':');
  if(sp[0]!=='card') return fail('src');
  var hi=-1; hand(G0).forEach(function(c,i){ if(String(c.id)===sp[1]) hi=i; }); if(hi<0) return fail('src');
  var G=cl(G0), ev=[], card=G.deck[hi];
  if(card.k==='cloud'){
    if(dp[0]!=='mtn') return fail('cloudMtn');
    G.deck.splice(hi,1); G.stats.rain++;
    var tile=nextTile(G);
    G.anim.push({k:'rain', m:+dp[1], t0:G.t, tile:tile?tile.id:null});
    if(tile){ tile.form=T.flow; }
    ev.push({t:'rain', at:dst, tile:tile?tile.id:null});
    firstName(G,ev,'rain',tile?'spot:'+tile.id:dst);
    return {G:G, ok:true, ev:ev};
  }
  if(dp[0]==='mtn') return fail('mtnLife');
  if(dp[0]!=='spot') return fail('dst');
  var s=spotOf(G,dp[1]); if(!s) return fail('dst');
  if(s.b) return fail('full');
  if(s.type==='plain' && !s.formed) return fail('water');
  G.deck.splice(hi,1);
  var good = GOOD[card.k]===s.type, units = good?T.good:T.bad, pts;
  if(G.ch) pts = (good && !via) ? CH.pts : 0;
  else pts = via ? T.viaPts : units*T.unit;
  s.b=card.k; s.ok=good; s.t0=G.t; s.via=via?1:0; s.bi=G.built.length; G.built.push(good?1:0);
  G.score+=pts;
  if(good){ G.store.good+=units; G.res.served++; G.stats.good++; G.stats.byKind[card.k]++; if(via) G.stats.via++; }
  else { G.store.bad+=units; G.res.missed++; G.stats.bad++;
    /* 놓친 단서(블라인드 1차: 도전에서 틀린 이유가 안 보임): 평야가 아직 덜 생겼는데 농장 → '비 먼저', 그 밖에는 그 카드의 알맞은 지형 */
    /* 블라인드 2차: 계곡에 농장을 놓았는데 빈 평야가 있을 때도 '비 먼저'가 떴다 → '비 먼저'는 쓸 수 있는 평야가 없고 아직 생기지 않은 평야가 남았을 때만 */
    var early = card.k==='farm' && !G.spots.some(function(x){ return x.type==='plain' && x.formed && !x.b && x!==s; }) && G.spots.some(function(x){ return x.type==='plain' && !x.formed; });
    if(early) G.stats.early++;
    s.clue = early ? 'rain' : GOOD[card.k]; G.miss.push(s.clue);
    if(G.ch && G.failT==null) G.failT=G.t; }   /* 도전(하나도 틀리지 않기): 첫 실수에서 판을 끝낸다(단서 말풍선을 볼 시간 뒤) */
  G.anim.push({k:'build', at:s.id, good:good, t0:G.t, units:units});
  ev.push({t:'build', at:'spot:'+s.id, k:card.k, good:good, pts:pts, via:!!via, ok:good, bad:!good, clue:s.clue||null});
  if(good){ firstName(G,ev,card.k,'spot:'+s.id);
    if(G.si===2 && !G.ch) firstName(G,ev,'shape','spot:'+s.id); }

}
function next(G0){ var G=cl(G0); if(G.phase!=='stageEnd') return G; if(G.si>=nStages(G)-1){ G.phase='end'; return G; } G.phase='play'; setupStage(G,G.si+1); return G; }

/* 지금 할 만한 한 수(힌트·시범·자동 플레이 공용). good: 카드 종류 → 알맞은 지형(반쪽 봇은 다르게 앎) */
function freeOf(G,type){ for(var i=0;i<G.spots.length;i++){ var s=G.spots[i]; if(s.type===type && !s.b && (type!=='plain' || s.formed)) return s; } return null; }
function anyFree(G,order){ for(var i=0;i<order.length;i++){ var s=spotOf(G,order[i]); if(s && !s.b && (s.type!=='plain' || s.formed)) return s; } for(i=0;i<G.spots.length;i++){ s=G.spots[i]; if(!s.b && (s.type!=='plain' || s.formed)) return s; } return null; }
function moveWith(G,goodOf,cloudFirst){
  if(!live(G)) return null;
  var h=hand(G), i, c;
  /* 1) 알맞은 빈자리가 있는 생활 카드 */
  for(i=0;i<h.length;i++){ c=h[i]; if(c.k==='cloud') continue; var s=goodOf(G,c.k); if(s) return {src:'card:'+c.id, dst:'spot:'+s.id}; }
  /* 2) 비구름(아직 생기지 않은 평야 칸이 있을 때) */
  var cloud=h.filter(function(x){ return x.k==='cloud'; })[0];
  if(cloud && (nextTile(G) || !h.some(function(x){ return x.k!=='cloud'; }))) return {src:'card:'+cloud.id, dst:'mtn:0'};
  /* 3) 평야가 생기는 중이면 기다린다 */
  if(forming(G)) return null;
  if(cloud) return {src:'card:'+cloud.id, dst:'mtn:0'};
  /* 4) 맞는 자리가 없다(앞에서 잘못 지음) → 남은 빈자리에 */
  for(i=0;i<h.length;i++){ c=h[i]; var f=anyFree(G,['r1','r0','v','f']); if(f) return {src:'card:'+c.id, dst:'spot:'+f.id}; }
  return null;
}
function goodSpot(G,k){ return freeOf(G,GOOD[k]); }
function hintMove(G){ return moveWith(G,goodSpot); }
/* §19-6 반쪽 봇: 0 = 비가 평야를 만든다는 걸 모름(생활 카드를 먼저, 평야가 없으면 아무 빈자리), 1 = 폭포·계곡 쓰임을 바꿔 앎, 2 = 배는 물이면 아무 데나(계곡·폭포·강 중 먼저 빈 곳) */
function partialMove(G,k){
  if(!live(G)) return null;
  if(k===0){ var h=hand(G), life=h.filter(function(x){ return x.k!=='cloud'; })[0];
    if(life){ var s=goodSpot(G,life.k) || anyFree(G,['v','f','r0','r1']); if(s) return {src:'card:'+life.id, dst:'spot:'+s.id}; }
    return hintMove(G); }
  if(k===1) return moveWith(G,function(G2,kk){ var m={farm:'plain', power:'falls', view:'valley', market:'river'}; return freeOf(G2,m[kk]); });
  if(k===2) return moveWith(G,function(G2,kk){ if(kk==='market') return anyFree(G2,['v','f','r0','r1']); return goodSpot(G2,kk); });
  return hintMove(G);
}
function sources(G){ return live(G) ? hand(G).map(function(c){ return 'card:'+c.id; }) : []; }
function targets(G){ if(!live(G)) return []; var a=['mtn:0','mtn:1']; G.spots.forEach(function(s){ if(!s.b && (s.type!=='plain' || s.formed)) a.push('spot:'+s.id); }); return a; }
function itemOf(G,id){ var p=String(id).split(':'); if(p[0]!=='card') return null; var c=G.deck.filter(function(x){ return String(x.id)===p[1]; })[0]; return c ? 'k_'+c.k : null; }
function titleOf(p){ var t=TITLES[0][1]; TITLES.forEach(function(x){ if(p>=x[0]) t=x[1]; }); return t; }

     labQ:[], txtAt:-1e9, callN:0, trKinds:{}, didKinds:{}, trSkip:{}, keepDemo:{}, dropPt:null, downAt:-1e9, autoH:{}, toastW:{}, actAt:-1e9}; }   /* r5: 마지막 학생 행동 시각(actAt): 그 뒤 0.6초는 직접 결과만 */   /* r4: 마지막 누름(downAt), 단계별 자동 힌트 1회(autoH), 미룬 토스트(toastW) */   /* r3: 글 줄(labQ·txtAt), 해 본 동작 종류(trKinds), 놓친 이유 기록(trSkip) */
/* '마지막 단계 다시'(§10)는 2026-11-07 폐지(§19 도전 모드로 대체). GAME.replayLast가 있어도 읽지 않는다 */
/* §19 도전 모드 = 레벨 사다리. 엔진은 틀만(잠금 해제·레벨·판마다 새 시드·목표 점수·통과/아깝다/다시·별·기록·결과 화면).
   도전 '내용'은 게임이 정의한다: GAME.challenge = {stages:[{name}…], goal(lv), say:{start:[…]}, ruleCards?:[…], speed?(lv), cfg?(lv)}.
   LOGIC은 G.ch(레벨, 1부터)가 있으면 자기 도전 단계 표를 쓴다. GAME.challenge가 없으면 도전 버튼도 없다(잘못된 도전을 내보내지 않음).
   아래 ENG-CHRULE 구역은 규칙(순수 함수)만: check.js가 잘라 Node에서 같은 규칙으로 봇 세션을 돌린다 */
/* ENG-CHRULE-START */
var CHC = GAME.challenge && typeof GAME.challenge==='object' && Array.isArray(GAME.challenge.stages) && GAME.challenge.stages.length ? GAME.challenge : null;
var ENG_CHNEAR = 0.9;   /* 목표의 90% 이상이면 '아깝다' */
var ENG_CHR = {
  spd: function(lv){ return typeof CHC.speed==='function' ? (+CHC.speed(lv)||1) : 1; },   /* 시간 배속: 기본 1(시간만 줄인 도전 금지). 게임이 원하면 */
  cfg: function(lv){ return typeof CHC.cfg==='function' ? CHC.cfg(lv) : (CHC.cfg||null); },   /* G.cfg로 LOGIC에 넘길 레벨별 값(선택) */
  goal: function(lv){ return Math.max(1, Math.round(+CHC.goal(lv)||1)); },
  stars: function(sc,g){ if(CHC.kind==='reason') return sc<g ? 0 : 3;   /* 추론형: 목표 = 모두 맞힘(만점)이라 통과면 별 셋 */
    return sc<g ? 0 : sc>=g*1.3 ? 3 : sc>=g*1.15 ? 2 : 1; },
  seed: function(n){ return ((GAME.seed||1)+7919*(n+1))>>>0; },
  max: function(){ var m=Math.floor(+CHC.maxLevel||0); return m>0 ? m : 0; },   /* §19-추론형(2026-11-07): 최고 레벨(0 = 끝없음). 다 깨면 '모든 도전 완주!' */
  kind: function(){ return CHC.kind==='reason' ? 'reason' : 'score'; }          /* 'reason' = 추론형 도전(시간 무관, 그 레벨 예측을 모두 맞혀야 통과). check.js 공리 판정이 달라짐 */
};
/* ENG-CHRULE-END */
var ENG_CH_GAP = 900, ENG_CHON = false, ENG_CHLV = 1, ENG_CHSPD = 1, ENG_CHCFG = null, ENG_CHGOAL = 0, ENG_CHRS = Math.floor(Math.random()*100000);
var ENG_CHM = {open:false, lv:1, top:0, best:{}, n:0};   /* lv = 열린 레벨(다음에 할 것), top = 깬 최고 레벨, best = 레벨별 최고 점수, n = 판 수 */
function engHash(s){ var h=5381; for(var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
var ENG_CHK = 'engch:'+(GAME.id ? String(GAME.id) : engHash(String(GAME.title)+'|'+String(GAME.subtitle)));
/* ENG-STORE-START: 엔진이 브라우저 저장을 쓰는 곳은 이 두 함수뿐(check.js가 이 구역 밖의 사용과 try 없는 사용을 막는다). 막혀 있으면 ENG_CHM(메모리)만으로 이 접속 동안 동작 */
function engChLoad(){ try{ var s=window.localStorage.getItem(ENG_CHK); if(s) engChMerge(JSON.parse(s)); }catch(e){} }
function engChSave(){ try{ window.localStorage.setItem(ENG_CHK, JSON.stringify(ENG_CHM)); }catch(e){} }
/* ENG-STORE-END */
function engChMerge(o){ if(!o||typeof o!=='object') return; var M=ENG_CHM; if(o.open) M.open=true; if(o.all) M.all=1; ['lv','top','n'].forEach(function(k){ if(+o[k]>M[k]) M[k]=+o[k]; });
  if(o.best&&typeof o.best==='object') for(var k in o.best) if(+o.best[k]>(M.best[k]||0)) M.best[k]=+o.best[k]; }
function engChMark(g){ if(ENG_CHON && g && typeof g==='object' && g.ch!==ENG_CHLV){ g.ch=ENG_CHLV; if(ENG_CHCFG) g.cfg=ENG_CHCFG; } return g; }
/* 지금 판의 단계 표·규칙 칸·시작 대사(도전이면 GAME.challenge 것) */
function engStg(){ return ENG_CHON ? CHC.stages : GAME.stages; }
function engRC(si){ return (ENG_CHON ? (CHC.ruleCards||[])[si] : GAME.ruleCards[si]) || []; }
function engSay0(si){ return ENG_CHON ? ((CHC.say||{}).start||[])[si] || '' : SAY.start[si]; }   /* LOGIC이 새 G를 만들며 빠뜨려도 다시 붙인다 */
function engChLab(lv){ return '도전 '+lv+(CHC && ENG_CHR.max() ? ' / '+ENG_CHR.max() : ''); }   /* 블라인드(11-07): '도전 5'가 무엇인지 모름 → GAME.challenge.maxLevel이 있으면 '도전 5 / 8'(HUD 알약·첫 리본·결과 큰 글). 없으면 '도전 5' */
function engChIcon(){ return '<svg class="eng-chi" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.6 2.2 4.8 13.6h6.1L9.4 21.8l9.8-12.2h-6.3z" fill="currentColor"/></svg>'; }
function engStar(on){ return '<svg class="eng-star'+(on?' on':'')+'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.2l-5.8 3.2 1.2-6.5L2.6 9.4l6.5-.8z"/></svg>'; }
function engChStart(lv){
  if(!CHC) return; lv=Math.max(1, +lv||ENG_CHM.lv); if(ENG_CHR.max()) lv=Math.min(lv, ENG_CHR.max()); reset();
  ENG_CHON=true; ENG_CHLV=lv; ENG_CHSPD=ENG_CHR.spd(lv); ENG_CHCFG=ENG_CHR.cfg(lv); ENG_CHGOAL=ENG_CHR.goal(lv);
  G=engChMark(newGame(ENG_CHR.seed(ENG_CHM.n+ENG_CHRS))); ENG_CHM.n++; engChSave();   /* 판마다 새 시드 */
  G=engChMark(start(G));
  var t=ovl.querySelector('.ribbon'); if(t) t.remove(); beginStage();
}
/* §19-짝(2026-11-07, 교사 승인): 도전이 없는 체험 게임은 같은 차시 '떠올리기 연습'의 도전으로 이어 준다.
   주소는 배포 때 넣는다: <meta name="eng-pair" content="주소"> 또는 GAME.pairUrl. 주소가 없으면 버튼도 없다. */
function engPairUrl(){ try{ var m=document.querySelector('meta[name="eng-pair"]'); var u=(m&&m.getAttribute('content'))||GAME.pairUrl||''; return /^(https:\/\/|\.{0,2}\/|[\w-]+\.html)/.test(u)?u:''; }catch(e){ return ''; } }
function engPairBtn(){ var u=engPairUrl(); if(!u) return ''; return '<a class="btn2 eng-ch eng-pair" id="engPair" href="'+u.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">'+engChIcon()+'연습에서 도전</a>'; }
/* 2026-11-07 교사 결정: 잠금 폐지 — 도전은 첫 화면부터 늘 열려 있다(중간에 나갔다 들어오는 학생·복습하는 학생). 레벨 = 기기 기록(없으면 1).
   시각 위계: 개념 판 '시작'이 주 버튼(주황, 60px, 먼저), 도전은 둘째 버튼(남색, 52px). 도전이 없는 체험 게임은 eng-pair 주소가 있을 때만 '연습에서 도전'을 둘째로 */
function engChTitleBtn(){
  var p=$('#pbtn'); if(!p.children.length) return;
  if(CHC){ var lv=ENG_CHR.max()?Math.min(ENG_CHM.lv,ENG_CHR.max()):ENG_CHM.lv; p.classList.add('eng-p2');
    p.insertAdjacentHTML('beforeend','<button class="big eng-ch eng-sec" id="engChGo">'+engChIcon()+'도전 '+lv+'</button>');
    $('#engChGo').onclick=function(){ if(U.busy) return; engChStart(lv); }; return; }
  var u=engPairUrl(); if(!u) return; p.classList.add('eng-p2');
  p.insertAdjacentHTML('beforeend','<a class="big eng-ch eng-sec eng-pair" id="engPairGo" href="'+u.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">'+engChIcon()+'연습에서 도전</a>');
}
function reset(){
  ENG_CHON=false; GEN++; G=newGame(GAME.seed); ovl.innerHTML=''; engDockClear();
  U=freshU(); $('#app').classList.remove('trying');
  if(XPC){ xpClose(); $('#xpBtn').classList.add('off'); }
  $('#combo').classList.remove('on'); closeModal(); var r=$('.res'); if(r) r.remove(); $('#main').classList.remove('showres');
  $('#score').textContent='0'; /* U.shown=0, G.score=0이라 frame()이 갱신하지 않으므로 직접 지운다 */
  stageHud(); title();
}
function stageHud(){
  var on=U.mode!=='title', si=G.si;
  $('#stgName').innerHTML = on ? (si+1)+'단계<span class="nm"> · '+engStg()[si].name+'</span>' : GAME.title;
  $('#stgPips').innerHTML = on ? engStg().map(function(_,i){ return '<i class="'+(i<si?'done':i===si?'on':'')+'"></i>'; }).join('') : '';
  var ct=$('#engChTag'); if(ct){ if(ENG_CHON) ct.innerHTML=engChIcon()+engChLab(ENG_CHLV); ct.classList.toggle('hide', !ENG_CHON); }   /* §19 도전 중 표시 */
}
function say(html,who){ $('#say').innerHTML='<b>'+(who||GAME.guide)+'</b>'+html; }
function setBtn(label,fn){ var p=$('#pbtn'); p.classList.remove('eng-p2'); if(!label){ p.innerHTML=''; return; } p.innerHTML='<button class="big" id="bBig">'+label+iconSvg('icNext')+'</button>'; $('#bBig').onclick=function(){ if(U.busy) return; fn(); }; }
function ruleCard(c){ return '<div class="rc'+(c[2]?' new':'')+'"><svg viewBox="0 0 120 60">'+useArt(c[0],0,0,120,60)+'</svg><span>'+c[1]+'</span></div>'; }
function rulesPanel(){ var h=''; if(U.mode==='play'||U.mode==='stageEnd'){ engRC(G.si).forEach(function(c){ h+=ruleCard(c); }); } $('#rules').innerHTML=h; }
/* 진행 표시: 끝낸 일(G.res.served) 초록, 놓친 일(G.res.missed) 회색, 남은 일 흐리게 */
function progPanel(){
  var p=$('#prog'); if(U.mode!=='play'&&U.mode!=='stageEnd'){ p.classList.add('hide'); return; } p.classList.remove('hide');
  var total=G.res.total, h='', art=GAME.progArt, vb=ASSETS[art].vb;
  var done=G.res.served, miss=G.res.missed, key=G.si+'|'+total, prev=U.progKey===key?U.progDone:done;   /* 같은 단계에서 새로 끝낸 칸만 반짝(§13) */
  for(var i=0;i<total;i++){ var c = i<done?'':(i<done+miss?'ms':'wt');
    h+='<span class="pc'+(i<done&&i>=prev?' just':'')+'"><svg viewBox="0 0 '+vb[2]+' '+vb[3]+'" class="'+c+'">'+useArt(art,0,0,vb[2],vb[3])+'</svg>'
      +(i<done?'<svg class="ck" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="var(--good)"/><path d="M4.4 8.3l2.4 2.4 4.8-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>':'')+'</span>'; }
  var tg=p.querySelector('.prog-tag');
  p.innerHTML=h; if(tg) p.appendChild(tg); p.classList.toggle('many', total>9);   /* r5: 칸이 많으면 간격을 줄인다(늘 한 줄) */
  U.progKey=key; U.progDone=done;
}
/* 진행 줄을 처음 볼 때 한 번(이 화면에서) '남은 일' 이름표(§13). '해 보기'가 끝나고 시범 시각이 지난 뒤 3초 */
var PTAG=0;
function progTag(now){
  if(PTAG||U.mode!=='play'||tryHold()||now<U.demoAt-400) return;
  /* r4: '해 보기' 이름표('칸에 넣기')와 같은 때 뜨지 않게: 글 줄이 비고 마지막 글이 나타나고 1.7초 뒤(최대 8초 기다림) */
  if(!U.ptWait) U.ptWait=now; var busyTxt=U.labQ.length||ovl.querySelector('.trylab')||now-U.txtAt<1700; if(busyTxt && now-U.ptWait<8000) return;
  var p=$('#prog'); if(!p||!p.offsetParent||p.classList.contains('hide')||!p.children.length) return;
  PTAG=1; var d=document.createElement('div'); d.className='prog-tag'; d.textContent='남은 일'; p.appendChild(d);
  if(!RM) d.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:220});
  later(3200,function(){ d.animate([{opacity:1},{opacity:0}],{duration:RM?1:300}).onfinish=function(){ d.remove(); }; });
}
function hintBtn(){

  ribbon(GAME.title,GAME.subtitle,0);
}
function beginStage(){
  U.mode='play'; U.hint=0; U.hintMv=null; U.bounces=0; U.okN=0; U.lastAct=performance.now(); U.demo=null; U.demoAt=performance.now()+(G.si===0?2200:2400);

  else ribbon((G.si+1)+'단계', engStg()[G.si].name, ENG_CHON?ENG_CH_GAP:1500);
  tryBegin();   /* §12 '해 보기': 새 규칙이 나오는 단계면 시간을 멈추고 한 번 직접 해 보게 한다 */
  tq.forEach(toast);

/* 단계 끝 리본(§14): GAME.stageRibbon(G)가 글을 주면 그것. 없으면 G.res가 있고 missed===0이면 '○단계 성공!'(꽃가루), 아니면 '○단계 끝!'(엔진은 성공 여부를 모른다) */
function stageRibbon(){
  var n=(G.si+1)+'단계', t=typeof GAME.stageRibbon==='function'?GAME.stageRibbon(G):null;
  if(t&&typeof t==='object') return {text:t.text||n+' 끝!', ok:t.confetti!==false};   /* {text, confetti:false}도 된다 */
  if(t!=null&&t!=='') return {text:String(t), ok:true};
  var ok=!!(G.res&&typeof G.res.missed==='number'&&G.res.missed===0);
  return {text:n+(ok?' 성공!':' 끝!'), ok:ok};
}
/* u2(§18): 단계 끝 비교 카드(SCENE이 phase stageEnd에 그림)가 보이는 동안 장면 위 글은 카드와 리본뿐.
   +점수 글은 띄우지 않고(HUD 점수는 그대로 오름), 말풍선은 패널 자리(#engDock)로, 배지 토스트는 다음 단계 시작으로 미룬다 */
function engEndCard(){ if(!U||!G) return false; if(U.mode==='stageEnd'||G.phase==='stageEnd') return true; return typeof SCENE.endCard==='function' && !!SCENE.endCard(G); }
function engEndSweep(){

  var tz=ovl.querySelectorAll('.toast'); tz.forEach(function(d){ d._gone=1; d.remove(); }); if(tz.length) engBadgeBump();   /* 단계 끝 직전에 뜬 배지 토스트도 거둔다(배지 버튼 통통, 결과 선반에 있음) */
  ovl.querySelectorAll('.callout').forEach(function(d){ if(d._gone||d._dock) return; d.getAnimations().forEach(function(a){ a.cancel(); }); engDockPut(d); });

function onStageEnd(){
  U.mode='stageEnd'; U.busy=true; tryClear(); engEndSweep(); stopDemo(); if(XPC){ U.xpCur=null; xpSync(); } clearRings(); hintBtn(); progPanel(); $('#combo').classList.remove('on'); U.comboT=0;
  var sr=stageRibbon();
  if(ENG_CHON){   /* §19 도전: 단계 끝 대사·'다음'·비교 카드 없이 짧은 리본 뒤 바로 다음 단계(LOGIC next를 곧바로 불러 비교 카드 장면을 건너뜀) */
    ribbon(sr.text, '', ENG_CH_GAP); if(sr.ok) confetti(); setBtn(null);

    show(); });

/* ---------- 손가락 시범 ---------- */
function stopDemo(){ if(U.demo){ U.demo.forEach(function(e){ e.remove(); }); U.demo=null; } hintFingerStop(); }
function endDemo(mine){ if(mine){ mine.forEach(function(e){ e.remove(); }); U.demo=null; } }   /* 시범이 저절로 끝남: 그 시범만 지운다 */
function demoMove(mv,loops){
  stopDemo(); var a=SCENE.rectOf(G,mv.src), b=SCENE.rectOf(G,mv.dst); if(!a||!b) return;
  var s=sceneEl.getBoundingClientRect(), item=itemOf(G,mv.src);
  var f=document.createElement('div'); f.className='finger'; f.innerHTML=iconSvg('finger','');
  var gh=document.createElement('div'); gh.className='ghost'; gh.innerHTML=itemSvg(item); gh.style.opacity='.85';
  ovl.appendChild(gh); ovl.appendChild(f); var mine=U.demo=[f,gh];
  var x0=a.cx-s.left, y0=a.cy-s.top, x1=b.cx-s.left, y1=b.cy-s.top;
  var kf=function(dx,dy){ return [
    {transform:'translate('+(x0+dx)+'px,'+(y0+dy+30)+'px)',opacity:0,offset:0},
    {transform:'translate('+(x0+dx)+'px,'+(y0+dy)+'px)',opacity:1,offset:.15},
    {transform:'translate('+(x0+dx)+'px,'+(y0+dy)+'px) scale(.92)',opacity:1,offset:.25},
    {transform:'translate('+(x1+dx)+'px,'+(y1+dy)+'px) scale(.92)',opacity:1,offset:.75},
    {transform:'translate('+(x1+dx)+'px,'+(y1+dy)+'px)',opacity:0,offset:1}]; };
  var opt={duration:RM?2600:2000,iterations:loops,easing:'ease-in-out'};
  f.animate(kf(0,6),opt); var an=gh.animate(kf(0,0),opt);
  an.onfinish=function(){ endDemo(U.demo===mine?mine:null); };   /* 지운 시범의 늦은 끝 알림이 새 시범·힌트 손가락을 지우지 않게 */
}
/* 새 규칙이 '보이는 상태'일 때(예: 기다림 막대) 그곳을 가리킨다. r3: 손가락이 아니라 빛 테두리(.ring.look) 두 번(블라인드 2차: 남은 손가락을 '눌러야 하나?'로 읽었고 말풍선 글을 가렸다) */
function demoPoint(id){

  later(RM?2400:2600,function(){ endDemo(U.demo===mine?mine:null); if(d.parentNode) d.remove(); });
}
/* 손가락이 한 곳(rectOf(G,id) 아래쪽)을 콕콕 누른다: 탭 '해 보기'({tap})에서만 */
function engDemoTap(id){

  var f=document.createElement('div'); f.className='finger'; f.innerHTML=iconSvg('finger',''); ovl.appendChild(f); var mine=U.demo=[f];

/* 언제 시범을 보일지. 기본: 단계 시작에 hintMove를 한 번(2회 반복), 그 뒤는 10초 동안 아무것도 못 하면 한 번.
   GAME.demo(G)가 이 단계의 시작 시범을 바꿀 수 있다:
     {repeat:true}            멈출 때마다(1.2초) 시범 반복(첫 단계 튜토리얼)
     {point:id, text, at}     손가락이 id를 가리키고 말풍선 text(at 위치). point가 null이면 아직 기다림
     {move:{src,dst}}         시작 시범을 이 수로. move가 null이면 아직 기다림 */
function maybeDemo(now){
  if(ENG_CHON) return;   /* §19 도전: 저절로 뜨는 손가락 시범 없음(답을 보여 주지 않음). 힌트 버튼은 그대로 */
  if(U.mode!=='play'||U.demo||U.drag||U.sel||U.busy||U.hint||tryHold()) return;   /* '해 보기' 중에는 시범 없음(§12) */   /* 힌트가 켜져 있으면 시범 없음(힌트가 보여 주는 수와 다른 곳을 가리키지 않게) */
  if(now-U.okAt<2000) return;   /* 바르게 놓은 직후 2초는 시범 없음(맞혔는데 틀린 줄 알게 됨, §11) */
  if(now-U.downAt<2500) return;   /* r4: 장면을 누른 직후 2.5초도 시범 없음(3차 블라인드: 버튼을 누르자 손가락이 '저절로' 나옴) */
  var done=!!U.demoDone[G.si], p=(GAME.demo&&GAME.demo(G))||{};
  if(('point' in p) && !done){ if(p.point && now>U.demoAt){ U.demoDone[G.si]=1; demoPoint(p.point); if(p.text) callout(p.text,p.at||null); } return; }
  var mv=hintMove(G);
  if(!mv) return;
  /* r3: '해 보기'가 켜진 엔진(GAME.tryIt!==false)에서는 손가락 = '지금 이것을 하세요'(해 보기·힌트)만. 단계 시작 손가락 시범(기본·move·repeat)은 없다.
     예외: 해 보기에서 keepDemo:true를 준 단계의 게임 시범. 10초 동안 아무것도 못 하면 한 번 보여 주는 시범은 그대로 */
  var noF=GAME.tryIt!==false && !U.keepDemo[G.si];
  if(p.repeat && !noF){ if(now-U.lastAct>1200 && now>U.demoAt) demoMove(mv,2); return; }
  if(!done && now>U.demoAt && noF){ U.demoDone[G.si]=1; return; }
  if(!done && now>U.demoAt){
    if(!('move' in p) && U.okN>0){ U.demoDone[G.si]=1; return; }   /* 기본 시작 시범: 이미 스스로 한 수를 맞혔으면 건너뜀 */
    if('move' in p){ if(!p.move) return; mv=p.move; }
    U.demoDone[G.si]=1; demoMove(mv,2); return;
  }
  if(now-U.lastAct>10000){ U.lastAct=now; demoMove(mv,1); }
}

/* ---------- 이벤트 처리 ----------
   엔진이 직접 받는 이벤트: name(k, at) → 한 줄 말풍선, badge(k) → 배지 토스트, stageEnd → 단계 끝.
   나머지는 GAME.onEvent(e, FX)로 넘긴다. FX는 화면 효과 몇 가지뿐이다(점수는 FX.score 하나로만 보인다). */
var FX = {
  score:function(at,pts,fast,combo){ if(U.trPts!=null){ pts=U.trPts; if(!pts) return; }
    /* r5: +점수·HUD 튐·콤보는 행동 0.6초 뒤(그 사이 또 행동하면 그만큼 더 뒤). 자리는 지금 잡아 둔다(대상이 그새 떠나도 그 자리에) */
    var r0=SCENE.rectOf(G,at), t0=performance.now(), go=function(){ if(engHeld()){ later(ENG_ACT_HOLD-(performance.now()-U.actAt)+10,go); return; }
      engScoreSeen(); var got=engScoreTake(pts); if(!(got>0)) return;   /* 블라인드(11-07): +n은 점수가 실제로 오른 만큼만. 오르지 않았으면 +n·점수 튐·콤보 모두 없음 */
      if(!(U.badAt>t0)) fxText(at,'+'+got,fast,r0);   /* 블라인드(11-07): 맞힌 수의 +n이 그 뒤 틀린 수 직후에 떠 '틀려도 점수'로 읽힘 → 그 사이 틀린 놓기가 있었으면 +n 글은 띄우지 않는다(점수 칸만 튐) */ bumpScore(); if(combo>=2){ var c=$('#combo'); c.textContent='콤보 '+combo; c.classList.add('on'); U.comboT=performance.now(); } };
    go(); },
  burst:function(at,n){ burst(at,n); },
  progress:function(){ progPanel(); },
  comboOff:function(){ $('#combo').classList.remove('on'); },
  callout:function(html,at){ callout(html,at); },
  explain:function(x){ xpSet(x); }   /* GAME.explain이 있을 때: 지금 '왜?'로 열 설명. 글 | {why, def, page} | null(지움) */
};

/* ---------- '왜?' 버튼 (GAME.explain이 있을 때만. 인지부하: 부가 설명은 학생이 골라서 연다) ----------
   보여 줄 설명 = 게임이 넘긴 것(이벤트 {t:'explain'} / FX.explain / 틀린 놓기의 reasons[why]) → 없으면 GAME.explain.of(G).
   넘긴 설명은 다음 놓기·단계 바뀜에서 사라진다. 카드는 장면을 누르거나 힌트를 누르면 접힌다. 게임은 멈추지 않는다 */
function xpHtml(x){
  if(!x) return ''; if(typeof x==='string') return x;
  return (x.why?'<span>'+x.why+'</span>':'')+(x.def?'<span class="d">'+x.def+'</span>':'')+(x.page?'<small>'+x.page+'</small>':'');
}
function xpSet(x){ if(!XPC) return; U.xpCur=(x==null||x==='')?null:x; xpSync(); }
function xpSync(){
  if(!XPC) return; if(U.mode==='play' && engHeld()) return;   /* r5: '왜?' 반짝임도 행동 0.6초 뒤 */
  var h = U.mode==='play' ? xpHtml(U.xpCur) : '';
  if(!h && U.mode==='play' && XPC.of) h = xpHtml(XPC.of(G));
  if(h===U.xpKey) return; U.xpKey=h; xpClose();
  var b=$('#xpBtn'); b.classList.toggle('off',!h);   /* r4: 없으면 흐리게만(사라지지 않음) */
  if(h&&!RM){ b.classList.remove('new'); void b.offsetWidth; b.classList.add('new'); }
}
function xpClose(){ if(!XPC) return; var c=$('#xpCard'); if(c) c.remove(); $('#xpBtn').setAttribute('aria-expanded','false'); }
function xpToggle(){
  if(!XPC) return; if($('#xpCard')){ xpClose(); return; } if(U.mode!=='play') return;
  var h=U.xpKey||engXpGeneral(); if(!h) return;   /* r4: 넘긴 설명이 없으면 이 단계의 일반 '왜?' */
  var c=document.createElement('div'); c.className='xp-card'; c.id='xpCard'; c.setAttribute('role','note'); c.innerHTML=h; $('#xpRow').appendChild(c);
  $('#xpBtn').setAttribute('aria-expanded','true');
  if(!RM) c.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:180});
}
/* r4: 이 단계의 일반 '왜?' — GAME.explain.general(G)(글 | {why, def, page}) → 없으면 단계 시작 대사 + 이번 규칙 칸 글 */
function engXpGeneral(){
  if(typeof XPC.general==='function'){ var g=XPC.general(G); if(g) return xpHtml(g); }
  var rc=engRC(G.si).map(function(c){ return c[1]; }).filter(Boolean).join(' · ');
  return xpHtml({why:engSay0(G.si)||engStg()[G.si].name, def:rc?'이번 규칙: '+rc:''});
}
/* 틀린 놓기 기본 동작: reasons[why 코드]가 있으면 대상 옆에 짧은 한 줄(bounce, 기본 '다시!')만 띄우고 이유는 '왜?'에 둔다 */
function xpBounce(r,src,dst){
  if(!XPC||!XPC.reasons||r.why==null) return; var rs=XPC.reasons[r.why]; if(rs==null) return;
  U.xpCur=rs;
  var line=(typeof rs==='object'&&rs.line!=null)?rs.line:('bounce' in XPC?XPC.bounce:'다시!');
  if(!line) return;
  var dup=(U.callNow&&U.callNow.html===line)||U.callQ.some(function(c){ return c.html===line; }); if(dup) return;   /* 연달아 틀려도 쌓지 않는다 */
  callout(line, dst&&dst!=='none'?dst:src);
}

function handle(evs){
  evs.forEach(function(e){
    if(e.t==='name') callout(GAME.names[e.k], e.at);
    else if(e.t==='badge') toast(e.k);
    else if(e.t==='explain' && XPC) xpSet(e.k!=null ? (XPC.reasons||{})[e.k] : (e.html!=null ? e.html : e));
    else if(e.t==='stageEnd') onStageEnd();
    else if(GAME.onEvent) GAME.onEvent(e, FX);
  });
}
/* 점수 장부(블라인드 11-07): G.score가 실제로 오른 양을 시각과 함께 적어 두고, FX.score가 +n을 띄울 때 최근 2.5초 안에 오른 만큼에서만 꺼내 쓴다.
   게임이 점수 안 오른 수(틀린 짐작 등)에 FX.score를 불러도 +n이 뜨지 않는다. U가 새로 만들어지면(reset) 장부도 비워진다 */
function engScoreSeen(){ var s=G.score, L=U.scLast; U.scLast=s; if(L==null||!(s>L)) return; (U.scLog||(U.scLog=[])).push({t:performance.now(), n:s-L}); }
function engScoreTake(pts){ var now=performance.now(), L=U.scLog||[], got=0; pts=+pts||0;
  for(var i=0;i<L.length && got<pts;i++){ if(now-L[i].t>2500){ L[i].n=0; continue; } var k=Math.min(L[i].n, pts-got); L[i].n-=k; got+=k; }
  U.scLog=L.filter(function(x){ return x.n>0 && now-x.t<=2500; }); return got; }
function bumpScore(){ var b=$('#score'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }

function commit(src,dst,via,gh){
  var T=U.tr&&U.tr.phase==='wait'?U.tr:null;
  if(T && !(src===T.mv.src && dst===T.mv.dst)) return tryBounce(src,dst,gh);   /* '해 보기'에서 다른 수는 LOGIC에 보내지 않고 튕긴다(틀릴 수 없음) */
  var s0=G.score, G0=G, cn=U.callN, pt=U.dropPt; U.dropPt=null; U.actAt=performance.now();   /* r5: 행동 시각 */ if(T && typeof GAME.tryPts==='number') U.trPts=GAME.tryPts;
  var r=drop(G,src,dst,via);
  if(T && r.ok && U.trPts!=null){ r.G.score=s0+U.trPts; }
  if(XPC){ xpClose(); U.xpCur=null; }   /* 넘겨 둔 설명은 다음 놓기까지만 */
  if(r.ok){
    G=r.G; engScoreSeen(); U.lastAct=U.okAt=performance.now(); U.okN++; U.bounces=0; U.didKinds[engTryKind({src:src,dst:dst})]=1;
    if(!via){ U.hint=0; U.hintMv=null; clearRings(); hintFingerStop(); hintBtn(); }
    var to=SCENE.rectOf(G,dst); if(gh&&to) flyGhost(gh,to,220); else if(gh) gh.remove();
    handle(r.ev); U.trPts=null;
    if(XPC) xpSync();
    if(T && U.tr===T) tryAfter(T,dst);

function tryMove(T){

  if(t && t.tap!=null){ if(!SCENE.rectOf(G,t.tap)) return null; var mt={src:t.tap, dst:t.dst!=null?t.dst:t.tap}, dk=engTryDup(T,t,mt,t.tap); return dk ? engTrySkip(T,'dup:'+dk) : {mv:mt, tap:t.tap, label:lab}; }

/* 같은 종류를 이미 해 봤으면 그 종류(글), 아니면 null. {force:true}면 늘 null */

/* 이 해 보기를 건너뜀: 배열이면 다음 것으로(null = 기다림), 아니면 이 단계는 해 보기 없음(false). 까닭은 U.trSkip[si](check가 읽음) */
function engTrySkip(T,why){

/* 매 프레임(플레이 중). true = 이번 프레임은 시간을 멈춘다 */

    if(T.nb && now<T.nb) return false;   /* 배열의 다음 해 보기: 앞 이름표가 먼저 보이게 잠깐 보통 플레이 */   /* 할 수가 아직 없으면(주문이 아직 안 옴 등) 시간을 흘려 기다린다, 최대 6초. {later:true}면 보통처럼 놀며 끝없이 기다림 */
    if(T.late && (U.drag||U.sel||U.busy)) return false;   /* 나중 해 보기: 하던 끌기·힌트 비행은 끝나고 나서 */
    if(T.late && now-U.downAt<900) return false;   /* r4: 학생이 방금 누른 것의 결과가 먼저 보이게(누르자마자 손가락이 뜨지 않게) */
    if(now-T.t0>=1600 && (now-T.t0>=2600 || !ovl.querySelector('.ribbon'))) tryEnter(T,m);   /* 단계 리본이 다 걷힌 뒤(r5: 사라지는 0.25초 동안 해 보기 빛 칸과 겹쳤다 → 리본이 없어질 때까지, 최대 2.6초) */

function tryEnter(T,m){

/* 흐린 막 + 구멍(집을 것·놓을 곳) + 힌트와 같은 테두리·화살표(§11) */

/* 장면 누름(pointerdown). true = 여기서 처리함 */

/* ---------- 끌어다 놓기 (탭→탭도 됨). 게임의 동작은 이것 하나: sources(G)의 하나를 targets(G)의 하나에 놓는다 ---------- */
sceneEl.addEventListener('pointerdown',function(e){

  if(U.mode==='play'){ U.downAt=U.lastAct=performance.now(); }   /* r4: 누른 직후에는 손가락이 저절로 나오지 않는다(maybeDemo) */

/* ---------- 결과: 큰 점수, 칭호, 기록 막대('처음엔 모두 0'), 공식 한 줄, 배지 선반, 다음 시간 질문 ---------- */

}
function results(){
  U.mode='result'; tryClear(); stopDemo(); clearOvl(); panelAll(); $('#combo').classList.remove('on'); U.comboT=0;
  $('#stgName').textContent='결과'; $('#stgPips').innerHTML='';
  var R=GAME.result, sc=G.score, CH=ENG_CHON, prev=BEST, rec=sc>prev&&prev>0, fresh=false, left;
  if(CH){   /* §19 도전 결과: 큰 글 하나('도전 3 성공!' / '아깝다!' / '도전 3') + 별 + 점수와 목표 막대. 버튼 [다시 하기 | 도전 n+1 또는 다시] */
    var lv=ENG_CHLV, goal=ENG_CHGOAL, pass=sc>=goal, near=!pass&&sc>=goal*ENG_CHNEAR, st=ENG_CHR.stars(sc,goal), pb=ENG_CHM.best[lv]||0;
    var mx=ENG_CHR.max(), all=pass&&mx>0&&lv>=mx;   /* §19-추론형: 최고 레벨을 깨면 완주(다음 레벨 없음, 버튼은 '다시') */
    ENG_CHM.best[lv]=Math.max(pb,sc); ENG_CHM.open=true; if(pass){ ENG_CHM.top=Math.max(ENG_CHM.top,lv); ENG_CHM.lv=Math.max(ENG_CHM.lv,mx?Math.min(mx,lv+1):lv+1); } if(all) ENG_CHM.all=1; engChSave();
    U.chRes={lv:lv, goal:goal, pass:pass, near:near, stars:st, score:sc, next:pass&&!all?lv+1:lv, all:all};
    left='<div class="rcard l eng-chres'+(pass?' pass':'')+'"><div class="ttl eng-big'+(pass||near?' eng-new':'')+'">'+(all?'모든 도전 완주!':pass?engChLab(lv)+' 성공!':near?'아깝다!':engChLab(lv))+'</div>'
      +(pass?'<div class="eng-stars">'+[1,2,3].map(function(i){ return engStar(i<=st); }).join('')+'</div>':'')
      +'<div class="num" id="rnum">0</div><div class="eng-goal"><div class="eng-gbar"><i style="transform:scaleX('+Math.min(1,sc/goal).toFixed(3)+')"></i></div><span>목표 '+goal+'</span></div>'
      +'<div class="btns"><button class="btn2" id="again">다시 하기</button><button class="btn2 eng-ch pri'+(near?' new':'')+'" id="engCh">'+engChIcon()+(pass&&!all?'도전 '+(lv+1):'다시')+'</button></div></div>';
  } else {
    BEST=Math.max(BEST,sc); if(CHC){ ENG_CHM.open=true; engChSave(); }   /* §19: 도전은 처음부터 열려 있음(2026-11-07 잠금 폐지) → '열렸다' 효과 없음 */
    left='<div class="rcard l"><div class="lab">최종 점수</div><div class="num" id="rnum">0</div><div class="ttl">'+GAME.titleOf(sc)+'</div><div class="rec">'+(rec?'신기록! 전 기록 '+prev:(prev>0&&prev!==sc?'이 화면 최고 '+BEST:''))+'</div>'
      +'<div class="btns"><button class="btn2 pri" id="again">다시 하기</button>'+(CHC?'<button class="btn2 eng-ch'+(fresh?' new':'')+'" id="engCh">'+engChIcon()+'도전 '+ENG_CHM.lv+'</button>':engPairBtn())+'</div></div>';   /* 결과 버튼은 [다시 하기 | 도전] 둘만. 처음으로는 HUD ⟲ */
  }
  var rows=R.rows(G), mx=Math.max.apply(null,[1].concat(rows.map(function(r){ return r[1]; })));
  var d=document.createElement('div'); d.className='res';
  if(CH){   /* 블라인드(11-07): 도전 결과 오른쪽에 일반 판 막대·회색 배지가 나와 '못 얻음'처럼 보임 → 도전 기록(레벨 사다리 1~최고 레벨)만, 배지 칸 숨김.
       깬 레벨 = 그 레벨 최고 점수의 별 수, 이번 레벨 = 주황 테두리. maxLevel이 없으면 지금까지 깬 레벨 + 다음 하나 */
    var cr=U.chRes, N=ENG_CHR.max()||Math.max(ENG_CHM.top+1, cr.lv), lad='';
    for(var li=1; li<=N; li++){ var dn=li<=ENG_CHM.top, ns=dn?Math.max(1,ENG_CHR.stars(ENG_CHM.best[li]||0, ENG_CHR.goal(li))):0;
      lad+='<div class="eng-lv'+(dn?' done':'')+(li===cr.lv?' cur':'')+'"><b>'+li+'</b>'+(dn?'<span class="eng-ls">'+[1,2,3].map(function(i){ return engStar(i<=ns); }).join('')+'</span>':'')+'</div>'; }
    d.innerHTML=left+'<div class="rcard eng-chrec"><div class="rh">도전 기록<small>깬 도전 '+ENG_CHM.top+(ENG_CHR.max()?' / '+ENG_CHR.max():'')+'</small></div><div class="eng-lad">'+lad+'</div></div>';
  } else
  d.innerHTML=left
   +'<div class="rcard"><div class="rh">'+R.label+'<small>'+R.note+'</small></div><div class="bars">'+rows.map(function(r){ return '<span>'+r[0]+'</span><div class="bar"><i data-v="'+(r[1]/mx)+'"></i></div><b>'+r[1]+'</b>'; }).join('')+'</div>'
   +resultArt(R)+'<div class="formula">'+R.formula+'</div>'+shelfHtml(null)+'<div class="nextq">배지를 누르면 뜻이 나와요.<br>'+R.next+'</div></div>';
  $('#main').appendChild(d); $('#main').classList.add('showres');
  d.querySelectorAll('[data-bd]').forEach(function(x){ x.onclick=function(){ badgeModal(x.dataset.bd); }; });
  $('#again').onclick=function(){ reset(); G=start(G); var t=ovl.querySelector('.ribbon'); if(t) t.remove(); beginStage(); };
  if($('#engCh')) $('#engCh').onclick=function(){ engChStart(CH ? U.chRes.next : ENG_CHM.lv); };
  say(R.say); setBtn(null);
  requestAnimationFrame(function(){ d.querySelectorAll('.bar i').forEach(function(i){ i.style.transform='scaleX('+i.dataset.v+')'; }); });
  var t0=performance.now(), g=GEN; (function roll(){ if(g!==GEN) return; var p=Math.min(1,(performance.now()-t0)/(RM?1:900)); var n=$('#rnum'); if(n) n.textContent=Math.round(sc*p); if(p<1) requestAnimationFrame(roll); })();
}

/* ---------- 버튼 ---------- */
$('#bReset').innerHTML=iconSvg('icReset'); $('#bRules').innerHTML=iconSvg('icRules')+'<span>규칙</span>'; $('#bBadges').innerHTML=iconSvg('icMedal')+'<span>배지</span>';
$('#bRules').classList.add('lb'); $('#bBadges').classList.add('lb');
$('#bReset').onclick=confirmReset; $('#bRules').onclick=rulesModal; $('#bBadges').onclick=function(){ badgeModal(null); };
$('#bHint').onclick=doHint;
if(XPC) $('#xpBtn').onclick=xpToggle;

/* ---------- 한 개의 rAF 루프: tick → renderScene → 오버레이 맞춤. 화면이 안 보이면 멈춘다 ---------- */
var LAST=performance.now(), RAF=0;
function frame(now){
  var dt=Math.min(0.1,(now-LAST)/1000); LAST=now;
  var frz = U.mode==='play' && tryFrame(now,dt);   /* '해 보기' 동안 게임 시간은 멈춘다 */
  if(U.mode==='play' && !U.paused && !frz){ if(ENG_CHON) engChMark(G); var r=tick(G, ENG_CHON?Math.min(0.1,dt)*ENG_CHSPD:dt); G=r.G; engScoreSeen();   /* §19 도전: 시간 배속(LOGIC에 넘기는 dt만 키움) */
    if(r.ev.length) handle(r.ev); }
  SCENE.renderScene(G);
  syncRings(); if(U.mode==='play'){ unblockOverlays(now); hintCheck(now); hintFingerStep(now); hintArrowSync(); }
  if(U.shown!==G.score && !engHeld(now)){ U.shown += Math.ceil((G.score-U.shown)/4); if(U.shown>G.score) U.shown=G.score; $('#score').textContent=U.shown; }
  if(U.comboT && now-U.comboT>GAME.comboWin*1000){ U.comboT=0; $('#combo').classList.remove('on'); }
  maybeDemo(now); progTag(now); engTxtPump(now);
  if(XPC) xpSync();
  RAF=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',function(){ if(document.hidden){ cancelAnimationFrame(RAF); RAF=0; } else if(!RAF){ LAST=performance.now(); RAF=requestAnimationFrame(frame); } });
window.addEventListener('resize',function(){ clearRings('.ring:not(.bad)'); if(U.hint&&U.hintMv) hintShow(U.hintMv,U.hint,false); if(U.tr&&U.tr.phase==='wait') trySpot(U.tr,false); });

engChLoad();
reset();
RAF=requestAnimationFrame(frame);
</script>
